# ---------- 가설 (AI가 사실에서 뽑음, 사후 설명) ----------
[[hypothesis]]
id = "H_sims_purpose_not_content"
text = "책에서 넘어간 것은 내용(패턴 253개)이 아니라 책의 목적('보통 사람이 직접 설계한다')이다. 게임은 그 목적을 플레이어의 자리(짓기 모드, 만들기 도구)로 바꿨다"
source = "ai (2026-10-19, F_apl_book·F_sims_origin·F_sims_player_designer에서)"
evidence = ["F_apl_book", "F_sims_origin", "F_sims_player_designer"]

[[hypothesis]]
id = "H_sims_people_over_subject"
text = "책의 주제(집)는 무대가 되고, 재미는 그 무대에서 움직이는 사람에게서 나왔다. 비문학의 주제를 그대로 놀이로 삼기보다, 주제가 사람 행동에 미치는 영향을 놀이로 삼아야 한다"
source = "ai (2026-10-19, F_sims_pivot에서)"
evidence = ["F_sims_pivot", "F_sims_origin"]

[[hypothesis]]
id = "H_sims_many_sources"
text = "책 한 권의 각색이 아니다. 건축서·심리학 논문·인지 지도 책·만화 이론서를 섞어 하나의 모형을 만들었고, 그래서 책 이름을 내걸 이유가 없었다"
source = "ai (2026-10-19, F_sims_ai_sources에서)"
evidence = ["F_sims_ai_sources"]

[[hypothesis]]
id = "H_sims_toy"
text = "이기는 조건이 없는 장난감 구조가 성공에 중요했다: 플레이어가 목표를 스스로 정하고 이야기를 스스로 만든다(뜻 없는 말 Simlish처럼 추상화된 표현이 그 빈자리를 남긴다)"
source = "ai (2026-10-19, F_sims_rules·F_sims_ai_sources에서)"
evidence = ["F_sims_rules", "F_sims_ai_sources"]

# ---------- 가설: 여러 게임을 가로지름 (AI, 성공 쪽 기록으로 세움 → 망한 게임 기록으로 시험) ----------
[[hypothesis]]
id = "H_ng_kind_transfer"
text = "문학 바탕은 이야기·인물·세계관이 넘어가고(S_src_story), 비문학 바탕은 모형·데이터·기록이 넘어간다(S_src_model / S_src_data / S_src_record 중 하나)"
source = "ai (2026-10-19, docs/nonfiction-games-v0.md 모양 1)"
evidence = ["F_g_simcity", "F_sims_ai_sources", "F_g_twom", "F_g_witcher3", "F_g_wukong"]
check = "kind_transfer"

[[hypothesis]]
id = "H_ng_model_success"
text = "바탕의 인과 모형을 규칙으로 옮긴(S_src_model=예) 비문학 게임은 잘 된다(성공 이상)"
source = "ai (2026-10-19, docs/nonfiction-games-v0.md 모양 2)"
evidence = ["F_g_simcity", "F_sims_reception", "F_g_plague", "F_g_kerbal", "F_g_paperclips"]
against = ["F_g_simant", "F_g_walden"]
check = "model_success"
note = "세울 때 이미 반례 둘(SimAnt 보통, Walden 보통)이 있다 — 모형만으로는 모자라고 다른 조각이 더 있다는 뜻일 수 있다"

[[hypothesis]]
id = "H_ng_named_small"
text = "바탕 책·이론의 이름을 내건(S_named=예) 비문학 게임은 크게 성공하지 못한다"
source = "ai (2026-10-19, docs/nonfiction-games-v0.md 모양 4)"
evidence = ["F_g_walden"]
check = "named_small"
note = "근거가 Walden 하나뿐이고, 이름을 내건 사례 자체가 드물다(선택 편향 주의). 문학은 이름을 내걸고도 크게 성공했다(Witcher 3, Wukong)"

[[hypothesis]]
id = "H_ng_record_people"
text = "기록·증언이 바탕인(S_src_record=예) 게임은 놀이 중심이 사람의 행동·선택일 때(S_people_play=예) 잘 된다"
source = "ai (2026-10-19, docs/nonfiction-games-v0.md 모양 6)"
evidence = ["F_g_twom", "F_g_valiant", "F_g_burymelove"]
check = "record_people"

[[hypothesis]]
id = "H_ng_one_rule_free"
text = "주장 하나를 규칙 하나로 보여 주는(S_one_rule=예) 게임은 무료·짧은 체험으로 퍼지고, 상업적으로 크게 성공하지 않는다"
source = "ai (2026-10-19, docs/nonfiction-games-v0.md 모양 5)"
