# 비문학 기반 게임 — 잘 된 게임의 성공 논리
# 출처: 2026-10-19 대화(사용자 목표·결정), 영어 위키백과 원문(사실, 2026-10-19 확인), docs/nonfiction-games-v0.md
# 사실은 출처에서 확인한 것만. 사용자 경험은 관찰로. AI가 사실에서 뽑은 설명은 가설(source = "ai")이고, 성공 사례만 보고 세운 사후 설명이다.

[domain]
id = "nonfiction_games"
name = "비문학 기반 게임"

# ---------- 목표 (사용자) ----------
[[goal]]
id = "G_new_genre"
text = "비문학(책·논문·기록)을 바탕으로 한 새 게임 장르를 연다"

[[goal]]
id = "G_success_logic"
text = "잘 된 게임의 성공 논리를 작은 조각으로 쪼개, 비문학에 대 볼 수 있게 한다"
parent = "G_new_genre"

# 사용자 말 "잘 된 게임들"과 판단 기준 결정(해 본 게임은 사용자, 아니면 대중·전반 평가)에서 — 성공의 잣대
[[goal]]
id = "G_well_received"
text = "비문학으로 만든 게임이 잘 된다 (해 본 사람의 판단, 아니면 대중·전반 평가로)"
parent = "G_new_genre"

