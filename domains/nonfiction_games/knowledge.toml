# ---------- 규칙: 성공 사례에서 뽑은 방법 (전부 가설 — 망한 게임에 대 보기 전) ----------
[[rule]]
id = "R_ng_model_to_rules"
version = 1
status = "hypothesis"
method = "비문학을 게임으로 옮길 때는 결론을 들려주지 않고, 그 결론을 낳는 인과 모형을 규칙으로 만들어 플레이어가 직접 굴려 보게 한다"
reason = "플레이어는 모형을 움직여 결론에 스스로 닿는다. 크게 성공한 비문학 게임(도시·사람·전염병·궤도 시뮬레이션)이 모두 이 모양이고, 평론도 '이해에 도움'을 꼽았다"
serves = ["G_well_received", "G_new_genre"]
conditions = ["S_src_model"]
evidence = ["F_g_simcity", "F_sims_ai_sources", "F_g_plague", "F_g_kerbal", "F_g_trust"]
against = ["F_g_simant", "F_g_walden"]
note = "반례 둘이 보통이었다 — 모형을 옮기는 건 필요조건일 뿐 충분조건이 아닐 수 있다. 망한 게임에 대 볼 때 무엇이 더 필요한지 본다 (2026-10-19, ai)"

[[rule]]
id = "R_ng_subject_as_stage"
version = 1
status = "hypothesis"
method = "비문학의 주제(집·전쟁·피란)는 무대로 두고, 놀이는 그 무대에 놓인 사람의 행동·관계·선택으로 만든다"
reason = "재미는 주제 자체보다 주제가 사람에게 미치는 영향에서 나왔다. 건축 시뮬레이터로 시작한 게임이 사람 쪽으로 무게를 옮겨 크게 성공했고, 전쟁 기록 게임들은 전투가 아니라 민간인·병사의 삶을 다뤄 성공했다"
serves = ["G_well_received", "G_new_genre"]
conditions = ["S_people_play"]
evidence = ["F_sims_pivot", "F_g_twom", "F_g_valiant", "F_g_burymelove"]

[[rule]]
id = "R_ng_data_as_pieces"
version = 1
status = "hypothesis"
method = "바탕의 데이터·사실은 모으고 조합하는 놀이 요소(카드·수치·점수)로 바꾼다"
reason = "사실 하나하나가 플레이어가 고르고 쓰는 단위가 되면, 외우지 않아도 사실이 손에 남는다. 조류 데이터 카드, 실제 사건 카드, 단백질 에너지 점수가 그 예다"
serves = ["G_well_received", "G_new_genre"]
conditions = ["S_src_data"]
evidence = ["F_g_wingspan", "F_g_twilight", "F_g_foldit"]

[[rule]]
id = "R_ng_purpose_as_seat"
version = 1
status = "hypothesis"
method = "책이 독자에게 바라는 태도·목적을 플레이어의 자리(역할)로 만든다"
reason = "'보통 사람이 직접 설계한다'는 책의 목적이 플레이어를 설계자로 앉힌 짓기 모드·만들기 도구가 됐고, '자급하며 살아 본다'는 책의 실험이 생존 규칙이 됐다"
serves = ["G_well_received", "G_new_genre"]
conditions = ["S_src_purpose"]
evidence = ["F_apl_book", "F_sims_player_designer"]
against = ["F_g_walden"]
note = "Walden은 이 방법을 썼는데 대중 규모는 작았다(상은 많음). 잘 되는 데는 다른 조각이 더 필요할 수 있다 (2026-10-19, ai)"

[[rule]]
id = "R_ng_real_contribution"
version = 1
status = "hypothesis"
method = "플레이어의 결과가 실제 연구에 쓰이게 하면, 그 쓰임 자체를 놀이의 의미로 내세운다"
reason = "플레이어가 푼 퍼즐이 논문이 되고 실제 분자로 합성됐다. 재미보다 '내가 기여했다'가 동기가 된 경우"
serves = ["G_new_genre"]
conditions = ["S_player_contrib"]
evidence = ["F_g_foldit", "F_g_eterna"]
note = "잘 됐다는 근거가 대중 반응이 아니라 과학 성과라 G_well_received에는 잇지 않았다 (2026-10-19, ai)"
