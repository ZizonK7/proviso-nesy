[[fact]]
id = "F_r_detective_vision_failures"
text = "'다 보여 주는 탐정 시야'의 실패 사례(원문 인용): Batman Arkham — '추리가 완전히 자동화되어 플레이어는 게임이 대신 관찰한 것을 보기만 한다'(AV Club), 플레이어가 X선 시야로만 플레이해 레벨 디테일을 놓쳤고 다음 작은 줄이겠다(Rocksteady 아트 디렉터, 2010). Chapter One — 쉬운 모드는 핫스팟 표시, 어려운 모드도 버튼 하나로 전부 스캔해 두 모드 차이가 없다(Adventure Game Hotspot). Sinking City — 화면 모서리 신호가 너무 약해 놓치고 '추리 대신 집집마다 신호를 찾아 뛰어다닌다'(GamesRadar). Painscreek — 힌트·마커 없음이 '인내심 시험'(Thumbsticks). 대안: 시야에 대가를 두는 것(MGS 열감지 고글은 카메라 고정), 끄기 옵션(Far Cry Primal), 환경 설계로 유도(Destiny)"
checked = 2026-10-26
source = "조사 p71 — avclub.com, gameinformer.com 2010, adventuregamehotspot.com, gamesradar.com, thumbsticks.com, gameluster.com"

[[fact]]
id = "F_r_deduction_validation_principles"
text = "추리 검증의 설계 원칙(원문 인용): ① 플레이어가 입력하기 전에는 검증하지 않는다, 틀린 입력은 가설을 시험하는 과정이므로 비용이 낮아야 한다, 힌트·은근한 지지는 괜찮다(Film Stories '세 기둥'). ② 전체를 한 번에 맞다/틀리다로 판정하면 어디가 틀렸는지 몰라 좌절한다 — Golden Idol 초기 빌드의 실패, 최종은 같은 결론에 다른 단서로도 닿게 하고 단서를 숨겨 관찰을 강제했다(개발자 글). ③ 즉시 검증은 무작위 대입을 부르므로 Obra Dinn은 세 명 묶음이 맞을 때만 확정했다, 다만 목록 항목 자체가 힌트가 된다(Film Stories). ④ 검증 장치가 정답을 드러내지 않게 하는 것이 가장 어렵다(같은 글). ⑤ Alan Wake 2는 자유 추리 보드가 테스트에서 실패해 '새 단서를 손에 쥐어 주고 질문 슬롯에 놓는' 구조로 바꿨고 배치 규칙(조건·잠금 해제)으로 경로를 여럿 열었다(Remedy 인터뷰)"
checked = 2026-10-26
source = "조사 p71 — filmstories.co.uk 두 글, gamedeveloper.com Golden Idol·Alan Wake 2 글"

[[fact]]
id = "F_r_player_vs_game_share"
text = "선례의 몫 나누기: Crimes & Punishments는 플레이어가 보드에서 단서를 잇고 결말이 갈린다, 게임은 숨은 증거를 강조(건너뛰기 버튼 있는 부속 퍼즐은 '덧붙인 느낌'). Chapter One은 핀 고정으로 경로가 열리나 무엇을 핀해야 하는지 불명확. L.A. Noire는 표정 판단과 고발 근거를 플레이어가, 논리가 '다소 자의적'. Obra Dinn은 로그북 기본 정보만 자동, 신원 특정이 핵심 긴장(Pope). Shadows of Doubt는 정보 입구가 여럿(DB·탐문·지문·CCTV). Paradise Killer는 증거를 인물 파일에 자동 연결, 증거 없이도 재판 가능, 충분한지 알려 주지 않음. Her Story는 키워드→영상 플로차트"
checked = 2026-10-26
source = "조사 p71 — 리뷰·인터뷰 원문 29건(보고서 A-1~A-12)"

