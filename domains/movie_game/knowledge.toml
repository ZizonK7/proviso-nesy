text = "1인이 만든 추리·미스터리 게임 선례: Return of the Obra Dinn(Lucas Pope, Unity, 1비트 디더링 3D), Blue Prince(Tonda Ros, 8년, 고유 화풍에 약 3년, Unity), The Roottrees Are Dead 원작(Jeremy Johnston이 11개월, Unity, 코르크 보드 UI). Shadows of Doubt(ColePowered Games)의 1인 여부는 2차 보도 기준"
checked = 2026-10-26
source = "조사 p65·p66 — 위키백과 원문(Return_of_the_Obra_Dinn, Blue_Prince, The_Roottrees_are_Dead, Shadows_of_Doubt)"

