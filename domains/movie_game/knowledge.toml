# ---------- 가설 (AI 판단, 2026-10-26. 사용자 판정 전) ----------
[[hypothesis]]
id = "H_code_made_look"
text = "그림을 직접 그리지 못하는 1인 개발에서는 코드로 내는 화풍(셰이더·디더링·타이포·종이 질감 레이아웃)이 그림 중심 화풍(손그림·회화풍·사실적 3D)보다 화면 전체의 일관성을 지키기 쉽고 비용이 적다"
source = "ai"
status = "retired"
replaced_by = "H_own_art_with_code_frame"
conditions = ["S_solo_no_art"]
evidence = ["F_r_solo_precedents", "F_r_outsourcing_rates", "F_r_ai_art_terms"]
against = ["F_r_duo_precedents"]
serves = ["G_design"]
test_plan = "(물림) 조건 S_solo_no_art가 사실이 아니어서 시험 대상이 아니다"
note = "2026-10-26 AI 판단 → 같은 날 물림: 조건으로 둔 전제(그림을 못 그린다)가 틀렸다(O_user_can_draw). 반박이 아니라 조건 불성립. 주장 자체는 그림을 못 그리는 다른 분야·사람에게는 남아 있을 수 있어 지우지 않고 보존"

[[hypothesis]]
id = "H_own_art_with_code_frame"
text = "그림을 직접 그릴 수 있는 1인 개발에서는, 장면·인물은 직접 그린 그림(수채·먹선 등 손그림 질감)으로 하고 추리 도구(보드·카드·메모·글자)는 코드와 타이포그래피로 짜는 조합이 '셜록 영화 같은 느낌'과 '1인이 완성할 수 있는 양' 둘을 가장 잘 잇는다. 그림 양은 장면 수가 정하므로 장면 수를 먼저 정한다"
source = "ai"
conditions = ["S_solo_dev_can_draw"]
evidence = ["F_r_duo_precedents", "F_r_solo_precedents", "F_r_deduction_ui", "O_user_can_draw"]
against = ["F_r_realistic_3d_scale"]
serves = ["G_design", "G_player_reason"]
test_plan = "같은 장면(221B 거실, 의뢰인을 처음 보는 순간)을 세 갈래 시안으로 만들어 사용자 판정: 어느 쪽이 셜록 영화 같은가, 어느 쪽을 직접 그려 채울 수 있겠는가. 그 뒤 실제로 그린 장면 하나를 넣어 본다"
note = "2026-10-26 AI 판단. 2인 선례(Golden Idol·Strange Horticulture·Tangle Tower)가 '개발자 + 아티스트' 조합인데, 사용자는 둘을 한 사람이 하는 경우라서 양(장면 수)이 변수. 로컬 AI(RTX 4060)는 밑그림·변형·배경 보조로 쓸 수 있으나 가능 범위는 미확인"

[[hypothesis]]
id = "H_pieces_board_serves_reasoning"
text = "단서를 조각으로 화면에 놓고 플레이어가 직접 잇거나 채우게 하는 장치(사건판·이름 타일·로그북·가계도)가, 단서를 자동으로 띄워 주는 장치(화면 위 글자 연출·자동 스캔)보다 '플레이어가 머리를 쓴다'와 '셜록이 다 하지 않는다'에 맞는다"
source = "ai"
evidence = ["F_r_deduction_ui"]
serves = ["G_player_reason", "G_balance"]
test_plan = "종이 프로토타입이나 첫 화면 시안으로 사용자 판정: 어느 장치에서 '내가 추리했다'는 느낌이 들었나. 화면 위 글자 연출은 셜록의 명석함을 보여 주는 연출로 따로 쓰일 수 있어, 둘을 섞는 방법도 시안에 넣는다"
note = "2026-10-26 AI 판단. 이 가설은 디자인 갈래와 별개로 UI 장치를 고르는 기준"
