[[fact]]
id = "F_r_player_vs_game_share"
text = "선례의 몫 나누기: Crimes & Punishments는 플레이어가 보드에서 단서를 잇고 결말이 갈린다, 게임은 숨은 증거를 강조(건너뛰기 버튼 있는 부속 퍼즐은 '덧붙인 느낌'). Chapter One은 핀 고정으로 경로가 열리나 무엇을 핀해야 하는지 불명확. L.A. Noire는 표정 판단과 고발 근거를 플레이어가, 논리가 '다소 자의적'. Obra Dinn은 로그북 기본 정보만 자동, 신원 특정이 핵심 긴장(Pope). Shadows of Doubt는 정보 입구가 여럿(DB·탐문·지문·CCTV). Paradise Killer는 증거를 인물 파일에 자동 연결, 증거 없이도 재판 가능, 충분한지 알려 주지 않음. Her Story는 키워드→영상 플로차트"
checked = 2026-10-26
source = "조사 p71 — 리뷰·인터뷰 원문 29건(보고서 A-1~A-12)"

