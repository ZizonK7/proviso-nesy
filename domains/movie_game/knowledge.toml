text = "추리 검증의 설계 원칙(원문 인용): ① 플레이어가 입력하기 전에는 검증하지 않는다, 틀린 입력은 가설을 시험하는 과정이므로 비용이 낮아야 한다, 힌트·은근한 지지는 괜찮다(Film Stories '세 기둥'). ② 전체를 한 번에 맞다/틀리다로 판정하면 어디가 틀렸는지 몰라 좌절한다 — Golden Idol 초기 빌드의 실패, 최종은 같은 결론에 다른 단서로도 닿게 하고 단서를 숨겨 관찰을 강제했다(개발자 글). ③ 즉시 검증은 무작위 대입을 부르므로 Obra Dinn은 세 명 묶음이 맞을 때만 확정했다, 다만 목록 항목 자체가 힌트가 된다(Film Stories). ④ 검증 장치가 정답을 드러내지 않게 하는 것이 가장 어렵다(같은 글). ⑤ Alan Wake 2는 자유 추리 보드가 테스트에서 실패해 '새 단서를 손에 쥐어 주고 질문 슬롯에 놓는' 구조로 바꿨고 배치 규칙(조건·잠금 해제)으로 경로를 여럿 열었다(Remedy 인터뷰)"
