text = "이야기를 줄거리 층(사건마다 진실·인물·거짓말의 이유·단서 후보·씨앗)과 장면 층(대사·핫스팟·보드 문장)으로 나누어, 줄거리 층은 사건 전체를 먼저 쓰고 장면 층은 플레이 규칙이 굳은 뒤 사건마다 쓰면, 앞 사건에 심어야 할 것을 늦게 발견하는 일과 플레이에 안 맞는 장면을 뜯는 일을 둘 다 줄인다"
source = "ai"
evidence = ["O_user_plot_before_scenes", "O_user_story_sealed"]
serves = ["G_story_converges", "G_story"]
test_plan = "사건 2 장면 층을 쓸 때 판정: 줄거리 층에서 정한 진실·단서 후보가 장면에서 바뀌는 비율(사건 1에서는 플레이 피드백 뒤 거짓말 이유·질문 계기가 바뀌었다). 사건 4~6에서 앞 사건을 고쳐야 하는 일이 생기는지. 사용자 플레이 판정"
note = "2026-10-29 사용자 제안 → AI가 두 층으로 나눔 → 줄거리 v1→v3(비평 2회차 50+12건 반영). H_story_fixed_end_open_cases의 '사건은 하나씩'을 장면 층에만 적용하는 개정"
