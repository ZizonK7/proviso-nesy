# 뮤직 플레이어 '알아서 틀기' — 경험 지식
# 출처: 2026-10-14 대화, music_player DECISIONS.md 13번, src/js/smart.js (@8445c93)

[domain]
id = "music_player"
name = "뮤직 플레이어 (알아서 틀기, 재생 순서)"

# ---------- 목표 ----------
[[goal]]
id = "G_flow"
text = "알아서 틀기는 내 재생 기록에 맞는 흐름을 만든다"

[[goal]]
id = "G_diversity"
text = "알아서 틀기에서는 같은 곡이 다시 나오지 않아 다양성이 유지된다"
parent = "G_flow"

[[goal]]
id = "G_mode_visible"
text = "곡 순서를 바꾸는 재생 방식(셔플)이 켜져 있으면 화면에서 알 수 있다"
source = "user"
note = "2026-10-19: 폰에서 순서가 갑자기 무작위로 나오는데 표시가 없다는 경험 → '셔플은 계속 켜 두되 표시'를 고름(셔플을 한 번만 적용하는 안 대신)"

# ---------- 사실 (코드에서 확인) ----------
[[fact]]
id = "F_smart_impl"
text = "바퀴 단위로 돈다. 이번 바퀴에 안 나온 곡에서 최대 30곡씩 한 곡씩 고르고, 남은 곡이 3곡 이하면 다시 최대 30곡을 이어 붙인다. 모든 곡이 나오면 '무한히 듣기'(기본 켬)면 처음부터, 끄면 멈춘다. 고를 때는 최근 10곡(곡 수가 적으면 절반)을 쉬게 하고, 흐름·좋아함·시간대·새로움 점수에 약간의 운을 더해 상위 5곡 중 하나를 뽑는다"
checked = 2026-10-14
source = "music_player src/js/smart.js, src/js/app.js(regenSmart, extendSmart) @b401048"
note = "이전(@71f7460): 처음 30곡 뒤 20곡씩 끝없이 이어 붙임. 처음 기록 때 이어 붙이기를 빠뜨려 '30곡 대기열'로 잘못 적었다가 정정한 적 있음"

[[fact]]
id = "F_dup_window"
text = "같은 곡은 한 바퀴 안에서 다시 나오지 않는다. 바퀴가 바뀔 때도 최근 곡 쉬게 하기로 방금 들은 곡이 바로 나오지 않는다"
checked = 2026-10-14
source = "music_player @b401048 + 대기열 흐름 시뮬레이션(곡 12·30·31·75개, 무한히 듣기 켬/끔). 실제 앱 확인 전"
note = "이전(@71f7460): 직전 10곡만 막아서 같은 곡이 다시 나왔고 G_diversity를 해쳤음 → audit이 잡았고 b401048에서 고침"

[[fact]]
id = "F_shuffle_sticky"
text = "폴더 화면의 셔플을 누르면 셔플이 켜진 채로 저장되어, 다른 폴더에서 곡을 탭해도 섞여서 나온다. 재생 버튼을 누르면 꺼진다. 알아서 틀기는 셔플을 쓰지 않는다. 폰 재생 막대의 셔플 버튼은 셔플이 켜져 있을 때만(알아서 틀기 제외) 보이고, 누르면 꺼진다"
checked = 2026-10-19
source = "music_player src/js/app.js(playList, buildOrder, syncModeButtons), src/css/style.css @25d6b74"
note = "이전(@b401048): 폰 재생 막대에서 셔플 버튼을 늘 숨겨서, 켜져 있어도 표시가 없었다 → G_mode_visible을 해침. 사용자 결정대로 @25d6b74에서 고침(DECISIONS.md 25번). 실제 폰 확인 전"

# ---------- 상태 ----------
[[state]]
id = "S_many_slots"
text = "새 곡이 들어갈 수 있는 자리가 많다 (대기열 30곡)"

[[state]]
id = "S_dup_possible"
text = "대기열 안에서 같은 곡이 다시 나올 수 있다"

# ---------- 관찰 (사용자 생각·기록) ----------
[[observation]]
id = "O_decision13"
text = "셔플처럼 무작위로 섞지 않고 재생 기록으로 다음 곡을 고른다. 최근 들은 곡은 잠시 쉬고, 가끔 덜 들은 곡도 섞는다"
source = "user (music_player DECISIONS.md 13번, 2026-10-06)"

[[observation]]
id = "O_no_expectation"
text = "알아서 틀기에서 나오기를 바라면서 노래를 트는 건 자연스럽지 않다"
source = "user"
date = 2026-10-14

[[observation]]
id = "O_shuffle_surprise"
text = "폰에서 가끔 곡 순서가 갑자기 무작위로 나온다. 셔플을 누르면 그러는 것 같은데 화면에 표시가 없다"
source = "user"
date = 2026-10-19

# ---------- 규칙 ----------
[[rule]]
id = "R_M1"
version = 1
status = "retired"
replaced_by = ["R_M1b"]
method = "최근 곡은 쉬게 하고, 고를 때마다 점수에 약간의 운을 섞어 상위 5곡 중 하나를 뽑는다"
reason = "기록의 흐름을 따르되 매번 똑같지 않게, 새 곡도 가끔 올라오게"
serves = ["G_flow"]
conditions = ["S_many_slots", "F_smart_impl"]
evidence = ["O_decision13", "O_no_expectation"]
side_effects = ["S_dup_possible"]
note = "@71f7460까지의 버전. S_dup_possible이 G_diversity와 어긋남(사용자 확인 2026-10-14) → v2(R_M1b)로 고침, @b401048"

[[rule]]
id = "R_M1b"
version = 2
status = "hypothesis"
method = "바퀴 단위: 한 바퀴 안에서 곡마다 한 번씩. 안 나온 곡에서 최대 30곡씩 고르고(억지로 채우지 않음), 다 돌면 '무한히 듣기'(기본 켬)면 처음부터 다시, 끄면 멈춤. 최근 곡 쉬게 하기와 점수+운 뽑기는 그대로"
reason = "같은 곡이 나올 수 있는 순간을 '바퀴가 바뀔 때' 하나로 줄인다. 그 순간은 최근 곡 쉬게 하기가 막는다"
serves = ["G_flow", "G_diversity"]
conditions = ["S_many_slots", "F_smart_impl"]
evidence = ["O_decision13", "O_no_expectation"]
note = "사용자 결정 2026-10-14: '최대 30개로 제한하고 한 번씩만' + '30개 이상이면 안 나온 것들 중에 다시 최대 30개, 무한히 듣기(기본)에서 끝나면 처음부터 다시'. music_player @b401048에 반영(DECISIONS.md 24번). 실제로 써 본 사용자 평가 전이라 가설"

[[rule]]
id = "R_S1"
version = 1
status = "hypothesis"
method = "셔플은 한 번 켜면 끌 때까지 유지한다. 대신 켜져 있는 동안은 폰 재생 막대에도 셔플 버튼을 보여 켜진 줄 알게 하고, 거기서 바로 끌 수 있게 한다"
reason = "켜진 상태가 이어지는 건 괜찮지만, 모르는 사이에 순서가 바뀌면 고장처럼 느껴진다"
serves = ["G_mode_visible"]
conditions = ["F_shuffle_sticky"]
evidence = ["O_shuffle_surprise"]
note = "사용자 결정 2026-10-19, music_player @25d6b74(DECISIONS.md 25번). 실제 폰에서 써 본 평가 전이라 가설"
