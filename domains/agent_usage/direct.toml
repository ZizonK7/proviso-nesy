reason = "직접 고른 까닭은 대화 맥락(두 파일 구조를 메인이 이미 다 앎). 손 예측 15–30분·15–30줄에 실제 4.1분·38줄 — 시간은 크게 짧고 줄은 넘었다: 짧은 명령을 여러 번 이어 썼다. 토큰은 21.8M으로 보냈을 때 추정 9.4M보다 컸다 — 메인 맥락이 약 30만에서 줄마다 다시 읽혀서다(늘어난 맥락은 2.9만으로 작았다). 비용으로는 보내는 쪽이 쌌을 수 있다(O_undersend 방향과 같음). 대신 코어 변경을 메인이 직접 해서 나누기 전후 같음 확인·검사를 한 흐름으로 끝냈다"
