# 메인이 직접 한 일 — 보낼까 판단에서 '직접'을 고른 일 (2026-11-03 사용자 결정, CLAUDE.md '보낼까 판단').
# 보낸 일은 dispatches.toml, 직접 한 일은 여기. 둘 다 예측(decide) → 실측 → 돌아보기. 같이 쌓여야 '안 보내는 쪽으로 기우는지'를 따질 수 있다.
# 적는 문턱: 도구를 대여섯 번 넘게 쓸 일을 직접 하기로 했으면 적는다(작은 일까지 적으면 그 기록이 더 비싸다).
# 칸:
#   id               m001부터
#   project, date, task, situation(선택 — 계산기에 쓴 상황 값)
#   decide           보낼까 판단(decide.py 출력의 [direct.decide]): main_ctx_k 그때 메인 맥락(천), left 남은 응답 어림,
#                    direct_m·send_m 두 추정(백만, 기록 단위), chose = "직접", why(비용 / 새 눈 / 대화 계속 / 대화 맥락 / 결과를 가림)
#   predicted        손 예측(2026-11-06 사용자 결정 — 직접 하는 작업도 예측해 둔다, 2026-11-07부터 필수): written_before = true,
#                    minutes·turns(줄)·tokens_m = [하한, 상한] — 실측과 같은 단위, (선택) ctx_start_k 시작할 때 메인 맥락(천 토큰).
#                    직접 할 일 파일의 [predicted]를 record direct가 옮긴다. record finish가 실측과 견준다
#   actual           끝나면: 메인 대화 기록에서 `scripts/agent_usage.py <메인 기록> --rounds`로 그 요청의 시작·끝을 보고
#                    `--actual --after <시작> --until <끝>` → status·minutes·turns(줄)·tokens_m·start·end
#   review.reason    고른 쪽이 맞았나(다른 쪽 추정과 견줘)
#   feedback         [direct.feedback] read = [읽은 메인 피드백 파일 이름] (2026-11-05 사용자 결정, 2026-11-06부터 필수 — dispatches.toml과 같다).
#                    2026-11-07부터 read는 메인 파일 전부, searched = [백서 색인 낱말], hit = [걸린다고 본 F 번호](빈 목록이면 hit_none = "이유")도 필수
#                    (2026-11-06 사용자 결정 — 피드백 찾기의 정답 모으기, feedback/CLAUDE.md "강제")
#   review.feedback  이번 일에서 올린 피드백 번호 목록 또는 "없음: 이유" (2026-11-06부터 끝난 일에 필수)
#   review.missed    보낼 때 이미 있었는데 hit에 없던, 알고 보니 걸린 피드백 번호 목록 또는 "없음: 이유" (2026-11-07부터 끝난 일에 필수)
#   brief            (선택) 이 일의 지시(요청) 글이 있는 곳 "저장소:상대경로.md" — dispatches.toml과 같다. 글은 이 공개 저장소에 두지 않고 경로만

