# 빗댄 기록 규칙 — 정해진 일은 가장 가까운 지난 일의 시간을 따른다 (2026-11-03 사용자 결정, CLAUDE.md '빗댄 기록 규칙'). 계산은 analog.py.
# 시험 중이라 지식 파일의 조각이 아니다(성적표를 받지 않는다). 미리 정한 시험을 통과하면 계산기 기본 경로로 올린다.
# 기준(hard·soft)의 순서는 이유를 달아 손으로 적고(CLAUDE.md), 범위(range)와 근거(fit)는
#   `python -m domains.agent_usage.analog --write`가 seen_until까지의 정해진 일 기록으로만 맞춰 다시 쓴다(테스트가 같은지 확인한다).
# v1(2026-11-03 첫 시험, seen_until p99): 실패 — 규칙 84 % vs AI가 고름 94 %(CLAUDE.md). 아래는 v2(같은 날, 시험 전에 적음).
version = 2
seen_until = "p145"
posthoc_from = "p99"  # p100–p145는 v2를 만들며 본 기록(v1 시험과 사후 분석) — 참고로만 보인다
min_test = 30  # p145 다음의 정해진 일 새 기록이 이만큼 쌓이면 판정한다
# v2: 같은 에이전트의 앞 회차를 맨 앞 기준으로(agent·round 칸, 2026-11-04부터 필수)
same_agent_first = true
# v2: 맨 앞이 동점 여럿이고 서로 크게 벌어지면(최대/최소 > tie_spread_max) 스위치가 가리지 못한 것 → 손 예측으로 넘긴다.
#   서로 비슷하면 가운데 값으로 답한다(사용자 제안 '기댓값'). 맞추기 쪽(p145까지): 동점끼리 2배 안 34건 가운데 값 28 vs 손 27,
#   2배 넘게 벌어짐 67건 가운데 값 25 vs 손 53. (같은 날 시험 기록이 생기기 전에 다듬음 — 처음엔 동점이면 모두 넘겼다)
defer_ties = true
tie_spread_max = 2
# 반드시 같은 답 — 일의 큰 모양과 회차가 다르면 시간이 다른 세상이다. '모름'은 다른 답(못 찾으면 상관없음으로 다시)
hard = ["S_specified", "S_resumed", "S_web", "S_fixed_input", "S_cloud_session"]
# v2 고침(2026-11-03 사용자 결정, 시험 기록 0건일 때): '기본 설정인가'(S_other_model) 대신 기록의 model·effort 칸으로 —
#   반드시 같은 답 안에서 같은 모델·effort가 먼저, 없으면 같은 모델의 다른 effort로 넓힌다. 다른 모델은 빗대지 않는다(손 예측).
#   전에는 S_other_model = 예 하나에 Sonnet max·Haiku·Fable xhigh·Opus xhigh가 섞여 서로를 빗댔다.
same_setup = true
# 같은 저장소 다음으로 같은 답이 많은 것을 고른다. 맨 앞이 동점이면 그 묶음의 실제 분의 가운데 값
soft = ["S_template_given", "S_render", "S_no_code", "S_fix_existing", "S_research", "S_spec_fixed"]
range = [0.759, 1.51]
fit = "d01–p145의 정해진 일 중 규칙이 혼자 답하는 기록에서 맞춤: 46/102건 범위 안 (d32b, d39, d41, d40b, d44, d55 …)"
