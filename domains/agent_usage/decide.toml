# 보낼까 판단의 숫자 (2026-11-03 사용자 결정 — 계산은 decide.py, 규칙은 knowledge.toml R_send_or_not).
# 이 숫자들은 기록에서 맞춘 것이 아니라 2026-11-03 세션에서 잰 값으로 처음 정한 것이다. 판단 기록(dispatches의 decide 칸,
# direct.toml)이 쌓이면 손으로(수동 업데이트) 다시 정한다. 토큰은 기록 단위(줄마다 더한 값 — 응답마다 센 값의 2배쯤)로 맞춘다.

# 보내면 메인이 쓰는 줄 수: 지시서·send·보내기·finish·돌아보기·배치 줄·커밋. 묶음 명령(record.py) 없이 2026-11-03에 16–20줄쯤,
# 묶음 명령으로 10줄쯤으로 본다
send_overhead_lines = 10
# 보내면 메인 맥락에 남는 것: 작업자의 끝 보고(마지막 답장)와 보고서를 확인하며 읽은 양(천 토큰)
report_k = 5
# 작업자가 처음 받는 맥락(시스템 안내 + 지시서, 천 토큰). 직접 했을 때 메인 맥락이 늘어날 양 = 2 × (작업자 평균 맥락 − 이것)
base_k = 60
# 남은 대화 응답 수 어림 — 직접 해서 늘어난 맥락이 이만큼 다시 읽힌다(줄은 응답의 2배로 친다)
left_responses = 50
lines_per_response = 2
