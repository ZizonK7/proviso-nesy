# ---------- 가설 ----------
[[hypothesis]]
id = "H_turns_over"
text = "비슷한 큰 작업에 빗대면 턴 수를 크게 잡는다 (실제는 예상의 절반 안팎)"
source = "ai (2026-10-16, 배치 2–7 기록에서)"
evidence = ["O_turns_overest", "O_turns_overest2"]
harms = ["G_time"]
check = "turns_overestimated"
note = "배치 11–13에서 시험 1건(d15b 0.41) 맞음. R_turns_analogy를 v2로 고쳐 빗댈 때 배수를 곱하게 했다. 이 가설은 v1의 버릇을 기록으로 남긴다"

[[hypothesis]]
id = "H_cancel"
text = "큰 작업에서 토큰 등급이 맞은 건 턴 수를 크게 잡은 것과 턴당 맥락을 작게 잡은 것이 서로 상쇄된 결과다"
source = "ai (2026-10-16, d12·d13에서)"
evidence = ["O_turns_overest", "O_ctx_big"]
check = "turns_vs_context"
note = "지휘 모델은 같은 결과를 '턴 기반 추정이 통한다'로 적었다. 맞았을 때의 이유가 틀렸을 수 있다"

[[hypothesis]]
id = "H_check_loop"
text = "외부 확인이 들어가느냐가 아니라 확인 → 고침을 몇 번 반복하느냐가 시간을 늘린다"
source = "ai (2026-10-16, d09와 d12b가 갈린 데서)"
evidence = ["O_loop_long", "O_render_fast"]
check = "check_loop_time"
note = "배치 13에서 시험 1건(d26b 0.95) 틀림 → 반박. 다만 틀린 건 검사의 잣대다: d26b의 예측은 이미 반복이 든 d12b에 빗대 반복 값을 넣었으니 '예측보다 길다'가 나올 수 없었다. 예측에 기대지 않는 잣대(분당 턴)로 H_check_loop2를 다시 세웠다 (2026-10-16, ai)"

[[hypothesis]]
id = "H_tok_per_min"
text = "분당 토큰은 작업 종류와 상관없이 1.2–2.6M 안에 든다"
source = "ai (2026-10-16, 배치 1–9 실측에서, 배치 10 실측을 보기 전에 세움)"
evidence = ["O_ctx_big"]
against = ["O_tok_rate_short"]
check = "tokens_per_minute"
note = "2026-10-16 사용량 조각 초안(저장소 밖)의 U2. 배치 10에서 반박됨(다섯 건 중 짧은 조사 네 건이 범위 밖) → 작업 길이로 나눠 H_tok_per_min_long으로 다시 세움"

[[hypothesis]]
id = "H_tok_per_min_long"
text = "150턴 넘는 작업은 분당 토큰이 1.1–2.6M, 150턴 안쪽은 0.7–1.2M이다 (긴 글을 한 덩어리로 쓴 경우는 뺀다)"
