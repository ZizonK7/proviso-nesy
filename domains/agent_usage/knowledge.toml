# 하위 에이전트 시간·사용량 예측 — AI가 스스로 쌓는 논리집
# 출처: batman docs/AGENT-LOG.md (배치 1–13)의 예측·실측·보정 메모·교훈 L-1~L-6. 작업별 기록은 dispatches.toml.
# 이 분야는 사용자가 판단하지 않는다 (사용자 결정 2026-10-16). 판정은 실측, 쌓는 방식은 사용자가 자기 논리집을 쌓는 방식을 따른다 (CLAUDE.md).
# 관찰의 source: "measured" = 실측(scripts/agent_usage.py), "director" = 지휘 모델이 남긴 메모, "conversation" = 사용자와의 대화에서.
# 가설의 source: "director" = 지휘 모델, "ai" = 이 논리집을 정리한 AI (날짜와 함께).

[domain]
id = "agent_usage"
name = "하위 에이전트 시간·사용량 예측"

# ---------- 목표 ----------
[[goal]]
id = "G_tell"
text = "작업의 시간과 사용량을 예측해 이유와 함께 사용자에게 말한다"

[[goal]]
id = "G_time"
text = "시간 예측이 맞는다"
parent = "G_tell"

[[goal]]
id = "G_tokens"
text = "토큰 예측이 맞는다"
parent = "G_tell"

# ---------- 사실 ----------
