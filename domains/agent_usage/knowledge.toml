# 하위 에이전트 시간·사용량 예측 — AI가 스스로 쌓는 논리집
# 출처: batman docs/AGENT-LOG.md (배치 1–13)의 예측·실측·보정 메모·교훈 L-1~L-6. 작업별 기록은 dispatches.toml.
# 이 분야는 사용자가 판단하지 않는다 (사용자 결정 2026-10-16). 판정은 실측, 쌓는 방식은 사용자가 자기 논리집을 쌓는 방식을 따른다 (CLAUDE.md).
# 관찰의 source: "measured" = 실측(scripts/agent_usage.py), "director" = 지휘 모델이 남긴 메모, "conversation" = 사용자와의 대화에서.
# 가설의 source: "director" = 지휘 모델, "ai" = 이 논리집을 정리한 AI (날짜와 함께).

[domain]
id = "agent_usage"
name = "하위 에이전트 시간·사용량 예측"

# ---------- 목표 ----------
[[goal]]
id = "G_tell"
text = "작업의 시간과 사용량을 예측해 이유와 함께 사용자에게 말한다"

[[goal]]
id = "G_time"
text = "시간 예측이 맞는다"
parent = "G_tell"

[[goal]]
id = "G_tokens"
text = "토큰 예측이 맞는다"
parent = "G_tell"

# ---------- 사실 ----------
[[fact]]
id = "F_reread"
text = "토큰 합계는 대부분 캐시 읽기다. 에이전트는 매 턴 맥락 전체를 다시 읽는다"
checked = 2026-10-13
source = "d02 실측: 357턴, 쓴 글 ~4.5만 토큰, 캐시 읽기 ~8,900만 토큰"

[[fact]]
id = "F_setup"
text = "하위 에이전트는 Opus 5.5, effort high로 돈다 (사용자 기본값). 숫자 범위는 이 설정에서 확인됨. 다른 설정은 Sonnet 5.5 max와 Fable 5.1 xhigh를 고정 입력 작업 한 종류에서 두 번씩 쟀을 뿐이다 (R_other_models)"
checked = 2026-10-16
source = "batman·proviso CLAUDE.md, AGENT-LOG 배치 2–13 (배치 12 블라인드 풀이 d19·d20·d24·d25)"

