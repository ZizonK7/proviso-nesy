# 하위 에이전트 시간·사용량 예측 — AI가 스스로 쌓는 논리집
# 출처: batman docs/AGENT-LOG.md (배치 1–13)의 예측·실측·보정 메모·교훈 L-1~L-6. 작업별 기록은 dispatches.toml.
# 이 분야는 사용자가 판단하지 않는다 (사용자 결정 2026-10-16). 판정은 실측, 쌓는 방식은 사용자가 자기 논리집을 쌓는 방식을 따른다 (CLAUDE.md).
# 관찰의 source: "measured" = 실측(scripts/agent_usage.py), "director" = 지휘 모델이 남긴 메모, "conversation" = 사용자와의 대화에서.
# 가설의 source: "director" = 지휘 모델, "ai" = 이 논리집을 정리한 AI (날짜와 함께).
# 2026-10-19 개편: 규칙도 가설이다(방법이 붙은 가설). 상태는 hypothesis / retired 둘뿐이고 'verified'는 없앴다.
#   믿을 만한지는 `python -m proviso check agent_usage`의 성적표가 보여 준다. 규칙의 check 칸:
#   주장 검사(가설 검사 함수를 그대로) + 쓴 예측 검사(used_minutes·used_turns·used_tokens). 옛 note의 'verified로 올린다'는 역사다.
#   가설 표의 옛 superseded_by는 status = "retired" + replaced_by로 바꿨다(규칙 표와 같은 칸).

[domain]
id = "agent_usage"
name = "하위 에이전트 시간·사용량 예측"
# 효과 칸(effect)이 작용하는 것 (2026-10-19, 계산되는 논리; 계산은 predict.py)
#   turns 턴 수(양) · turns_per_min 분당 턴(속도) · add_minutes 더하는 분(바퀴·바깥 단계) · ctx_k 턴당 맥락(천 토큰) · minutes 분(턴이 분을 정하지 않는 일)
quantities = ["turns", "turns_per_min", "add_minutes", "ctx_k", "minutes"]
situation_values = ["예", "아니오", "일부", "모름"]
max_ratio = 2  # 효과 범위와 계산한 범위의 폭 상한(상한/하한). 사용자에게는 한 구간을 말해야 한다 (장치 G)

# ---------- 목표 ----------
[[goal]]
id = "G_tell"
text = "작업의 시간과 사용량을 예측해 이유와 함께 사용자에게 말한다"

[[goal]]
id = "G_time"
text = "시간 예측이 맞는다"
parent = "G_tell"

[[goal]]
id = "G_tokens"
text = "토큰 예측이 맞는다"
parent = "G_tell"

# ---------- 사실 ----------
[[fact]]
id = "F_reread"
text = "토큰 합계는 대부분 캐시 읽기다. 에이전트는 매 턴 맥락 전체를 다시 읽는다"
checked = 2026-10-13
source = "d02 실측: 357턴, 쓴 글 ~4.5만 토큰, 캐시 읽기 ~8,900만 토큰"

[[fact]]
id = "F_setup"
text = "하위 에이전트는 Opus 5.5, effort high로 돈다 (사용자 기본값). 숫자 범위는 이 설정에서 확인됨. 다른 설정(Sonnet 5.5 max, Fable 5.1 xhigh)은 세 모델 비교 라운드의 고정 입력 풀이·문서 쓰기와 Sonnet 도구 작업 한 건(d42), Fable 이어 보내기 한 건(d89)에서만 쟀다 (R_models_doc·R_models_reasoning·R_models_tool)"
checked = 2026-10-19
source = "batman·proviso CLAUDE.md, AGENT-LOG 배치 2–36, dispatches.toml (S_other_model=예 22건)"

