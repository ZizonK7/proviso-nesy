# 시간 순서 홀드아웃의 조각 세트 (2026-10-19, 계산되는 논리)
# 경계: 배치 17 끝(d38b, 2026-10-16). 앞 절반 = d01–d38b의 끝난 기록 64건, 뒤 절반 = d39–p04의 끝난 기록 61건.
#   끝난 기록 125건의 가운데(63번째)에 가장 가까운 배치 경계다. 배치 안에서 자르면 같은 지시서 묶음이 양쪽으로 갈린다.
# 세트마다 조각의 '모양'(무엇에·어떻게·언제·방향·이유)은 손으로 적고, 범위(range)와 근거(fit)는
#   `python -m domains.agent_usage.fit holdout --write`가 fit_until까지의 기록으로만 맞춰 다시 쓴다(테스트가 같은지 확인한다).
#   front_v0    = 쪼개기 전: 경계 시점에 살아 있던 규칙의 조건을 그대로 조각으로 옮긴 것
#   front_split = 쪼갠 뒤: front_v0를 앞 절반에 돌려 설명 안 된 기록의 공통 조건으로 쪼갠 것 (앞 절반만 봄)
# 이 파일의 조각은 지식 파일의 가설이 아니다(성적을 받지 않는다). 지금 쓰는 조각은 knowledge.toml의 계산 조각 구역.
# 조각 이름·문장에 프로젝트·앱 이름을 쓰지 않는다(다른 분야에서 다시 쓸 수 있게).

[[set]]
name = "front_v0"
fit_until = "d38b"
note = "쪼개기 전: 경계 시점 규칙(R_time_turns_v2, R_research, R_fixed_input, R_resume_ctx, R_tok_short/long, R_spec_fixed, R_other_models)의 조건을 조각으로"

[[set.piece]]
id = "C_turns_base"
text = "기본 설정 모델의 일은 기준 턴 수에서 출발한다"
reason = "일의 양은 턴으로 센다. 모양마다 곱하기 조각이 기준에서 늘리거나 줄인다"
conditions = ["S_other_model"]
fit = "d01–d38b 끝난 기록에서 맞춤: 턴 10/24건 (d02, d05, d06, d09, d10, d12 …)"
[[set.piece.effect]]
on = "turns"
op = "base"
range = [285, 512]
when = { S_other_model = "아니오" }
reason = "기본 설정 모델, 다른 조각이 걸리지 않은 첫 회차 일(대개 구현)의 턴"

[[set.piece]]
id = "C_turns_fixed_input"
text = "입력이 정해진 순수 추론은 턴이 아주 적다"
reason = "읽을 파일 몇 개를 한 번 읽고 한 번 쓰면 끝나고 도구 고리가 없다"
conditions = ["S_fixed_input"]
fit = "d01–d38b 끝난 기록에서 맞춤: 턴 2/4건 (d18, d23)"
[[set.piece.effect]]
on = "turns"
op = "mul"
range = [0.186, 0.187]
dir = "down"
when = { S_fixed_input = "예" }
reason = "도구 고리가 없어 읽기·쓰기 몇 턴으로 끝난다"

[[set.piece]]
id = "C_turns_research"
text = "엄격한 양식의 조사는 구현보다 턴이 적다"
reason = "출력 상한이 일의 크기를 정한다. 고칠 코드와 확인 고리가 없다"
conditions = ["S_research"]
fit = "d01–d38b 끝난 기록에서 맞춤: 턴 10/10건 (dR1, dR2, dR3, dR4, d18, d23 …)"
[[set.piece.effect]]
on = "turns"
op = "mul"
range = [0.217, 0.362]
dir = "down"
when = { S_research = "예" }
reason = "확인·고침 고리가 없고 출력 하나를 정해진 양식으로 쓴다"

[[set.piece]]
