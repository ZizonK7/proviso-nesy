# S_web_blocked = 아니오. 계산기는 Haiku 기준값이 없어 '모름'. 손 예측: 앞 회차(45–77턴)보다 원문 열기·읽기 턴이 더해져 60–140턴, 분당 턴은 페이지 읽기가
# 요약 모델을 거쳐 웹 띠 아래쪽(5–11)으로 보고 8–25분. 토큰은 이어 보낸 에이전트(R_resume_ctx_v2: 앞 회차 평균 맥락 7–9만의 1.6–1.8배 + 새로 읽는 페이지)로 15–25만/턴.
# 돌아보기(같은 날): 새 상태 S_read_originals(원문 읽기가 주된 일)를 p10–p21에 사후 기입(배치 7 아니오, 배치 8 예). 보내기 전에 지시서로 알 수 있던 조건이고 예측 칸은 고치지 않았다.

