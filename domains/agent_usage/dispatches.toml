# 하위 에이전트 작업 기록 — 예측 → 실측 → 돌아보기
# 출처: batman docs/AGENT-LOG.md (배치 1–13). d15b 이후는 batman 클라우드 세션이 적어 둔 기록(docs/proviso-sync/)을 PC 세션이 옮겼다.
# 2026-10-16 PC 세션: 작업 모양 상태(S_web, S_fixed_input, S_other_model, S_resumed, S_spec_fixed)와 d28의 S_mid_notes를
# 사후에 채웠다. 보내기 전에 알 수 있던 작업의 성질(d28의 도중 지시만 실행 중 사실)이고, 예측 칸은 고치지 않았다.
# 공개 저장소: 작업 설명은 종류만 적는다 (게임 내용·코드는 적지 않음).
#
# 칸:
#   predicted.time_class / tokens_class  등급 목록. 범위 예측("M–L")은 두 등급을 다 적는다
#   predicted.minutes  [하한, 상한] 분. 하나만 있으면 "이상"
#   predicted.turns    [하한, 상한] 턴. 하나만 있으면 "이상"
#   predicted.rules    예측에 쓴 규칙 id (knowledge.toml)
#   predicted.written_before  보내기 전에 적었는가 (배치 1은 실행 중에 적음)
#   situation          상황 대 보기: 상태 id = "예" / "아니오" / "일부" / "모름". 적지 않은 상태는 모름
#   actual.status      done / stopped(중간에 멈춤) / unknown(끝났는지 모름). done만 판정에 쓴다
#   actual.tokens_m    합계 토큰(백만). 캐시 생성 + 캐시 읽기 + 입력 + 출력
#   review.reason      맞음/틀림 이유 (기록 그대로). 맞았을 때도 적는다
#   review.hypotheses  이 기록과 이어진 가설 id

