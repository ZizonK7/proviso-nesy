# 하위 에이전트 작업 기록 — 예측 → 실측 → 돌아보기
# 출처: batman docs/AGENT-LOG.md (배치 1–13). d15b 이후는 batman 클라우드 세션이 적어 둔 기록(docs/proviso-sync/)을 PC 세션이 옮겼다.
# 2026-10-16 PC 세션: 작업 모양 상태(S_web, S_fixed_input, S_other_model, S_resumed, S_spec_fixed)와 d28의 S_mid_notes를
# 사후에 채웠다. 보내기 전에 알 수 있던 작업의 성질(d28의 도중 지시만 실행 중 사실)이고, 예측 칸은 고치지 않았다.
# 2026-10-19 정리(p01): 새 상태 셋을 사후에 채웠다 — S_fix_existing(d29·d43 일부, d44–d47·d70–d73 예),
# S_open_seams(d39b·d94 아니오, d68 예), S_build_tools(d41·d61 아니오, d62·d87 예). 모두 보내기 전에 지시서로 알 수 있던
# 작업의 성질이고, 이 기록들은 그 가설들의 SEEN_UNTIL(d94) 앞이라 판정에 들지 않고 '맞춰 본 것'으로만 보인다. 예측 칸은 고치지 않았다.
# 2026-10-19 계산 조각(p05): 새 상태 둘을 사후에 채웠다 — S_integration(여러 갈래를 합치는 일; d12b·d26b·d39b·d68·d94 예: 지시서에
# '합친 뒤'·'브랜치 통합'이라고 적힌 일), S_many_turn_model(턴을 잘게 나눠 쓰는 모델 설정; S_other_model=예인 기록 중 Sonnet 5.5 max 예,
# Fable 5.1 xhigh 아니오. d89는 실수로 다른 모델을 이어 보내 보낼 때 몰랐으므로 비움). 둘 다 지시서와 고른 모델로 보내기 전에 알 수 있던 값이다.
# S_small_codebase는 적지 않는다: project 값으로 정해진다(knowledge.toml의 from_project). 예측 칸은 고치지 않았다.
# 2026-10-23 쪼개기(C_turns_no_check → v2): 새 상태 S_no_code를 사후에 채웠다 — d17·d21·d22·d31·d32·d34·d35·d48·d51·d52·d53·d54·d74 예(지시서에 "코드 없음"),
# p29 아니오(코드 구현), p38 일부(문서 대조가 중심, 코드 파일 4개 손봄). 보내기 전에 지시서로 알 수 있던 성질이고 예측 칸은 고치지 않았다.
# 돌아보기 글의 기록 이름이 batman 쪽 이름과 섞인 곳: d88의 'd51b' = 이 파일의 d58, d89의 'd52b' = d64, d94의 'd64' = d68.
# 공개 저장소: 작업 설명은 종류만 적는다 (게임 내용·코드는 적지 않음).
#
# 칸:
#   predicted.minutes  [하한, 상한] 분. 하나만 있으면 "이상". 시간 판정은 이 숫자를 세 마디 구간으로 바꿔서 한다
#                      (잠깐 ≤10분 · 다른 일 10–40분 · 신경 끄기 >40분, 2026-10-19 사용자 결정; dispatches.py가 계산)
#   predicted.told     사용자에게 말한 구간 (잠깐 / 다른 일 / 신경 끄기). 2026-10-19부터. 범위가 두 구간에 걸치면 긴 쪽(R_say_numbers_v2)
#   calc.told / calc.minutes  보내기 전에 돌린 계산기의 말할 구간과 분 범위 (2026-10-19 사용자 결정: 손 예측과 계산기 중 어느 쪽이 나은지 계속 기록). dispatches 출력의 '손 예측 vs 계산기'가 센다
#   predicted.time_class  옛 시간 등급(S ≤20 · M 20–45 · L 45–90 · XL >90분). 2026-10-19 전 기록의 역사로만 남고 판정에 쓰지 않는다
#   predicted.tokens_class  토큰 등급 목록. 범위 예측("T2–T3")은 두 등급을 다 적는다
#   predicted.turns    [하한, 상한] 턴. 하나만 있으면 "이상"
#   predicted.rules    예측에 쓴 규칙 id (knowledge.toml)
#   predicted.analog   빗댄 과거 기록 id (2026-10-19부터, 있으면). 배수 가설(H_settled_integration·H_build_tools)이 이 값으로 시험한다
#   predicted.written_before  보내기 전에 적었는가 (배치 1은 실행 중에 적음)
#   situation          상황 대 보기: 상태 id = "예" / "아니오" / "일부" / "모름". 적지 않은 상태는 모름
#   actual.status      done / stopped(중간에 멈춤) / unknown(끝났는지 모름). done만 판정에 쓴다
#   actual.tokens_m    합계 토큰(백만). 캐시 생성 + 캐시 읽기 + 입력 + 출력
#   review.reason      맞음/틀림 이유 (기록 그대로). 맞았을 때도 적는다
#   review.hypotheses  이 기록과 이어진 가설 id
#   review.wrong       틀린 조각 id 목록 (규칙·가설·상태). 2026-10-19 결정 뒤(p04부터) 시간 구간이 빗나가면 필수
#   review.why         틀린 까닭 하나: "조건 흐림"(→ 조건을 더해 쪼갠다) / "이유 틀림"(→ 새 버전) / "바깥 상황"(→ 예외). wrong과 함께 필수
#                      지난 기록은 손으로 되짚지 않는다. 분이 빗나간 기록의 속도/양 갈래는 dispatches.py가 계산해 보여 준다

