#                      지시서에서 센 files와 dispatches 출력이 견준다) · scratch_files 쓰거나 고친 임시 파일 수 ·
#                      write_chars Write 글자 합 · edit_chars Edit 새 글 글자 합 · write_lines Write 줄 합 (임시 파일 뺌) ·
#                      read_calls Read 호출 · read_files Read한 서로 다른 파일 · read_chars Read 결과 글자(그림 뺌) · images 도구 결과의 그림 수 ·
#                      bash_calls · bash_out_chars Bash 결과 글자 · grep_calls · glob_calls · web_search · web_fetch · agent_calls(Agent·Task) · other_tool_calls 그 밖 ·
#                      tool_errors 오류로 끝난 도구 결과 · repeat_cmds 똑같은 Bash 명령을 다시 돌린 횟수(명령마다 횟수 − 1의 합) ·
#                      ctx_start_k·ctx_max_k·ctx_end_k 응답마다 맥락(입력 + 캐시 생성 + 캐시 읽기, 천 토큰)의 처음·최대·끝 ·
#                      thinking_blocks 생각 블록 수 · thinking_s 기록이 남긴 생각 시간 합(초, thinkingDurationMs) ·
#                      brief_chars·brief_lines 이 회차를 시작한 지시의 글자·줄 수 (보내기 전에 알 수 있는 값을 로그에서 읽은 것)
#   session            클라우드 세션으로 보낸 일(S_cloud_session = 예)의 세션 id(session_…, 사람 식별자가 아니다). 보낼 일 파일에 적으면 record send가 옮긴다.
#                      2026-11-06부터 클라우드 일에 필수. p168·p188·p200–p219는 2026-11-05에 세션 목록에서 제목·만든 시각(±3분)으로 찾아 사후에 채웠다(p239)
#   brief              (선택) 작업자에게 준 지시서 글이 있는 곳 "저장소:상대경로.md"(예: "gemmin:docs/briefs/p246.md", 2026-11-06 사용자 결정).
#                      **지시서 글은 이 공개 저장소에 저장하지 않는다** — 비공개 저장소에 두고 여기는 경로만. 보낼 일 파일에 적으면 record send가 옮긴다.
#                      검사는 모양만(저장소 이름 [A-Za-z0-9_.-], 콜론, '/'로 시작 안 하고 '..' 없는 .md 경로). `python -m feedback labels`가 정답 행에
#                      brief로 싣고, --brief-root gemmin=<폴더>를 주면 그 글을 brief_text로 붙인다(출력은 out/, git 제외) — 일 글(task + 지시서) 임베딩 시험의 재료
#   git                [dispatch.git] git으로 잰 작업자 변경 (2026-11-05 사용자 결정, 2026-11-06부터 끝난 로컬 기록에 필수 — 저장소 밖 일이면 skip = "저장소 밖 일").
#                      로그의 write·edit는 Write·Edit 도구만 세서 Bash로 바꾼 파일을 놓친다(p238: 11개를 고쳤는데 로그 1). domains/agent_usage/measure.py.
#                      보낼 때(record send가 기록 파일·배치 머리를 쓴 뒤 — 메인의 보내기 전 기록도 기준에 든다): repo 저장소 폴더 이름만 · head 커밋 ·
#                      dirty 그때 더러운(고쳐졌거나 추적 안 된, .gitignore 따름) 파일 수 · dirty_hashes ["경로 해시 8자:내용 해시 12자"](경로도 해시 — 비공개 저장소 이름 보호).
#                      끝날 때(record finish가 아무것도 쓰기 전에): 지금 더럽고 보낼 때 깨끗했거나 내용이 달라진 파일 — git_write 새 파일 · git_edit 있던 파일 고침 ·
#                      git_delete 지움 · git_lines_added·git_lines_removed numstat(새 파일은 그 줄 수, 보낼 때 더러웠던 파일은 그때 내용과) ·
#                      git_commits 보낼 때 HEAD 뒤 커밋 수(메인의 보내기 전 기록 커밋도 든다 — 그래서 커밋된 파일은 작업자 파일로 세지 않는다).
#                      named_files·named_lines·named_bytes·named_dirs 지시서(그 회차 첫 지시)에 경로로 적힌 것 중 보낼 때 HEAD에 있던 파일 수·줄·바이트와
#                      폴더 수 — 계산은 끝날 때지만 보내기 전에 알 수 있는 양이다(경로는 저장하지 않는다).
#                      알려진 오염: 작업자가 도는 동안 메인이 같은 저장소를 커밋 없이 고치거나, finish 전에 작업자 변경을 커밋하면 수가 틀린다
#   cloud              [dispatch.cloud] 클라우드 세션의 result 사건 숫자 합 (2026-11-05, 2026-11-06부터 끝난 클라우드 기록에 필수 — 못 재면 skip).
#                      메인이 MCP list_events(session, kinds=["result"])로 읽고 `record cloud <id> <숫자.json>`(사건 출력을 그대로 줘도 된다).
#                      results 사건 수 · duration_ms 사건마다 실행 시간 합 · duration_api_ms API 시간 · num_turns 턴 합 · total_cost_usd 달러 ·
#                      web_search_requests·web_fetch_requests 서버 도구 호출 · subagents_spawned 그 세션이 띄운 하위 에이전트 · stop_reason·subtype 마지막 사건 ·
#                      models."이름" = { input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens, thinking_tokens, web_search, cost_usd }.
#                      modelUsage·total_cost_usd·duration_api_ms·spawned는 세션 안에서 누적이라 사건끼리 더하지 않는다(사건마다 값은 model_usage_since_last_result).
#                      p168·p188·p200–p219는 2026-11-05에 사후에 채웠다(그 기록 창 안에 끝난 사건만 — p218의 3분 뒤 보완 회차는 담당 p215 몫이라 뺐다)
#   feedback           [dispatch.feedback] read = 보내기 전에 읽은 메인 피드백 파일 이름(feedback/main/). 2026-11-05 사용자 결정, 2026-11-06부터 보낸 기록에 필수(batman 제외).
#                      2026-11-06까지: common과 `python -m feedback topics "<task>"`가 고른 파일이 다 있어야 한다.
#                      2026-11-07부터(2026-11-06 사용자 결정): 메인 파일 전부 + searched(백서 색인 낱말, 1개 이상 — record send가 find 결과를 찍는다)
#                      + hit(이번 일에 걸린다고 본 피드백 번호, 백서에 있어야 함; 비우려면 hit_none = "이유"). hit·review.missed가 `python -m feedback labels`의 정답 자료.
#                      보낼 일 파일의 [feedback]을 record send가 [dispatch.decide] 뒤에 옮긴다(빠지면 보내지 않는다)

