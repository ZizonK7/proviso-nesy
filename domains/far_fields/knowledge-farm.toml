why = "레시피는 깨끗한 물을 기준으로 만들어져 있다. 원수에 이미 든 성분을 빼고 계산해야 맞는다."
breaks = "역삼투압 정수나 빗물을 쓰면 오히려 칼슘·마그네슘이 모자라 따로 보충해야 한다. 계절마다 원수 수질이 바뀌는 곳도 있다."
