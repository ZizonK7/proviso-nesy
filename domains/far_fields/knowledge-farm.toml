# 먼 분야 경험 논리 — 묶음 '땅·농사'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 수경 재배 (땅·농사)
[[hypothesis]]
id = "H_hydroponics_01"
text = "매일 쓰는 측정 도구는 조금씩 기준이 밀리면서도 틀린 값을 똑같이 확신 있게 보여준다. 그래서 정기적으로 알려진 기준에 대 보고, 가끔은 전혀 다른 방식으로 같은 것을 재 본다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "pH 측정기(pH 펜)는 매일 쓰다 보면 슬금슬금 틀어진다. 주 1회는 표준액(pH 7, pH 4 버퍼)으로 보정하고, 값이 미심쩍으면 시약 방울 같은 다른 방식으로 한 번 더 확인해라."
why = "전극이 닳고 오염되면서 기준이 서서히 밀린다. 그런데 기기는 틀린 값도 똑같이 또렷한 숫자로 보여준다."
breaks = "보정액이 오래됐거나 오염됐으면 보정하면서 오히려 오차를 심는다. 보정 뒤에도 숫자가 계속 흐르면 보정보다 전극을 바꿀 때다."
confidence = "높음"
conditions = ["S_instrument_doubt", "S_tool_wear", "S_slow_drift"]

[[hypothesis]]
id = "H_hydroponics_02"
text = "겉의 증상은 속이 무너진 지 한참 뒤에 나타난다. 그러니 바깥 조건이 위험 구간에 들어서면 겉이 변하기를 기다리지 말고, 보이지 않는 핵심부를 직접 들여다본다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "양액(물에 비료를 녹인 영양액) 온도가 24℃를 넘기 시작하면 잎을 보지 말고 뿌리를 꺼내 봐라. 하얗던 뿌리가 갈색으로 미끈거리고 냄새가 나면 뿌리썩음이 이미 시작된 거다. 18~22℃로 지키는 게 제일 싸게 먹힌다."
why = "물이 따뜻할수록 녹아 있는 산소는 줄고 병원균은 빨리 불어난다. 그래서 뿌리가 먼저 무너지고, 잎 시듦은 한참 뒤에야 나타난다."
breaks = "산소를 강하게 불어넣거나 균 관리를 철저히 하는 시스템은 조금 높은 온도도 버틴다. 반대로 15℃ 아래로 너무 차가워도 흡수가 떨어져 비슷하게 시든다."
confidence = "높음"
conditions = ["S_hidden_state", "S_delayed_feedback", "S_uncontrolled_env"]

[[hypothesis]]
id = "H_hydroponics_03"
text = "남은 양과 농도를 함께 기록하면 무엇이 더 빨리 빠져나갔는지 알 수 있다. 보충할 때는 늘 같은 것을 채우지 말고, 변화의 방향을 보고 빠진 쪽을 채운다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "탱크 물이 줄었는데 EC(전기전도도, 녹아 있는 비료 농도 지표)가 올라갔으면 비료보다 물을 더 마신 거니 맹물을 채워라. EC가 내려갔으면 비료를 더 먹은 거니 양액을 채워라. 수위와 EC를 같이 적어 둬야 이 판단이 된다."
why = "날씨와 생육 단계에 따라 물과 양분을 가져가는 비율이 바뀐다. 농도가 움직인 방향을 보면 무엇을 더 가져갔는지 알 수 있다."
breaks = "증발이 심하거나 특정 성분만 골라서 빠지는 경우에는 EC만으로 판단하면 틀린다. 빗물 같은 외부 물이 섞여 들어와도 해석이 흐려진다."
confidence = "높음"
conditions = ["S_hidden_state", "S_slow_drift", "S_repetition"]

[[hypothesis]]
id = "H_hydroponics_04"
text = "각각은 문제없는 것들도 진한 상태로 바로 만나면 되돌릴 수 없게 뭉친다. 섞을 때는 넉넉한 바탕에 하나씩 풀어 묽힌 뒤 만나게 하고, 미세 조정은 맨 끝에 한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "A액(칼슘 든 것)과 B액(황산·인산 든 것) 원액은 절대 직접 섞지 마라. 물부터 채우고 A를 넣어 저은 다음 B를 넣고, pH 조정은 맨 마지막이다. 원액끼리 만나면 하얀 앙금이 생기고 그건 다시 안 녹는다."
why = "진한 상태에서 칼슘이 황산·인산과 만나면 녹지 않는 염이 된다. 묽은 상태에서는 녹은 채로 있다."
breaks = "한 봉지로 배합된 1액형 비료는 순서 걱정이 덜하다. 다만 그런 비료도 아주 진하게 미리 녹여 두면 앙금이 생길 수 있다."
confidence = "높음"
conditions = ["S_order_matters", "S_irreversible"]

[[hypothesis]]
id = "H_hydroponics_05"
text = "총량 하나만 보여주는 지표는 구성이 틀어지는 것을 숨긴다. 그 지표에 기대 오래 유지해 온 것일수록 주기적으로 통째로 새로 시작하거나 구성을 따로 확인한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "맹물과 양액만 계속 보충하면서 몇 달씩 끌지 마라. 순환식이면 1~3주마다 통째로 갈아라. EC 숫자는 멀쩡해도 안에서는 안 쓰이는 성분이 쌓이고 필요한 성분은 비어 간다."
why = "EC는 녹은 이온의 총량만 보여주고 어떤 성분인지는 못 보여준다. 흡수되지 않는 성분이 쌓여도 숫자는 정상처럼 보인다."
breaks = "성분 분석을 정기적으로 맡겨 성분별로 보정하는 큰 농장은 물과 비료를 아끼려고 오래 재사용한다. 배출 규제 때문에 쉽게 버리지 못하는 곳도 있다."
confidence = "높음"
conditions = ["S_instrument_doubt", "S_slow_drift", "S_repetition"]

[[hypothesis]]
id = "H_hydroponics_06"
text = "여유분을 깎아 효율을 높인 구조는 공급이 끊기는 순간 바로 무너진다. 완충이 없을수록 끊김을 즉시 알려 주는 경보와 대체 수단에 돈을 쓴다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "NFT(얕은 물길에 양액을 계속 흘려보내는 방식)는 뿌리 밑에 고인 물이 거의 없다. 그래서 여름 낮에 펌프가 한두 시간만 멈춰도 판 전체가 축 처진다. 정전·펌프 고장 알람이나 예비 펌프는 사치가 아니다."
why = "완충할 물이 없으니 공급이 끊기는 순간 바로 마른다. 효율 좋은 설계일수록 여유가 없다."
breaks = "담액식(깊은 물에 뿌리를 담그는 방식)이나 배지(흙 대신 쓰는 암면·코코피트) 재배는 몇 시간 버틸 여유가 있다. 대신 그쪽은 산소 공급이 끊기는 것이 더 큰 문제다."
confidence = "높음"
conditions = ["S_rare_fatal", "S_tool_wear", "S_goal_conflict"]

[[hypothesis]]
id = "H_hydroponics_07"
text = "처음 하는 사람은 더 주면 더 좋아질 거라 믿는다. 하지만 모자람은 나중에 채울 수 있어도 넘침은 상처를 남기므로, 약하게 시작해 반응을 보며 올린다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "초보는 잘 키우려고 비료를 표준보다 진하게 탄다. 모종 때는 표준의 절반쯤(EC 0.8~1.2)에서 시작해 반응을 보며 올려라. 잎 끝이 갈색으로 타 들어가면 너무 진하다는 신호다."
why = "농도가 높으면 삼투압 때문에 뿌리가 오히려 물을 못 빨아들인다. 어린 뿌리일수록 견디는 폭이 좁다. 모자람은 금방 채울 수 있지만 과하면 피해가 남는다."
breaks = "토마토 같은 열매채소는 후반에 맛을 끌어올리려고 일부러 EC를 높여 스트레스를 주기도 한다."
confidence = "높음"
conditions = ["S_first_time", "S_irreversible", "S_living_system"]

[[hypothesis]]
id = "H_hydroponics_08"
text = "안을 직접 볼 수 없을 때는 넣는 것보다 빠져나오는 것의 양과 상태를 잰다. 그러면 속에서 무엇이 쌓이고 어디가 막히는지 알 수 있다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "암면·코코피트 같은 배지 재배에선 주는 양액만 보지 말고, 흘러나온 배액(빠져나온 물)의 양과 EC를 매일 재라. 배액은 주는 양의 20~30% 정도가 기준이다. 배액 EC가 공급 EC보다 훨씬 높으면 배지 속에 염이 쌓이는 중이니 급액량을 늘린다."
why = "배지 안쪽은 볼 수 없지만, 빠져나온 물에는 안을 지나온 흔적이 담겨 있다. 점적기(물방울을 내는 꼭지)가 막힌 것도 배액이 줄어든 줄에서 먼저 잡힌다."
breaks = "비율 숫자는 작물·배지·날씨마다 달라서, 흐린 날엔 배액을 줄이는 게 맞기도 하다. 재는 지점이 한두 곳뿐이면 전체를 대표하지 못한다."
confidence = "중간"
conditions = ["S_blind_spot", "S_hidden_state", "S_tool_wear"]

[[hypothesis]]
id = "H_hydroponics_09"
text = "공급원에는 충분히 있는데 끝에서 모자란다면 양을 늘리기 전에, 그것을 실어 나르는 흐름이 막혔는지부터 본다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "상추 속잎 끝이 타는 팁번(칼슘 부족 증상)이 나오면, 칼슘을 더 타기 전에 환기와 습도부터 봐라. 양액에 칼슘이 충분해도 너무 습하면 칼슘이 속잎까지 못 올라간다. 밤 습도를 낮추고 바람을 넣으면 잡힌다."
why = "칼슘은 증산(잎에서 물이 빠져나가는 흐름)을 타고만 움직인다. 흐름이 약한 어린 속잎은 양액 농도와 상관없이 모자라진다."
breaks = "실제로 양액에 칼슘이 적거나, 칼륨이 너무 많아 흡수를 방해하는 경우도 있다. 양액 분석으로 확인해야 한다."
confidence = "높음"
conditions = ["S_have_vs_reach", "S_hidden_state"]

[[hypothesis]]
id = "H_hydroponics_10"
text = "반응이 늦게 나타나는 대상을 조정할 때는 계산보다 적게 넣고, 충분히 섞인 뒤 다시 잰다. 바로 재고 또 넣으면 반대쪽으로 넘어가 되돌리는 비용만 쌓인다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "pH 조정제(강한 산이나 알칼리)는 계산한 양의 절반만 넣고, 펌프로 10~15분 돌린 뒤 다시 재라. 넣자마자 재고 또 넣으면 목표를 넘어가 반대로 다시 맞추게 되고, 그 사이 쓸데없는 염만 쌓인다."
why = "섞이는 데 시간이 걸리고 양액에는 변화를 늦추는 완충 작용이 있다. 그래서 반응이 늦게 나타나는데, 급하게 반복하면 과하게 고치게 된다."
breaks = "물이 아주 적은 작은 통은 금방 섞여 바로 반응한다. 자동 주입 장치가 있는 큰 시설은 제어기가 알아서 나눠 넣는다."
confidence = "높음"
conditions = ["S_delayed_feedback", "S_two_sided"]

[[hypothesis]]
id = "H_hydroponics_11"
text = "모두가 하나의 흐름을 나눠 쓰는 구조에서는 한 곳의 문제가 그 흐름을 타고 전체로 번진다. 이상한 하나는 아까워도 바로 떼어 내고, 한 주기가 끝나면 함께 쓰는 통로를 비운다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
rule = "순환식에선 한 포기의 병이 물길을 타고 판 전체로 번진다. 뿌리가 이상한 포기는 아까워 말고 바로 빼라. 한 번의 재배가 끝나면 관과 탱크까지 소독해서 다음 재배로 병을 넘기지 않는다."
why = "모든 뿌리가 같은 물을 나눠 쓰니 물이 곧 전염 경로다. 흙에서보다 훨씬 빨리 퍼진다."
breaks = "자외선이나 필터 소독 장치가 있으면 퍼지는 속도가 늦지만 완벽하진 않다. 반대로 소독제를 무작정 많이 쓰면 이로운 미생물까지 죽인다."
confidence = "높음"
conditions = ["S_cascade", "S_sunk_cost", "S_living_system"]

[[hypothesis]]
id = "H_hydroponics_12"
text = "남이 만든 표준 방법은 깨끗한 출발점을 가정한다. 새 환경에서는 바탕에 이미 들어 있는 것부터 재고, 그만큼 빼서 계산한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "수경 재배"
group = "땅·농사"
