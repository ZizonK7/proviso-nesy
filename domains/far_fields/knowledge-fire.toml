# 먼 분야 경험 논리 — 묶음 '불·금속'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 숯 굽기 (불·금속)
[[hypothesis]]
id = "H_charcoal_burning_01"
text = "속을 직접 볼 수 없는 과정은 밖으로 나오는 부산물이 어떻게 바뀌어 가는지로 읽는다. 한 순간의 값보다 바뀌는 지점이 더 믿을 만한 신호다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "숯 굽기"
group = "불·금속"
rule = "가마 속은 못 보니 굴뚝 연기를 본다. 하얗고 축축한 연기가 노르스름하고 매운 연기로, 다시 푸르스름하고 가는 연기로 바뀌다가 거의 투명해지면 다 익은 거다. 색 하나만 보지 말고 바뀌어 가는 흐름을 봐라."
why = "연기 색은 나무 속에서 일어나는 일을 단계별로 보여 준다. 물이 빠지고, 나무가 분해되고, 탄화가 끝나 가는 순서가 그대로 드러난다."
breaks = "비 오는 날이나 습한 날에는 수증기 때문에 연기가 더 하얗게 보인다. 나무 종류가 섞이면 단계가 겹쳐서 색이 흐려진다."
confidence = "높음"
conditions = ["S_hidden_state", "S_tacit_sense", "S_slow_drift"]

[[hypothesis]]
id = "H_charcoal_burning_02"
text = "덜 된 쪽의 실패와 지나친 쪽의 실패가 양쪽에 있으면, 한쪽만 피하려 할수록 다른 쪽에 빠진다. 두 실패의 신호를 함께 지켜보며 멈출 때를 정한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "숯 굽기"
group = "불·금속"
rule = "아궁이와 굴뚝을 막는 때가 숯 한 가마를 가른다. 일찍 막으면 덜 익은 토막(연기 나는 숯)이 남고, 늦게 막으면 잘 익은 숯이 재로 날아가 양이 확 준다."
why = "탄화가 끝난 숯은 공기가 들어오는 만큼 계속 탄다. 그래서 '덜 익음'과 '타 없어짐' 사이의 틈이 좁다."
breaks = "백탄(흰숯)은 일부러 끝에 공기를 넣어 겉을 태우는 정련을 하므로, 늦게 막는 쪽이 오히려 목적에 맞다."
confidence = "높음"
conditions = ["S_two_sided", "S_short_window", "S_irreversible"]

[[hypothesis]]
id = "H_charcoal_burning_03"
text = "겉이 안정돼 보여도 속에 에너지가 남아 있는 대상은, 막아 두었던 것을 푸는 순간 다시 터질 수 있다. 식는 속도가 가장 느린 곳을 기준으로 기다린다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "숯 굽기"
group = "불·금속"
rule = "검탄(가마 안에서 식힌 검은 숯)은 밀봉한 뒤 가마 겉벽이 식었다고 열면 안 된다. 며칠은 기다려라. 속은 아직 벌겋다가 문 여는 순간 바람을 먹고 다시 불이 붙는다."
why = "두꺼운 흙벽과 숯 더미는 속 열을 오래 품는다. 겉 온도는 속 상태를 알려 주지 못한다."
breaks = "가마가 작거나 숯이 가늘면 빨리 식는다. 반대로 큰 가마는 기다려야 하는 날이 더 길어진다."
confidence = "높음"
conditions = ["S_hidden_state", "S_delayed_feedback", "S_irreversible"]

[[hypothesis]]
id = "H_charcoal_burning_04"
text = "그릇 자체가 새것이면 첫 회는 결과물이 아니라 그릇을 길들이는 데 써야 한다. 처음에 생긴 결함은 그 뒤의 모든 회차에 따라붙는다."
