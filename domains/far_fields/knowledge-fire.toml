field = "숯 굽기"
group = "불·금속"
rule = "새로 쌓았거나 고친 가마는 첫 불을 약하게 오래 때서 벽부터 말려라. 욕심내서 바로 숯을 구우면 벽이 갈라지고, 거기로 샌 바람이 숯을 재로 만든다."
why = "젖은 흙벽이 급하게 뜨거워지면 속의 물이 터져 나오며 금이 간다. 한번 생긴 금은 다음 가마마다 공기 새는 길이 된다."
breaks = "이미 여러 번 써서 잘 마른 가마는 길게 말릴 필요가 없다. 다만 오래 쉬었던 가마는 다시 습기를 먹었을 수 있다."
confidence = "중간"
