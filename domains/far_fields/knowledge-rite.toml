# 먼 분야 경험 논리 — 묶음 '의례·전통'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 염습(장례 시신 수습) (의례·전통)
[[hypothesis]]
id = "H_funeral_washing_01"
text = "대상이 곧 굳어 버리는 성질이 있으면, 모양 잡기는 아직 무를 때 작은 힘으로 끝내 둔다. 굳은 뒤에 큰 힘으로 바로잡으려 하면 대상이 상한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "염습(장례 시신 수습)"
group = "의례·전통"
rule = "수시(收屍, 돌아가신 직후 몸을 바르게 하는 일) 때 팔다리를 가지런히 펴고 턱을 받쳐 입을 다물게 해 둬라. 강직(사후에 근육이 굳는 것)이 오고 나면 억지로 펴야 하고, 그러다 몸이 상한다."
why = "몸은 몇 시간 안에 굳기 시작하는데, 굳기 전에는 힘을 거의 안 들이고도 모양을 잡을 수 있다."
breaks = "이미 강직이 왔다가 시간이 지나 풀린 뒤라면 다시 부드러워지므로 서두를 필요가 없다. 검안이나 경찰 조사가 걸린 경우에는 손대기 전에 허락부터 받아야 한다."
confidence = "높음"
conditions = ["S_short_window", "S_order_matters", "S_irreversible"]

[[hypothesis]]
id = "H_funeral_washing_02"
text = "결과를 보는 사람에게 가장 오래 남을 부분은 그 사람이 보기 전에 먼저 다듬어 둔다. 감출 수 없는 흠은 보기 전에 말로 먼저 알린다. 첫 충격은 나중에 한 설명으로 되돌아오지 않는다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "염습(장례 시신 수습)"
group = "의례·전통"
rule = "유족을 들이기 전에 얼굴과 손부터 정리해 둬라. 멍이나 상처, 변색이 있으면 미리 가리거나 유족에게 먼저 말로 알려 놓는다."
why = "유족은 마지막으로 본 얼굴을 평생 기억한다. 준비 없이 본 충격은 나중에 설명해도 지워지지 않는다."
breaks = "유족이 있는 그대로 보기를 원하거나 사고 경위를 확인하려는 경우에는 숨기면 오히려 불신을 산다."
confidence = "높음"
conditions = ["S_judged_by_others", "S_irreversible", "S_order_matters"]

[[hypothesis]]
id = "H_funeral_washing_03"
text = "속 상태가 안 보이는 대상은 겉을 마무리하기 전에 새어 나올 길부터 막는다. 다루는 도중에는 속에 압력을 주지 않는다. 마무리한 뒤에 새면 앞의 일이 모두 헛수고가 된다."
