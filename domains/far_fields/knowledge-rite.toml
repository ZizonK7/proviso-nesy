why = "속에 고인 체액과 가스는 겉으로 보이지 않는다. 그러다 압력이나 자세가 바뀌는 순간 밖으로 나온다."
breaks = "이미 위생 처리를 받았거나 사망 직후라 체액이 거의 없을 때는 지나치게 조심하느라 시간을 끌 필요가 없다."
