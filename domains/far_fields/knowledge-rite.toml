why = "병과 약과 시간이 혈관이 얼마나 막혔는지, 조직이 방부액을 얼마나 받아들일지를 이미 정해 놓았기 때문이다."
breaks = "병원이나 가족에게서 넘어온 정보가 틀리거나 빠진 경우가 있다. 서류만 믿지 말고 몸에서 보이는 신호로 다시 맞춰 봐야 한다."
