[[hypothesis]]
id = "H_refinery_operation_12"
text = "멈추는 비용은 확실하고 눈앞에 있고 사고 비용은 드물고 흐릿하면 사람들은 계속 가는 쪽을 고른다. 아래에서 멈추자는 말이 나오려면 위에서 먼저 그 말을 반겨 줘야 한다."
