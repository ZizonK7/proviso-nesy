why = "우회는 당장 운전을 편하게 해 주기 때문에 되돌릴 동기가 약하다. 우회한 사람이 바뀌면 그 사실을 기억하는 사람도 사라진다."
breaks = "계기가 고장 나서 오작동으로 계속 멈추는 경우라면 통제된 우회가 오히려 안전할 수 있다. 다만 그 사이 사람이 대신 지켜보는 대책이 같이 있어야 한다."
confidence = "높음"
conditions = ["S_rule_on_paper", "S_handoff", "S_slow_drift"]

[[hypothesis]]
id = "H_refinery_operation_09"
text = "부족한 것을 채우는 게 당연해 보여도, 이미 다른 쪽이 과하게 쌓여 있으면 갑자기 채우는 순간 폭발적으로 반응할 수 있다. 이럴 때는 넘치는 쪽부터 줄인다."
