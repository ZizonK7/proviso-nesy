group = "기계·현대기술"
rule = "출력을 내린 뒤 몇 시간은 제논(중성자를 잡아먹는 핵분열 부산물)이 쌓여 출력이 잘 안 오른다. 이걸 이기려고 제어봉을 한계까지 빼면 원자로를 다루기 어려운 상태로 몰아넣게 된다."
why = "제논은 출력 감소 뒤 늘었다가 하루쯤 걸려 줄어드는 지연 효과라서, 지금 손으로 밀어붙이면 나중에 제논이 빠질 때 반대로 출렁인다. 여유를 다 써 버리면 정작 필요할 때 끌 힘이 줄어든다."
breaks = "설계상 여유가 충분하고 절차로 허용된 범위라면 보상 조작은 정상 운전의 일부다. 제논이 빠지는 쪽 국면에서는 오히려 출력이 저절로 오를 수 있어 반대로 대비해야 한다."
