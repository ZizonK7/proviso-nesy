rule = "가열로(버너로 기름을 데우는 로)에서 산소는 바닥이고 일산화탄소가 높은데 불꽃이 이상하면, 공기를 확 늘리지 말고 연료부터 줄여라. 로 안에 타지 못한 연료가 차 있는데 공기를 갑자기 넣으면 한꺼번에 터질 수 있다."
why = "연료가 넘치는 상태에서 부족한 것은 공기다. 그래서 공기를 채우는 게 맞아 보이지만, 쌓인 연료에 산소가 한꺼번에 닿으면 폭발 조건이 된다."
breaks = "연료가 아직 많이 쌓이지 않은 초기의 약한 공기 부족이라면 공기를 천천히 늘리는 조정이 정상 대응이다. 현장 절차와 가열로 형식에 따라 대응이 다를 수 있다."
confidence = "중간"
conditions = ["S_two_sided", "S_hidden_state", "S_rare_fatal"]

