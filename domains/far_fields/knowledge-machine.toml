# 먼 분야 경험 논리 — 묶음 '기계·현대기술'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 정유 공정 운전 (기계·현대기술)
[[hypothesis]]
id = "H_refinery_operation_01"
text = "위험은 익숙한 안정 상태보다 드물게 지나가는 전환 구간에 몰린다. 전환 때는 경험 많은 사람과 주의를 그쪽에 집중해야 한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "정유 공정 운전"
group = "기계·현대기술"
rule = "사고는 정상 운전 중보다 시운전(스타트업)과 정지(셧다운) 때 몰려서 난다. 평소 1년 내내 보는 화면보다 1년에 한두 번 하는 기동 절차를 더 긴장해서 하고, 그날은 경험 많은 사람을 꼭 붙인다."
why = "평소와 다른 온도·압력·유량을 지나가는 과도 구간이고, 수동 조작과 임시 배관 연결이 많다. 그런데 자주 하지 않아서 몸에 익은 사람이 적다."
breaks = "상시 운전 중에도 원료가 바뀌거나 설비를 개조한 직후라면 사실상 새 기동과 같은 위험이 있다. 그럴 때는 '정상 운전이니 괜찮다'는 생각을 버려야 한다."
confidence = "높음"
conditions = ["S_first_time", "S_rare_fatal", "S_order_matters"]

[[hypothesis]]
id = "H_refinery_operation_02"
text = "측정값 하나가 정상이라고 해도 들어간 양과 나온 양이 맞지 않으면 보이지 않는 곳에 무언가 쌓이고 있다. 독립된 신호 둘 이상으로 교차 확인해야 측정 도구의 거짓말을 잡는다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "정유 공정 운전"
group = "기계·현대기술"
rule = "레벨계(액면 높이 지시계) 하나만 보고 판단하지 마라. 넣은 양과 뺀 양이 안 맞으면 지시값이 정상이어도 어딘가에 쌓이고 있는 거다. 온도나 압력차 같은 다른 신호로 맞춰 봐라."
why = "계기는 막히거나 측정 범위를 넘으면 그럴듯한 엉뚱한 값을 보여 준다. 반면 들어간 것과 나온 것의 수지(물질 수지)는 속일 수 없다."
breaks = "공정이 일부러 재고를 쌓거나 비우는 중이라면 수지가 안 맞는 게 정상이다. 계량기들이 모두 같은 방향으로 틀려 있으면 수지 비교도 소용이 없다."
confidence = "높음"
conditions = ["S_instrument_doubt", "S_hidden_state", "S_blind_spot"]

[[hypothesis]]
id = "H_refinery_operation_03"
text = "반응이 늦게 나타나는 대상은 조금 바꾸고 결과를 기다려야 한다. 기다리지 못하고 덧대면 늦게 온 효과가 겹쳐 흔들림만 커진다. 여러 가지를 동시에 바꾸면 무엇이 효과를 냈는지도 알 수 없다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "정유 공정 운전"
group = "기계·현대기술"
rule = "증류탑은 한 번에 한 가지만, 조금씩 바꾸고 최소 30분에서 몇 시간은 기다려라. 초보는 반응이 안 보인다고 또 돌리다가 탑을 출렁이게(진동 운전) 만든다."
why = "탑은 덩치가 커서 열과 물질이 퍼지는 데 시간이 걸린다. 반응을 기다리지 않고 덧대면 늦게 도착한 효과들이 겹쳐 과보정이 된다."
breaks = "압력이 안전 한계로 치닫는 비상 상황에서는 기다리지 말고 크게, 빠르게 움직여야 한다."
confidence = "높음"
conditions = ["S_delayed_feedback", "S_first_time"]

[[hypothesis]]
id = "H_refinery_operation_04"
text = "일이 사람 사이로 넘어갈 때 가장 잘 빠지는 것은 평소와 다른 예외 상태다. 정상은 생략하고 예외만 골라 직접 확인시키는 게 전달의 핵심이다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "정유 공정 운전"
group = "기계·현대기술"
rule = "교대 인수인계는 일지만 넘기지 말고 둘이 같이 화면과 현장을 훑어라. 특히 평소와 다르게 잠가 두거나 열어 둔 밸브, 정비 중인 장비, 우회 중인 것은 입으로 따로 짚어 줘라."
why = "정상 상태는 다음 사람도 알지만, 평소와 다른 예외 상태는 머릿속에만 있다가 교대와 함께 사라진다."
breaks = "인수인계가 너무 길고 형식적이면 오히려 핵심이 묻힌다. 길게 말하기보다 '평소와 다른 것'만 추려 말하는 게 맞다."
confidence = "높음"
conditions = ["S_handoff", "S_hidden_state", "S_routine"]

[[hypothesis]]
id = "H_refinery_operation_05"
text = "측정 지점 사이의 빈틈에서 생긴 이상은 지표보다 사람이 느끼는 '평소와 다름'으로 먼저 드러난다. 평소 상태를 몸으로 알아 둬야 그 차이가 잡힌다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "정유 공정 운전"
group = "기계·현대기술"
rule = "현장 순찰 돌 때는 귀와 코와 손등을 써라. 펌프에서 자갈 굴러가는 소리가 나면 공동현상(캐비테이션, 액체 속에 기포가 생겨 터지는 현상)이고, 평소에 안 나던 냄새가 나면 어딘가 새고 있다. 화면에는 아직 아무것도 안 뜬다."
why = "계기는 정해진 지점만 재지만, 사람 감각은 넓게 훑으면서 '평소와 다름'을 잡는다. 문제는 대개 계기가 없는 곳에서 먼저 신호를 낸다."
breaks = "독성 가스처럼 냄새를 맡는 순간 이미 위험한 물질은 감각에 기대면 안 된다. 사람 감각은 익숙해지면 둔해진다는 점도 감안해야 한다."
confidence = "높음"
conditions = ["S_blind_spot", "S_tacit_sense", "S_tool_wear"]

[[hypothesis]]
id = "H_refinery_operation_06"
text = "경고가 너무 잦으면 사람들은 모든 경고를 무시하게 되어 진짜 경고까지 묻힌다. 경고가 한꺼번에 쏟아질 때는 가장 먼저 울린 것이 원인에 가장 가깝다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "정유 공정 운전"
group = "기계·현대기술"
rule = "쓸데없이 자주 울리는 알람(뉴슨스 알람)을 방치하지 마라. 다들 습관처럼 확인 버튼만 누르다가 진짜 알람이 그 속에 섞여 지나간다. 이상 상황이 터지면 1분에 수십 개씩 쏟아지니, 그때는 맨 처음 뜬 알람부터 봐라."
why = "사람이 처리할 수 있는 경보 수에는 한계가 있다. 의미 없는 경보가 많으면 모든 경보의 무게가 가벼워진다. 그리고 처음 뜬 경보가 원인에 가장 가깝다."
breaks = "반대로 알람 설정값을 함부로 넓히거나 끄면 진짜 신호를 놓친다. 줄이는 건 검토를 거쳐야 한다."
confidence = "높음"
conditions = ["S_routine", "S_fatigue", "S_cascade"]

[[hypothesis]]
id = "H_refinery_operation_07"
text = "작은 양이라도 조건이 바뀌는 순간 성질이 급변하는 이물질이 숨어 있으면 전체를 망가뜨릴 수 있다. 상태를 크게 바꾸기 전에는 그런 것이 고여 있을 낮은 곳부터 비운다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "정유 공정 운전"
group = "기계·현대기술"
rule = "뜨거운 기름 쪽에 물이 들어가는 걸 제일 무서워해라. 물은 수증기가 되면 부피가 천 배 넘게 불어나서 탱크나 탑을 넘치게 하거나 터뜨린다. 가열하기 전에 낮은 곳에 고인 물이 없는지부터 확인하는 게 관례다."
why = "끓는점이 낮은 물질이 갑자기 고온을 만나면 한순간에 상변화가 일어나 부피가 폭발적으로 늘어난다. 고인 물은 배관 낮은 곳이나 바닥처럼 안 보이는 데 숨어 있다."
breaks = "공정상 일부러 스팀이나 물을 넣는 구간도 있다. 이런 곳은 양과 속도를 설계대로 지키면 문제가 없고, 위험한 건 예상하지 못한 물이다."
confidence = "높음"
conditions = ["S_rare_fatal", "S_hidden_state", "S_order_matters"]

[[hypothesis]]
id = "H_refinery_operation_08"
text = "보호 장치를 임시로 끈 상태는 편하기 때문에 저절로 원래대로 돌아오지 않는다. 기록하고 정기적으로 되묻는 장치가 없으면 '임시'가 영구가 된다."
