why = "연귀는 나무가 수축하면 두 면이 서로 벌어지지만, 코핑은 한쪽이 다른 쪽 면에 얹혀 있어 움직여도 겹침이 유지된다."
breaks = "칠로 마감하고 실내 습도가 일정한 곳, 단면이 단순한 평몰딩은 연귀로도 충분하다. 바깥 모서리는 코핑을 못 쓴다."
