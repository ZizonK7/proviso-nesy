id = "H_tower_crane_01"
text = "결과를 직접 볼 수 없어 남의 눈과 말에 기대 움직일 때는, 말이 끊기거나 흐려지는 순간 멈추는 것을 기본값으로 둔다. 멈추는 것도 위험한 상황이면 끊겼을 때 갈 곳을 미리 약속해 둔다."
