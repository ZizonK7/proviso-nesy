# 먼 분야 경험 논리 — 묶음 '건설'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 돌담 쌓기(모르타르 없이) (건설)
[[hypothesis]]
id = "H_drystone_walling_01"
text = "조각을 이어 만든 구조에서 이음매가 한 줄로 겹치면 처음엔 멀쩡해도 나중에 그 선을 따라 갈라지므로, 이음매는 늘 엇갈리게 둔다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "돌담 쌓기(모르타르 없이)"
group = "건설"
rule = "'하나 위에 둘, 둘 위에 하나'. 위아래 돌 사이 이음매(줄눈)가 두세 단 세로로 이어지면 그 단은 다시 쌓아라."
why = "한 돌의 무게가 아래 두 돌로 나뉘어 실리고, 세로로 이어진 이음매가 없어야 갈라질 선이 생기지 않는다."
breaks = "돌이 아주 둥근 들돌이면 완벽히 엇갈리기 어려워 속채움과 기울기를 더 신경 써야 한다. 모서리나 끝마감에서는 긴 돌을 번갈아 가로세로로 놓는 다른 방식을 쓴다."
confidence = "높음"
conditions = ["S_delayed_feedback", "S_cascade"]

[[hypothesis]]
id = "H_drystone_walling_02"
text = "겉을 넓게 덮는 배치는 당장 보기 좋지만 몸체와 맞물리는 깊이가 없어 먼저 떨어져 나가니, 보이는 넓이보다 안으로 물리는 길이를 우선한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "돌담 쌓기(모르타르 없이)"
group = "건설"
rule = "돌은 긴 쪽이 담 안쪽으로 들어가게 놓는다. 넓은 면을 보이려고 돌을 옆으로 길게 세워 겉만 덮으면 몇 해 안 가 툭 빠진다."
why = "안으로 깊이 물린 돌은 위의 무게에 눌려 붙들리지만, 겉에만 붙은 돌은 붙잡아 주는 것이 없다."
breaks = "맨 위 갓돌처럼 따로 역할이 정해진 돌이나, 장식을 위해 일부러 얇은 돌을 세우는 전통 양식은 예외다."
confidence = "높음"
conditions = ["S_goal_conflict", "S_judged_by_others", "S_delayed_feedback"]

[[hypothesis]]
id = "H_drystone_walling_03"
text = "겉의 단단함이 보이지 않는 안쪽 받침에 기대고 있으면 안쪽을 단계마다 함께 채워야 하고, 끝에 몰아서 채우면 숨은 빈틈이 겉을 서서히 무너뜨린다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "돌담 쌓기(모르타르 없이)"
group = "건설"
rule = "양쪽 겉돌 사이 빈 속은 작은 돌을 손으로 하나씩 끼워 넣어 채운다(속채움). 한 단 쌓을 때마다 채우고, 나중에 한꺼번에 붓지 마라."
why = "겉돌은 뒤에서 받쳐 주는 속채움에 기대 서 있어서, 속에 빈틈이 있으면 겉돌이 안으로 기울며 담 배가 불룩해진다."
breaks = "흙이나 모래로 속을 채우면 물을 머금고 얼어 부풀어 오히려 겉돌을 밀어낸다. 채우는 것이 '아무거나'면 안 된다."
confidence = "높음"
conditions = ["S_hidden_state", "S_order_matters", "S_slow_drift"]

[[hypothesis]]
id = "H_drystone_walling_04"
text = "단계마다 생기는 작은 오차는 같은 방향으로 쌓이기 쉬우니, 감에 맡기지 말고 바깥에 기준선을 세워 두고 매 단계 그 선에 대 본다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "돌담 쌓기(모르타르 없이)"
group = "건설"
rule = "담은 위로 갈수록 양면이 안쪽으로 좁아지게(기울기) 쌓되, 눈대중 말고 양 끝에 틀을 세우고 실을 매어 단마다 실을 한 칸씩 올리며 맞춘다."
why = "눈으로 보면 한 단의 오차는 안 보이지만 몇 단 쌓이면 같은 방향으로 모여 배가 나오거나 바깥으로 쏠린다."
breaks = "기울기를 너무 주면 위 폭이 좁아져 갓돌 놓을 자리가 없고, 둥근 돌은 반대로 기울기를 더 줘야 한다. 비율은 지역과 돌마다 다르다."
confidence = "중간"
conditions = ["S_slow_drift", "S_repetition", "S_tacit_sense"]

[[hypothesis]]
id = "H_drystone_walling_05"
text = "꼭 필요한 순간에만 쓰이는 드문 자원은 처음부터 따로 떼어 두지 않으면 당장 급한 곳에 먼저 쓰여, 정작 필요할 때 없다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "돌담 쌓기(모르타르 없이)"
group = "건설"
rule = "담 높이 중간쯤에 양면을 다 가로지르는 긴 돌(관통석)을 대략 한 걸음 간격으로 넣는다. 긴 돌은 처음부터 따로 빼 두지 않으면 쌓다가 아무 데나 써 버린다."
why = "관통석이 두 겉면을 묶어 주지 않으면 두 면이 따로 놀다 벌어진다. 긴 돌은 드물어서 한번 써 버리면 다시 구하기 어렵다."
breaks = "낮은 담이나 폭이 아주 좁은 담은 관통석 없이도 버틴다. 관통석이 겉으로 너무 튀어나오면 가축이나 사람이 걸려 오히려 무너뜨린다."
confidence = "중간"
conditions = ["S_fixed_budget", "S_have_vs_reach", "S_order_matters"]

[[hypothesis]]
id = "H_drystone_walling_06"
text = "같은 동작이 수없이 반복되는 일은 시작 전 분류와 배치에 들인 시간이 헛동작을 줄여, 끝까지 버틸 힘을 남긴다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "돌담 쌓기(모르타르 없이)"
group = "건설"
rule = "쌓기 전에 돌을 크기별로 담 양옆에 늘어놓는다. 큰 돌은 아래 쓸 자리 가까이 두고, 돌은 한 번 들면 놓을 자리까지 가져가라."
why = "돌을 들었다 놨다 하는 헛동작이 하루 체력을 가장 많이 잡아먹고, 지치면 허리를 다친다."
breaks = "돌이 적거나 작업 공간이 좁으면 다 펼쳐 놓을 수 없다. 그럴 땐 한 구간씩 나눠 고른다."
confidence = "높음"
conditions = ["S_fixed_budget", "S_fatigue", "S_repetition"]

[[hypothesis]]
id = "H_drystone_walling_07"
text = "빈자리에 꼭 맞는 것을 찾기보다 가진 것이 들어갈 자리를 찾는 편이 빠르며, 몇 번 시도해 안 맞으면 붙들고 있지 말고 바꾼다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "돌담 쌓기(모르타르 없이)"
