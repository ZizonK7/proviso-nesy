why = "꼭 맞는 돌 하나를 찾느라 돌무더기를 뒤지는 시간이 쌓는 시간보다 길어지고, 손에 든 돌에 맞는 자리는 대개 어딘가 있다."
breaks = "모서리, 관통석, 갓돌처럼 역할이 정해진 자리는 맞는 돌을 따로 골라야 한다."
confidence = "중간"
conditions = ["S_material_varies", "S_sunk_cost"]

