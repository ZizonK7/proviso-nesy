why = "겉에 박은 쐐기는 진동과 서리에 먼저 빠지고, 그러면 위 돌이 내려앉는다. 뒤에서 넓게 받친 돌은 오래 간다."
breaks = "일부 지역 전통은 겉면에 작은 돌을 끼워 마감하기도 하는데, 이건 구조가 아니라 틈 메움이다."
confidence = "높음"
conditions = ["S_hidden_state", "S_delayed_feedback"]

