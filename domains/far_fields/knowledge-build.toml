why = "운전실에서는 화물이 건물 뒤나 아래층으로 들어가면 안 보인다. 신호가 끊긴 순간 그 밑에 사람이 들어와 있을 수 있다."
breaks = "강풍 속에 화물을 사람 머리 위에 매단 채 멈추는 게 더 위험할 때는 미리 정한 안전 구역으로 빼는 쪽이 맞다. 그래서 '끊기면 어디로 뺀다'를 작업 전에 정해 둔다."
confidence = "높음"
conditions = ["S_blind_spot", "S_handoff", "S_team_sync"]

