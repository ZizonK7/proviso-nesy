text = "기준이 이상적인 값일 거라고 가정하고 미리 잘라 두면 실제와의 작은 차이가 이음매에서 틈으로 드러난다. 맞붙일 자리는 실제 값을 재서 나눠 맞춘다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 2026-11-03, 출처 없음(모델 지식), 검토 없음"
field = "몰딩 목공"
group = "건설"
rule = "벽 모서리가 정확히 90도라고 믿고 45도로 자르지 마라. 각도자(각도 재는 자)로 실제 각을 재서 반으로 나눠 잘라야 이음매가 안 벌어진다. 오래된 집은 88~93도가 흔하다."
why = "벽은 미장·석고보드 두께 차이로 직각에서 조금씩 벗어나 있고, 몰딩은 그 오차를 그대로 틈으로 드러낸다."
breaks = "새로 지은 집에서 골조를 정밀하게 잡았으면 표준 45도로도 맞는다. 칠로 메울 몰딩이면 1도 안팎은 퍼티(틈 메움재)로 감춘다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_irreversible", "S_material_varies"]

