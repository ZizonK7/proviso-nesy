# 오징어 채낚기 (바다)
[[hypothesis]]
id = "H_squid_jigging_01"
text = "끌어들이는 힘은 신호의 절대 세기가 아니라 주변과의 차이에서 나오므로, 바탕이 밝아지는 때에는 세기를 올려도 효과가 적고 바탕이 어두워질 때를 기다리는 편이 낫다."
