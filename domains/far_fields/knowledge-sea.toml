field = "오징어 채낚기"
group = "바다"
rule = "보름 전후로는 집어등(오징어를 모으는 불)을 다 켜도 조황이 처진다. 그믐 쪽 물때를 노리고, 달 뜨는 밤이면 달이 지고 난 뒤에 줄이 살아나는지 지켜봐라."
why = "달빛이 바다 전체를 밝히면 배 불빛과 주변의 밝기 차이가 줄어 오징어가 한곳에 모이지 않는다."
breaks = "구름이 두껍게 낀 보름밤이나, 어군 밀도가 아주 높은 철에는 달과 상관없이 잘 잡히기도 한다."
confidence = "높음"
conditions = ["S_uncontrolled_env", "S_short_window"]

