why = "발굽은 한 달에 1cm 남짓밖에 안 자라서 너무 깎으면 몇 주 동안 말이 아파하고, 발바닥이 얇은 말은 더 빨리 한계에 닿는다."
breaks = "죽은 각질이 두껍게 쌓인 발이나 농양(고름집)을 찾아 배출해야 할 때는 평소보다 더 깎아야 한다. 말마다 발바닥 두께가 달라 같은 깊이가 누구에겐 과하다."
