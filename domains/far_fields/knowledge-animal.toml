# 말발굽 장제 (동물)
[[hypothesis]]
id = "H_farrier_work_01"
text = "결과물만 떼어 놓고 고치면 그것을 만든 원인을 놓치므로, 손대기 전에 대상이 평소 조건에서 움직이는 모습을 먼저 본다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "말발굽 장제"
group = "동물"
rule = "발을 들기 전에 평평하고 단단한 바닥에서 말을 세워 보고, 앞뒤에서 걷기와 속보를 먼저 본다. 발굽만 들여다보고 깎으면 그 말의 다리 생김새와 디딤 습관을 놓친다."
why = "발굽 모양은 그 말의 다리 구조와 걸음걸이가 오래 남긴 결과라서, 들어 올린 발만 봐서는 원인을 알 수 없다."
breaks = "말이 심하게 절거나 다쳐서 걷게 하면 안 될 때는 서 있는 모습과 촉진만으로 판단해야 한다. 바닥이 기울거나 무르면 오히려 잘못 읽는다."
confidence = "높음"
conditions = ["S_hidden_state", "S_living_system", "S_order_matters"]

