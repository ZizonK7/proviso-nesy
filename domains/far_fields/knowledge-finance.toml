group = "금융"
rule = "공급 여유(예비력)가 얇은 날에는 발전소 하나의 고장이 가격을 몇 배로 튀게 한다. 여유가 얇은 날 숏 포지션(가격 하락에 건 포지션)을 크게 들고 있지 마라."
why = "공급이 한계 근처일 때는 남은 비싼 발전기까지 돌려야 해서 가격이 가파르게 오르고, 고장 하나가 그 경계를 넘게 만든다."
breaks = "가격 상한 제도가 엄격한 시장에서는 튀는 폭이 상한에서 막힌다. 그래도 상한까지의 손실은 크다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
