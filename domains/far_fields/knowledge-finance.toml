text = "관계를 되살려야 하는 일에서는 상대가 확실히 지킬 수 있는 작은 약속부터 받는다. 첫 성공이 다음 행동의 습관이 되고, 큰 약속이 깨지면 관계 자체가 끊긴다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 3차 2026-11-04, 출처 없음(모델 지식), 검토 없음"
field = "채권 추심"
group = "금융"
rule = "약속 금액은 채무자가 처음 부르는 숫자보다 조금 낮게 잡아도 된다. 작은 금액이라도 약속한 날에 한 번 들어오는 게 큰 약속 한 번 깨지는 것보다 낫다."
why = "한 번 지킨 약속은 다음 약속의 습관이 되지만, 무리한 약속이 깨지면 채무자가 연락을 피하기 시작한다."
breaks = "채무자가 자산을 빼돌리는 신호가 있거나 시효가 다가오면 작은 분할로 시간을 주는 것이 손해다."
confidence = "중간"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_repetition", "S_trust_building", "S_living_system"]

