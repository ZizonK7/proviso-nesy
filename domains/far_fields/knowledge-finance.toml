# 먼 분야 경험 논리 — 묶음 '금융'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 보험계리 (금융)
[[hypothesis]]
id = "H_fin3_01_01"
text = "자료가 적을 때 과거에 딱 맞는 설명은 우연까지 외운 것일 가능성이 크다. 적은 자료에서는 일부러 덜 맞추고 넓은 바탕 값 쪽으로 당겨 둔다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 3차 2026-11-04, 출처 없음(모델 지식), 검토 없음"
field = "보험계리"
group = "금융"
rule = "새 가정이 지난 몇 년 실적에 너무 잘 맞으면 오히려 의심해라. 경험 통계가 적은 상품에서 딱 맞는 곡선은 대개 우연한 몇 건에 맞춘 것이다."
why = "자료가 적을 때 가정을 실적에 꼭 맞추면 무작위한 흔들림까지 규칙으로 읽어 버리고, 다음 해에 크게 빗나간다."
breaks = "가입자가 아주 많고 오래된 상품은 실적 자체가 믿을 만해서 실적에 바짝 맞추는 게 맞다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_instrument_doubt", "S_scale_change"]

[[hypothesis]]
id = "H_fin3_01_02"
text = "내 경험이 적을 때는 넓은 바탕 자료와 섞고, 경험이 쌓일수록 내 쪽 비중을 올린다. 다만 바탕 자료가 나와 성격이 다르면 섞을수록 틀어진다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 3차 2026-11-04, 출처 없음(모델 지식), 검토 없음"
field = "보험계리"
group = "금융"
rule = "자기 회사 경험이 적으면 업계 통계와 섞어라. 섞는 비율은 경험 건수에 따라 정하고, 건수가 늘수록 자기 경험 쪽 비중을 올린다(신뢰도 이론)."
why = "적은 경험은 흔들림이 크고, 업계 통계는 안정적이지만 자기 고객과 다를 수 있어서 둘을 무게를 달리해 섞는 게 가장 덜 틀린다."
breaks = "자기 고객층이 업계 평균과 성격이 전혀 다르면(특수 직군 등) 업계 통계를 섞는 것이 오히려 왜곡한다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_scale_change", "S_material_varies"]

[[hypothesis]]
id = "H_fin3_01_03"
text = "여러 조건을 고칠 때는 하나씩 바꿔 각각이 결과를 얼마나 움직이는지 먼저 보인다. 한꺼번에 바꾸면 결과는 같아도 왜 바뀌었는지 설명할 수 없다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 3차 2026-11-04, 출처 없음(모델 지식), 검토 없음"
field = "보험계리"
group = "금융"
rule = "가정을 바꿀 때는 숫자 하나씩 바꿔 결과가 얼마나 움직이는지 먼저 보여 줘라. 여러 가정을 한꺼번에 바꾸면 누가 봐도 어느 것 때문에 준비금이 늘었는지 설명이 안 된다."
why = "경영진과 감독기관은 결과가 왜 바뀌었는지를 묻는데, 원인을 나눠 보이지 못하면 가정 변경 전체가 의심받는다."
breaks = "가정들이 서로 묶여 있어서(금리와 해지율 등) 하나만 바꾸는 게 의미 없을 때는 묶음 단위로 나눠 보인다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_judged_by_others", "S_order_matters"]

