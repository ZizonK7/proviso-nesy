why = "보험금 지급과 해지는 가입 후 시간이 지나며 쌓이는 모양이 있어서, 초기 몇 해 실적은 대개 좋게 보인다."
breaks = "같은 상품을 오래 팔아 경과 기간별 흐름을 이미 알고 있다면 초기 실적을 그 흐름과 비교해 판단할 수 있다."
confidence = "높음"
