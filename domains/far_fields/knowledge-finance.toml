group = "금융"
rule = "목표 금액을 너무 높게 잡으면 실패하고, 너무 낮게 잡으면 다 모여도 실제 생산비가 모자란다. 최소 생산 수량의 실제 견적을 받아서 목표를 정하게 한다."
