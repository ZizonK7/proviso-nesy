why = "이유를 모르는 이익은 같은 포지션을 더 키우게 만들고, 그 숨은 위험이 드러날 때 크게 잃는다."
breaks = "아주 짧은 시간 단위의 거래는 개별 이익마다 이유를 다 설명하기 어렵다. 그래도 합계 단위로는 설명할 수 있어야 한다."
