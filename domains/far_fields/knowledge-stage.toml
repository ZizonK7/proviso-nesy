# 먼 분야 경험 논리 — 묶음 '공연·예술'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 피아노 조율 (공연·예술)
[[hypothesis]]
id = "H_piano_tuning_01"
text = "전체를 서로 비교해서 맞추는 일에서는 작은 기준 구간을 가장 정밀하게 먼저 만들고, 그다음에 거기서 바깥으로 넓혀 간다. 기준이 틀리면 그 오차가 비교를 타고 전체로 복제된다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "A4 하나를 소리굽쇠나 기준음에 맞춘 다음, 가운데 한 옥타브 안에서 템퍼먼트(평균율 기준 구간)를 4도·5도 맥놀이(두 음이 부딪혀 생기는 울렁임) 속도로 먼저 잡는다. 그 뒤에 옥타브로 위아래를 넓혀 나가야지, 끝에서부터 맞추면 나중에 다 다시 해야 한다."
why = "나머지 건반은 모두 이 기준 구간과 옥타브 비교로 맞추기 때문에, 기준의 오차가 전체로 복제된다."
breaks = "이미 상태가 좋은 피아노를 손보기만 할 때는 기준 구간을 새로 잡지 않고 틀어진 곳만 고치는 게 낫다."
confidence = "높음"
conditions = ["S_order_matters", "S_cascade"]

[[hypothesis]]
id = "H_piano_tuning_02"
text = "전체 하중을 크게 바꾸는 조정에서는 먼저 맞춘 부분이 나중 조정 때문에 다시 움직인다. 그래서 거칠게 한 바퀴 전체를 옮겨 놓고 나서 정밀하게 다시 돈다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "음높이가 많이 내려간 피아노(대략 수십 센트 이상)는 한 번에 정밀하게 맞추지 말고, 목표보다 살짝 높게 전체를 빠르게 끌어올리는 '피치 레이즈'를 먼저 하고 나서 다시 정밀 조율을 한다."
why = "줄 장력이 크게 늘면 향판과 프레임이 눌리면서 먼저 맞춘 줄들이 다시 내려가기 때문이다."
breaks = "차이가 작으면 두 번 도는 건 시간 낭비고, 낡은 줄이 많은 피아노는 과하게 끌어올리다 줄이 끊긴다."
confidence = "높음"
conditions = ["S_order_matters", "S_cascade", "S_hidden_state"]

[[hypothesis]]
id = "H_piano_tuning_03"
text = "마찰이 많은 대상을 조정한 뒤에는 실제 사용보다 센 부하를 일부러 걸어 본다. 지금 버티는 상태와 나중에도 버티는 상태는 다르고, 늦게 풀릴 것은 미리 풀어 보는 게 낫다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "음은 아래에서 올려 맞추고, 맞춘 뒤 건반을 평소보다 세게 몇 번 쳐 본다. 세게 쳤을 때 음이 떨어지면 핀(줄을 감는 쇠막대)이나 줄이 덜 자리 잡은 것이니 다시 한다."
why = "줄은 여러 지지점을 지나가서 마찰 때문에 장력이 고르게 퍼지지 않는다. 센 타건이 그 불균형을 미리 풀어 준다."
breaks = "섬세한 마무리 단계에서 너무 세게 치면 오히려 이미 안정된 곳을 흔든다. 오래된 핀은 아래에서 올리는 것만으로는 버티지 못한다."
confidence = "높음"
conditions = ["S_hidden_state", "S_delayed_feedback"]

[[hypothesis]]
id = "H_piano_tuning_04"
text = "아주 작은 조정을 해야 할 때는 몸의 큰 움직임이 결과를 작게만 바꾸는 자세를 먼저 잡는다. 엉뚱한 방향으로 들어간 힘은 당장은 안 보여도 나중에 풀리며 결과를 되돌린다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "조율 해머(핀을 돌리는 손잡이 공구)는 핀과 일직선에 가까운 위치에 걸고, 팔이 아니라 손목의 아주 작은 움직임으로 돌린다. 핀을 비틀어 휘게 하면 그 자리에선 맞아도 며칠 뒤에 음이 내려간다."
why = "핀은 나무 판에 박혀 있어 휨과 회전을 같이 받는다. 휜 상태로 맞춘 음은 핀이 서서히 펴지면서 무너진다."
breaks = "아주 뻑뻑한 핀이나 크게 끌어올릴 때는 더 큰 힘이 필요하다. 이때도 휘는 힘보다 회전하는 힘이 되도록 자세부터 바꾼다."
confidence = "중간"
conditions = ["S_tacit_sense", "S_delayed_feedback", "S_hidden_state"]

[[hypothesis]]
id = "H_piano_tuning_05"
text = "부품이 이상적이지 않은 대상에서는 이론값대로 맞춘 결과가 실제로는 틀리게 받아들여진다. 그 개체의 실제 성질을 먼저 재고, 그것으로 목표값을 고친다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "높은음 옥타브는 수치상 정확한 2배보다 조금 넓게(스트레치) 잡는다. 작은 업라이트는 그랜드보다 더 넓혀야 한다. 전자 조율기를 쓰더라도 그 피아노의 줄 성질을 먼저 측정해 반영해야 한다."
why = "실제 줄은 굵기와 뻣뻣함 때문에 배음이 이론값보다 높게 나와서(인하모니시티), 이론대로 맞추면 귀에는 좁게 들린다."
breaks = "측정 없이 '많이 넓히면 좋다'로 가면 과해진다. 다른 악기와 합주할 때는 상대 악기 쪽 기준에 맞춰 덜 넓히기도 한다."
confidence = "높음"
conditions = ["S_material_varies", "S_instrument_doubt"]

[[hypothesis]]
id = "H_piano_tuning_06"
text = "바깥 환경이 막 바뀐 대상을 바로 정밀 조정하면 대상이 새 환경에 적응하면서 조정이 헛수고가 된다. 먼저 안정될 시간을 주고 그 뒤에 맞춘다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "피아노를 옮겼거나 난방·제습 환경이 막 바뀌었으면 바로 정밀 조율하지 말고 2주쯤 자리 잡게 둔다. 습한 여름엔 음이 올라가고 건조한 겨울엔 내려간다."
why = "향판(울림판)이 습도에 따라 부풀고 줄어들며 줄 장력이 바뀐다. 적응 전에 맞추면 금방 다시 틀어진다."
breaks = "공연 전처럼 당장 써야 하면 그날 조건에 맞춰 조율하고, 나중에 다시 손볼 것을 손님에게 미리 알린다."
confidence = "높음"
conditions = ["S_uncontrolled_env", "S_slow_drift", "S_delayed_feedback"]

[[hypothesis]]
id = "H_piano_tuning_07"
text = "오래 버텨 온 대상을 표준 상태로 한 번에 돌려놓으려 하면 가장 약한 지점이 먼저 끊어진다. 목표를 조금 낮추거나 여러 번에 나눠 옮기는 게 전체를 지키는 길이다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "오래 방치된 낡은 피아노는 손님이 표준 음높이(A=440 등)를 원해도, 줄이 녹슬었거나 핀이 헐거우면 지금 있는 음높이에 맞춰 조율하자고 권한다. 올려야 한다면 몇 번에 나눠 조금씩 올린다."
why = "녹슨 줄은 장력이 갑자기 늘면 핀 근처 마찰 지점에서 끊어지고, 줄 하나를 갈면 그 줄은 한동안 계속 늘어난다."
breaks = "합주나 녹음처럼 표준 음높이가 꼭 필요하면 줄 교체 위험을 감수하고 손님과 미리 합의한 뒤 올린다."
confidence = "높음"
conditions = ["S_goal_conflict", "S_irreversible", "S_rare_fatal"]

[[hypothesis]]
id = "H_piano_tuning_08"
text = "사용자가 말하는 불만은 증상을 자기 말로 부른 것이지 원인이 놓인 층을 가리키지 않는다. 손대기 전에 직접 재현시켜 보고 어느 층의 문제인지부터 가린다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "손님이 '소리가 이상하다'고 하면 바로 핀부터 돌리지 말고 무슨 곡을 치는지, 어디가 어떻게 이상한지 쳐 보게 한다. 쨍하거나 먹먹하다는 불만은 조율이 아니라 정음(해머 펠트의 단단함 조절)이나 조정(건반 동작 맞춤) 문제인 경우가 많다."
why = "손님은 증상을 자기 말로 표현할 뿐이라, 음높이·음색·터치 문제가 모두 '음이 이상하다'로 나온다."
breaks = "정기 점검처럼 요청이 분명하면 길게 묻지 않고 바로 조율하는 게 손님에게 낫다."
confidence = "높음"
conditions = ["S_hidden_state", "S_judged_by_others"]

[[hypothesis]]
id = "H_piano_tuning_09"
text = "감각으로 미세한 차이를 판단할 때는 오래 붙잡을수록 감각이 적응해 무뎌진다. 짧게 판단하고 넘어가되, 지친 뒤에 한 부분은 쉬고 나서 다시 확인한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "맥놀이를 한 음에서 오래 붙잡고 듣지 말고 2~3초 안에 판단한다. 한두 시간 넘게 연달아 하면 귀가 무뎌져 고음 유니즌(같은 음을 내는 두세 줄)이 대충 넘어가니, 중간에 잠깐 쉬거나 끝에 고음을 다시 확인한다."
why = "귀는 같은 소리를 오래 들으면 적응해 버려 작은 차이를 놓치고, 고음은 맥놀이가 빨라 피로할 때 특히 듣기 어렵다."
breaks = "초보는 2~3초로는 맥놀이를 못 잡으니, 처음엔 오래 듣더라도 익숙해지는 게 먼저다."
confidence = "중간"
conditions = ["S_fatigue", "S_tacit_sense", "S_slow_drift"]

[[hypothesis]]
id = "H_piano_tuning_10"
text = "조정에 쓴 기준과 같은 기준으로 검사하면 그 기준이 가진 체계적 오차가 보이지 않는다. 검산은 다른 각도의 기준으로, 연속된 변화가 고른지를 본다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "피아노 조율"
group = "공연·예술"
rule = "템퍼먼트를 다 잡은 뒤에는 맞출 때 쓴 4도·5도가 아니라 장3도·장10도 같은 다른 음정을 반음씩 올라가며 쳐서, 맥놀이 속도가 고르게 빨라지는지로 검산한다."
why = "맞출 때 쓴 음정으로 확인하면 같은 방식의 실수가 그대로 숨는다. 다른 음정은 오차를 다른 각도에서 드러낸다."
breaks = "전자 조율기로 이미 계산된 값을 따랐으면 확인 음정을 줄여도 되지만, 기계 설정 자체가 틀렸을 가능성은 여전히 남는다."
confidence = "높음"
conditions = ["S_instrument_doubt", "S_blind_spot"]

[[hypothesis]]
id = "H_piano_tuning_11"
text = "시간이 모자랄 때는 실제 쓰일 조건을 재현한 상태에서, 받는 사람이 가장 먼저 알아채는 종류의 오류와 가장 많이 쓰는 부분부터 고친다."
