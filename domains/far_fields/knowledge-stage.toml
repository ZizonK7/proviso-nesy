why = "조명 열로 피아노 음높이가 바뀌고, 청중은 미세한 템퍼먼트보다 유니즌이 어긋나 '쌩' 하고 퍼지는 소리를 먼저 알아챈다."
breaks = "녹음이나 까다로운 연주자의 공연처럼 세밀한 음정이 드러나는 자리에서는 우선순위만으로 버티지 말고 시간을 더 달라고 해야 한다."
confidence = "중간"
