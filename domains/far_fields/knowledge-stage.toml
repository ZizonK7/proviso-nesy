why = "줄 자체의 불균일이나 브리지 핀이 헐거워 생기는 울렁임이라 핀을 돌려서는 사라지지 않는다."
breaks = "초보가 거짓 맥놀이라 착각하는 것 대부분은 그냥 덜 맞은 것이니, 먼저 제대로 맞췄는지 다시 확인해야 한다."
confidence = "중간"
conditions = ["S_material_varies", "S_hidden_state", "S_sunk_cost"]

# 특수 분장 (공연·예술)
[[hypothesis]]
