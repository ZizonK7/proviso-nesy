[[hypothesis]]
id = "H_piano_tuning_12"
text = "대상 자체가 신호와 비슷한 잡음을 만들면 조정을 아무리 해도 그 잡음은 사라지지 않는다. 결함을 알아보고 가장 나은 지점에서 멈추는 판단이 완벽을 쫓는 것보다 낫다."
