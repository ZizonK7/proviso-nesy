# 먼 분야 경험 논리 — 묶음 '물·강'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 플라이 낚시 (물·강)
[[hypothesis]]
id = "H_fly_fishing_01"
text = "상대가 어떤 조건에서 나를 보는지 따져 보면 무엇을 먼저 맞춰야 하는지 순서가 정해진다. 상대 눈에 잘 안 보이는 속성을 다듬는 데 공을 들이면 헛수고가 된다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "플라이 낚시"
group = "물·강"
rule = "물 위로 나온 벌레를 건져 보고 훅(바늘)을 고를 때는 크기, 실루엣(겉모양), 색 순서로 맞춘다. 송어가 거부하면 색부터 바꾸지 말고 한 치수 작은 것으로 내려 본다."
why = "물속에서 위를 보는 고기에게는 하늘을 배경으로 한 그림자 크기와 윤곽이 먼저 보이고, 색은 역광 때문에 잘 구분되지 않는다."
breaks = "물이 흐리거나 깊은 곳에서 끌어서 쓰는 미끼는 크기보다 색 대비와 움직임이 더 먹힌다. 해치(벌레가 한꺼번에 깨어나는 때)가 없을 때는 아예 다른 기준으로 고른다."
confidence = "높음"
conditions = ["S_order_matters", "S_living_system", "S_material_varies"]

[[hypothesis]]
id = "H_fly_fishing_02"
text = "주변 흐름에 그대로 실려 가야 자연스러운 것이 혼자 다른 속도로 움직이면 아무리 겉모양이 그럴듯해도 금방 의심을 산다. 겉모습보다 주변과 움직임이 맞는지를 먼저 본다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "플라이 낚시"
group = "물·강"
rule = "훅이 흐름보다 조금이라도 빠르거나 느리게 움직이면(드래그) 고기가 다가왔다가 돌아선다. 라인을 흐름 위쪽으로 살짝 들어 넘겨(멘딩) 훅이 물과 같은 속도로 떠내려가게 해야 한다."
why = "진짜 벌레는 물 흐름에 그대로 실려 가므로, 흐름과 어긋난 움직임 자체가 가짜라는 가장 강한 신호가 된다."
breaks = "날도래처럼 수면에서 파닥이며 움직이는 벌레가 나오는 때나 스트리머(작은 물고기를 흉내 낸 미끼)는 일부러 끌거나 흔들어야 문다."
confidence = "높음"
conditions = ["S_living_system", "S_uncontrolled_env", "S_tacit_sense"]

[[hypothesis]]
id = "H_fly_fishing_03"
text = "상대가 아직 나를 모를 때가 가장 좋은 기회이고, 한 번 경계하게 만들면 다시 그 상태로 돌리기 어렵다. 그래서 첫 시도에 준비를 몰아 쓴다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "플라이 낚시"
group = "물·강"
rule = "고기는 상류를 보고 있으니 하류에서 몸을 낮추고 다가가라. 첫 캐스팅이 가장 좋은 기회다. 라인이 고기 머리 위로 떨어지면(라이닝) 그 고기는 한참 동안 끝난 거다."
why = "놀란 고기는 몸을 숨기고 먹이 활동을 멈추며, 다시 경계를 풀기까지 오래 걸린다."
breaks = "물살이 세고 수면이 거친 곳에서는 고기 시야가 좁아져 위쪽이나 옆에서 접근해도 되고, 몇 번 실수해도 회복된다."
confidence = "높음"
conditions = ["S_irreversible", "S_living_system", "S_short_window"]

