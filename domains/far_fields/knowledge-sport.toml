# 먼 분야 경험 논리 — 묶음 '스포츠'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 축구 심판 (스포츠)
[[hypothesis]]
id = "H_football_refereeing_01"
text = "개입이 오히려 피해자의 기회를 빼앗을 수 있고 나중에 개입할 길이 열려 있다면, 잠깐 지켜본 뒤 결정하는 편이 낫다. 다만 해가 커지는 중이면 기다리지 않는다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "축구 심판"
group = "스포츠"
rule = "반칙이 나와도 바로 불지 말고 2~3초쯤 지켜봐라. 당한 팀이 공격을 이어 가면 두 팔을 앞으로 뻗어 어드밴티지(반칙당한 쪽에 유리하게 경기를 계속 흘려보내는 것)를 주고, 이득이 안 생기면 그때 원래 반칙으로 돌아가 불면 된다."
why = "바로 끊으면 반칙당한 쪽이 오히려 좋은 기회를 잃는다. 규칙이 잠깐 기다린 뒤 원래 결정으로 돌아오는 것을 허용한다."
breaks = "심한 부상이 의심되거나 폭력적인 반칙이면 기다리지 말고 즉시 끊는다. 이득이 생길 여지가 없는 위치(자기 진영 깊은 곳)에서도 기다릴 이유가 없다."
confidence = "높음"
conditions = ["S_short_window", "S_two_sided", "S_delayed_feedback"]

[[hypothesis]]
id = "H_football_refereeing_02"
