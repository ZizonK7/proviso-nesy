why = "두 사람이 서로 반대편에서 보면 한 사람에게 가려진 장면이 다른 사람에게는 보인다."
breaks = "역습이나 롱볼로 플레이가 갑자기 반대쪽으로 넘어가면 정해진 동선보다 가장 가까운 각도를 먼저 잡아야 한다."
confidence = "높음"
conditions = ["S_blind_spot", "S_team_sync"]

