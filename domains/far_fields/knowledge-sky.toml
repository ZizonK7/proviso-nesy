# 고층 기상 관측 풍선 (하늘)
[[hypothesis]]
id = "H_weather_balloon_01"
text = "되돌릴 수 없는 단계 직전의 점검에서 어긋남이 보이면 그 자리에서 보정하기보다 통째로 교체하는 편이 낫다. 작은 어긋남은 조건이 거칠어질수록 커지는데, 그때는 손볼 기회가 없기 때문이다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "고층 기상 관측 풍선"
group = "하늘"
rule = "띄우기 전 지상 점검(기준기와 존데 값을 나란히 비교하는 것)에서 기압·기온·습도 중 하나라도 허용 폭을 넘으면 보정값 넣어 쓰지 말고 존데를 통째로 바꿔라. 한 번 날리면 그 존데는 다시 못 본다."
why = "지상에서 이미 어긋난 측정기는 하늘에서 더 크게 어긋나는 경우가 많고, 날린 뒤에는 고치거나 다시 확인할 방법이 없다."
breaks = "예비 존데가 없고 정시 관측 시간이 거의 끝나 가면, 어긋난 값을 기록해 두고 날리는 것이 아예 안 날리는 것보다 나을 수 있다."
confidence = "높음"
conditions = ["S_irreversible", "S_instrument_doubt", "S_can_rehearse"]

