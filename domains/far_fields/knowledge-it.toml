text = "두 흐름이 따로 지나가서 끝에서 만나는 구조에서는, 한쪽 경로만 조금 바뀌어도 둘이 어긋난다. 어긋남을 정기적으로 재서 조용히 벌어지는 틈을 잡는다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 3차 2026-11-04, 출처 없음(모델 지식), 검토 없음"
field = "방송 실시간 자막 송출"
group = "IT"
rule = "자막 송출 장비의 지연을 매일 재라. 영상 처리 단계가 하나만 바뀌어도 자막과 화면의 어긋남이 몇 초씩 달라진다."
why = "영상과 자막은 서로 다른 길로 지나가므로, 한쪽 길의 처리 시간이 바뀌면 둘의 짝이 어긋난다."
breaks = "자막이 영상 신호 안에 같이 실려 같은 길을 지나는 구조라면 어긋남이 덜하다."
confidence = "중간"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_slow_drift", "S_instrument_doubt"]

