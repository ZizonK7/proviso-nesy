[[hypothesis]]
id = "H_it3_03_01"
text = "대상이 실제로 받는 조건을 재야지, 전체 평균이나 돌아오는 쪽을 재면 국소적으로 나쁜 곳이 가려진다. 측정 위치를 대상이 받아들이는 지점에 둔다."
