[[hypothesis]]
id = "H_it3_01_01"
text = "오래 쓰인 체계에서 이유를 모르는 이상한 부분은 대개 예전 사고를 막으려고 생긴 것이니, 왜 있는지 확인하기 전에는 없애지 않는다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 3차 2026-11-04, 출처 없음(모델 지식), 검토 없음"
field = "메인프레임 COBOL 운영"
group = "IT"
rule = "40년 된 프로그램에서 아무도 이유를 모르는 이상한 줄을 발견해도 지우지 마라. 그 줄은 대개 오래전 어느 월말에 터진 사고를 막으려고 넣은 것이다."
why = "오래된 시스템의 기묘한 처리 대부분은 특정 데이터나 날짜 조건에서 난 장애를 막는 땜질이고, 그 이유는 문서에 없이 퇴직자 머릿속에만 있었다."
breaks = "정말 죽은 코드(어디서도 호출 안 됨)라는 게 실행 기록과 호출 관계 분석으로 확인되면 지워도 된다. 그래도 한 결산 주기는 지켜본다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_hidden_state", "S_rare_fatal"]

