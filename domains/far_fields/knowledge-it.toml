field = "데이터센터 냉각 관리"
group = "IT"
rule = "온도는 공조기 리턴(돌아오는 공기) 쪽이 아니라 랙 앞면, 장비가 빨아들이는 공기 높이에서 재라. 실내 평균이 괜찮아도 랙 맨 위 칸은 뜨거운 공기를 다시 빨아들이고 있을 수 있다."
why = "장비가 견디는 건 자기가 빨아들이는 공기 온도다. 리턴 온도나 실내 평균은 국소적인 뜨거운 지점(핫스팟)을 가린다."
breaks = "랙이 완전히 밀폐된 통로 안에 있고 기류가 균일하게 잡혀 있으면 대표 지점 몇 곳만 재도 된다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_instrument_doubt", "S_blind_spot"]

