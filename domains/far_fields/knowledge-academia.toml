text = "옛 기록을 지금의 기준으로 재현하면 기준이 다른 만큼 결과가 달라진다. 재현을 원래 것이라고 부르려면 그때의 기준부터 맞춘다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 3차 2026-11-04, 출처 없음(모델 지식), 검토 없음"
field = "옛 악보 복원(음악학)"
group = "학문"
rule = "옛 악보를 지금 악기와 지금 음높이(A=440)로 연주하고 '원래 소리'라고 하지 마라. 당시 기준음과 조율법이 달라서, 조성의 색깔이 완전히 바뀐다."
why = "기준음은 시대·도시마다 반음 이상 달랐고, 평균율이 아닌 조율에서는 조마다 화음의 울림이 달랐다."
breaks = "합창단처럼 기준음이 상대적인 경우나, 복원 목적이 선율 구조 연구라면 기준음 차이는 결론을 안 바꾼다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_instrument_doubt", "S_slow_drift"]

[[hypothesis]]
id = "H_acad3_44_05"
text = "기록의 단위 길이가 늘 같다고 보면 오래 전해지며 생긴 속도 변화를 놓친다. 지금 이어지는 연주가 있다면 기준이 되지만, 그것 역시 변한 뒤의 모습이다."
