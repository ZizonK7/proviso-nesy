why = "정간보는 칸으로 시가(음 길이)를 나타내지만, 같은 곡의 연주 속도가 수백 년 동안 크게 느려졌고 학자마다 박 해석이 다르다."
breaks = "지금까지 이어 연주되는 곡(전승곡)은 현행 연주가 하나의 기준이 되지만, 그것도 느려진 뒤의 모습이다."
confidence = "중간"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
