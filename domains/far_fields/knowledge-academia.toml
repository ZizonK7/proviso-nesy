why = "옛 악보는 특정 악기의 운지와 연주자의 몸에 맞춰 쓰였기 때문에, 연주 불가능한 해석은 대개 틀린 해석이다."
breaks = "연주 기술은 시대마다 달라서, 지금 연주자에게 어렵다고 당시에 불가능했던 건 아니다. 당시 악기 복원품으로 시험해야 정확하다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_can_rehearse", "S_tacit_sense"]

