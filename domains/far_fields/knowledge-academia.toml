# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 출토 유물 해석(고고학) (학문)
[[hypothesis]]
id = "H_acad3_01_01"
text = "읽어 내는 일이 대상을 망가뜨리는 경우에는, 손대기 전에 대상이 놓인 관계부터 남겨 둔다. 관계는 한 번 흐트러지면 대상만 남아도 되살릴 수 없다."
source = "AI 생성(Opus 5.5, Claude Code 서브에이전트) 3차 2026-11-04, 출처 없음(모델 지식), 검토 없음"
field = "출토 유물 해석(고고학)"
group = "학문"
rule = "유물을 들어 올리기 전에 제자리에서 사진·도면·높이를 먼저 남겨라. 꺼낸 순간 그 물건이 어느 층, 무엇 옆에 있었는지는 다시 알 수 없다."
why = "발굴은 땅속 맥락을 파괴하면서 읽는 작업이라, 유물의 뜻 대부분은 물건 자체보다 놓인 자리(맥락)에서 나온다."
breaks = "도굴 직전이나 물이 차오르는 등 당장 꺼내지 않으면 유물 자체가 사라질 때는 기록을 줄이고 수습부터 한다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
conditions = ["S_irreversible", "S_order_matters"]

[[hypothesis]]
