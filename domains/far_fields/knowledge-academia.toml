why = "문화층 경계는 흙의 색·단단함·섞인 것으로만 드러나고, 크게 파면 경계 위아래 유물이 한 덩어리로 섞인다."
breaks = "근대 교란층이나 메운 흙처럼 해석 가치가 없다고 확인된 층은 기계로 빨리 걷어 내는 것이 맞다."
confidence = "높음"
test_plan = "검토하지 않은 AI 생성분(사용자 2026-11-03: 구조만 정확하면 나중에 하나씩 고친다). 쓰거나 연결에 뽑힐 때 판정을 붙이고, 그 분야를 실제로 하게 되면 사용자 실사용으로 판정한다"
