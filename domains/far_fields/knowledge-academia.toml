[[hypothesis]]
id = "H_acad3_44_06"
text = "종이 위에서 만든 재구성은 실제로 몸과 도구로 해 봐야 걸러진다. 해 볼 수 없는 재구성은 대개 틀렸다. 다만 오늘의 몸이 그때의 몸과 같다고 가정하지는 않는다."
