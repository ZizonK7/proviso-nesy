group = "공예·섬유"
rule = "날실을 날 때 생긴 사침(실이 X자로 엇갈려 순서를 잡아 주는 교차점)은 베틀에 다 올릴 때까지 절대 풀지 마라. 끈으로 몇 군데 단단히 묶어 두고 옮겨라."
why = "수백 가닥의 순서 정보가 그 교차점 하나에만 담겨 있다. 한번 흩어지면 엉킨 실을 다시 순서대로 가를 방법이 거의 없다."
breaks = "가닥 수가 아주 적거나, 구역별로 나눠 감는 방식처럼 다른 장치가 순서를 붙잡아 주는 경우에는 덜 중요하다."
confidence = "높음"
conditions = ["S_order_matters", "S_handoff", "S_irreversible"]

