text = "되살릴 수 없는 자연스러운 끝부분이 성능을 정할 때는, 길이나 모양을 맞추는 손질을 그 반대편에서 한다. 고칠 수 있는 쪽을 깎아 고칠 수 없는 쪽을 지킨다."
