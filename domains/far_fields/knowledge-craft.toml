field = "붓 만들기"
group = "공예·섬유"
rule = "털 길이를 맞출 때 끝을 가위로 자르면 안 된다. 털끝의 투명하고 가는 부분(봉, 鋒)은 한 번 잘리면 다시 안 생기니, 끝을 가지런히 모은 뒤 뿌리 쪽을 잘라 길이를 맞춘다."
why = "자연 그대로의 가는 끝이 먹을 머금었다가 한 점으로 모여 획의 날카로움을 만든다. 잘린 끝은 뭉툭해서 갈라진다."
breaks = "끝이 모이지 않아도 되는 넓은 칠붓이나 일부러 거친 획을 내는 붓은 끝을 다듬어도 된다."
confidence = "높음"
