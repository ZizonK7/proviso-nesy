id = "H_craft2_19_01"
text = "조건 하나만 바뀌어도 알맞은 값이 달라지는 처리는 감으로 정하지 말고 값을 단계별로 나눠 한 번에 시험해 찾는다. 조건이 바뀌면 그 값도 다시 찾는다."
