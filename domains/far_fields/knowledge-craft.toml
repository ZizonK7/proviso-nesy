field = "실크스크린 인쇄"
group = "공예·섬유"
rule = "노광(빛을 쬐어 감광액에 판을 굳히는 일) 시간은 감으로 정하지 말고 처음에 시간별로 칸을 나눠 쬔 시험판을 만들어 찾아라. 같은 전구라도 거리와 감광액 두께가 바뀌면 시간이 달라진다."
