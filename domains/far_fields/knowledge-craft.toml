source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "석조 조각"
group = "공예·섬유"
rule = "작업 전에 돌을 망치로 두루 톡톡 쳐 보고 물을 뿌려 본다. 맑게 '땡' 울리지 않고 '퍽' 둔하게 들리는 곳이나, 물이 마르면서 한 줄만 늦게 마르는 선이 보이면 속에 금(균열)이 있다는 신호다."
why = "속 금은 진동이 퍼지는 길을 끊고, 물은 틈에 스며 오래 남는다. 그래서 겉으로 안 보이는 결함이 소리와 물자국으로 드러난다."
breaks = "이미 얇게 다듬은 부분은 원래 소리가 둔하고, 무른 사암 같은 돌은 통째로 둔하게 울린다. 결이 원래 줄무늬인 돌은 물자국도 헷갈리므로 소리나 물만으로 판단하면 틀린다."
confidence = "높음"
conditions = ["S_hidden_state", "S_instrument_doubt", "S_material_varies"]

