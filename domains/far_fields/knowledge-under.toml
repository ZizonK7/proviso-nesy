group = "지하·광물"
rule = "위쪽 자갈에서 금 몇 알 나왔다고 좋아하지 말고 암반(바닥 바위)까지 파라. 암반 틈을 숟가락이나 드라이버로 긁어낸 흙 한 줌이 위 자갈 한 양동이보다 낫다. 단단한 점토층이 나오면 그게 가짜 암반 노릇을 해서 그 위에 금이 모이기도 한다."
why = "큰물 때 자갈 전체가 뒤섞이며 움직이면 무거운 금은 계속 아래로 파고들다가 더 내려갈 수 없는 층에서 멈춘다."
breaks = "매끈한 암반은 금을 잘 잡지 못해 틈 많은 바닥보다 훨씬 덜 모인다. 암반이 너무 깊으면 들인 힘에 비해 얻는 게 없다."
confidence = "높음"
conditions = ["S_hidden_state", "S_repetition", "S_fixed_budget"]

