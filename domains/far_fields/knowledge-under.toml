why = "아래 사람은 소리도 잘 안 들리고 스스로 나올 수도 없다. 밑바닥의 열기와 탁한 공기는 판단력을 모르는 사이에 떨어뜨린다."
breaks = "얕고 넓은 구덩이처럼 혼자 걸어 나올 수 있는 곳이면 이렇게까지 엄격할 필요는 없다. 하지만 깊어지는 순간 같은 규칙이 다시 필요해진다."
