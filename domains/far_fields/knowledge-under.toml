why = "땅속은 누구도 장담할 수 없다. 기대를 먼저 맞춰 두지 않으면 실패가 곧 신뢰를 잃는 일이 된다."
breaks = "동네 우물이 다 같은 깊이에서 확실히 물이 나오는 땅이라면 지나친 경고는 오히려 겁만 준다. 이럴 때는 확률을 있는 그대로 말하는 것으로 충분하다."
confidence = "중간"
conditions = ["S_trust_building", "S_hard_to_speak", "S_judged_by_others"]

# 탄광 채굴 (지하·광물)
[[hypothesis]]
id = "H_coal_mining_01"
text = "속이 안 보이는 대상은 살짝 자극을 줘서 돌아오는 반응의 결로 속을 짐작한다. 상태가 계속 변하는 곳에서는 그 확인이 그 순간에만 맞는다는 걸 전제로, 자주 다시 확인한다."
