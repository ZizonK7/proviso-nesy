why = "물이 들어오는 속도보다 빨리 빼면 수위가 계속 내려간다. 빠른 물살에 고운 흙이 끌려와 거름망을 막거나 펌프를 갉아 먹는다."
breaks = "잠깐 많이 쓰고 오래 쉬는 식이면 물탱크를 두고 큰 펌프를 짧게 돌리는 게 나을 수 있다. 반대로 해마다 수위가 조금씩 내려가는 지역이면 처음 정한 양도 점점 과해진다."
confidence = "높음"
conditions = ["S_fixed_budget", "S_slow_drift", "S_tool_wear"]

[[hypothesis]]
id = "H_well_digging_11"
text = "혼자서는 빠져나올 수 없는 곳에서 일하는 사람의 안전은 바깥에 있는 한 사람의 주의에 달려 있다. 그 사람을 자리에 묶어 두고, 말 없이도 통하는 신호를 미리 맞춰 둔다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
