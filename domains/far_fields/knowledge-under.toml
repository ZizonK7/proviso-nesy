# 먼 분야 경험 논리 — 묶음 '지하·광물'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 우물 파기 (지하·광물)
[[hypothesis]]
id = "H_well_digging_01"
text = "누가 보이지 않는 원인으로 쓰러졌을 때는 구하러 가는 사람도 그 원인 안으로 들어가는 것이다. 그러니 원인을 먼저 확인하거나 없애고 나서 들어간다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
group = "지하·광물"
rule = "아래에서 일하던 사람이 갑자기 말이 없거나 쓰러지면 절대 바로 따라 내려가지 마라. 우물 바닥 사고는 구하러 들어간 두 번째, 세 번째 사람까지 죽는 경우가 많다."
why = "바닥에 고인 나쁜 공기(산소가 모자라거나 이산화탄소 같은 무거운 가스가 찬 공기)는 눈에 안 보인다. 첫 사람을 쓰러뜨린 원인이 그대로 남아 있어서 들어가는 사람도 똑같이 당한다."
breaks = "쓰러진 원인이 공기가 아니라 낙석이나 미끄러짐처럼 눈에 보이는 것이고 바닥 공기가 괜찮다고 확인됐다면 사정이 다르다. 그래도 그 확인을 위에서 먼저 하는 게 순서다."
confidence = "높음"
conditions = ["S_rescuer_risk", "S_rare_fatal", "S_hidden_state"]

[[hypothesis]]
id = "H_well_digging_02"
text = "상태가 철마다 오르내리는 대상은 가장 나쁜 때에 기준을 맞춰야 한다. 좋은 때 맞춘 기준은 나쁜 때가 오면 무너진다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
group = "지하·광물"
rule = "우물은 가뭄 끝, 물이 제일 낮을 때 파라. 그때 물이 나오면 일 년 내내 나오고, 장마 뒤에 판 우물은 가을이면 말라 버린다."
why = "지하수 높이(지하수위)는 철마다 오르내린다. 가장 낮을 때 닿은 깊이라야 최악의 때에도 물이 남는다."
breaks = "물이 너무 낮을 때는 파는 도중 바닥에 물이 차서 일하기 힘든 곳도 있다. 일이 쉬운 때와 확실한 때가 다를 수 있다. 사계절 내내 수위가 거의 안 변하는 깊은 암반수는 계절을 덜 탄다."
confidence = "높음"
conditions = ["S_uncontrolled_env", "S_short_window", "S_delayed_feedback"]

[[hypothesis]]
id = "H_well_digging_03"
text = "속을 직접 볼 수 없는 대상은 근처에서 먼저 해 본 사람들의 결과를 모으는 게 가장 싼 탐사다. 다만 대상이 고르지 않을수록 그 결과를 옮겨 쓸 수 있는 거리는 짧아진다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
group = "지하·광물"
rule = "자리 볼 때 수맥봉보다 먼저 동네 우물들 깊이, 언제 마르는지, 물맛을 물어봐라. 옆집이 몇 미터에서 물 만났는지가 제일 믿을 만한 자료다."
why = "땅속은 직접 볼 수 없다. 근처에서 이미 파 본 결과가 같은 지층을 짐작하게 해 주는 가장 싼 정보다."
breaks = "바위 틈으로 물이 흐르는 땅(균열 암반)은 몇십 미터만 떨어져도 결과가 전혀 다르다. 옆집이 잘 됐다고 내 자리도 된다는 보장이 없다."
confidence = "높음"
conditions = ["S_others_passed", "S_hidden_state", "S_material_varies"]

[[hypothesis]]
id = "H_well_digging_04"
text = "버팀이 약한 구간을 만나면 앞으로 나아가기 전에 지금까지 온 것부터 굳혀야 한다. 굳히는 일을 뒤로 미룰수록 무너질 때 잃는 것이 커진다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
group = "지하·광물"
rule = "손으로 파는 우물에서 모래층이나 젖은 흙이 나오면 더 파지 말고 벽부터 막아라(관이나 링을 내려 벽을 받친다). 오늘 좀 더 파고 내일 막자는 생각이 무너지는 사고를 부른다."
why = "마른 흙은 한동안 버텨 주지만 젖은 모래는 예고 없이 흘러내린다. 깊이 판 뒤에 막으려 하면 이미 늦다."
breaks = "단단한 진흙이나 암반은 벽을 늦게 막아도 버티는 경우가 많다. 이런 데서는 처음부터 다 막는 게 오히려 시간만 쓴다."
confidence = "높음"
conditions = ["S_order_matters", "S_rare_fatal", "S_material_varies"]

[[hypothesis]]
id = "H_well_digging_05"
text = "직접 볼 수 없는 진행 과정에서는 손에 오는 작은 변화가 생기는 바로 그 순간을 기록해 둬야 한다. 나중에 기억에 기대면 가장 중요한 경계가 흐려진다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
group = "지하·광물"
rule = "기계로 뚫을 때는 올라오는 부스러기(굴진 시료)의 색과 촉감이 바뀌는 깊이, 그리고 뚫리는 속도가 갑자기 빨라지거나 느려지는 깊이를 바로바로 적어라. 나중에 관 넣을 자리와 물 받을 구간을 그 기록으로 정한다."
why = "구멍 속은 볼 수 없다. 손에 올라오는 부스러기와 기계에 전해지는 느낌이 지층을 알려 주는 거의 유일한 신호다."
breaks = "부스러기는 올라오는 동안 시간이 걸리고 위쪽 흙과 섞이기도 한다. 그래서 적힌 깊이가 실제보다 조금 어긋날 수 있다."
confidence = "높음"
conditions = ["S_blind_spot", "S_hidden_state", "S_tacit_sense"]

[[hypothesis]]
id = "H_well_digging_06"
text = "처음 쏟아지는 양은 쌓여 있던 몫일 수 있다. 지속해서 나오는 양을 알려면 쌓인 몫이 다 빠질 때까지 계속 꺼내 봐야 한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
group = "지하·광물"
rule = "물이 나왔다고 끝이 아니다. 몇 시간 이상 계속 퍼 올리면서 수위가 어디서 멈추는지 봐야(양수시험) 진짜 얼마나 나오는 우물인지 안다. 처음 콸콸 나오는 물에 속지 마라."
why = "처음 나오는 물은 구멍과 주변에 고여 있던 물이다. 땅이 계속 대 줄 수 있는 양은 오래 퍼야 드러난다."
breaks = "집에서 하루 몇 통만 쓰는 작은 우물이라면 짧게 확인해도 된다. 반대로 마을이나 농업용처럼 많이 쓸 우물은 더 오래 시험해야 한다."
confidence = "높음"
conditions = ["S_hidden_state", "S_delayed_feedback", "S_can_rehearse"]

[[hypothesis]]
id = "H_well_digging_07"
text = "막 만든 것의 첫 모습에는 만드는 과정의 찌꺼기가 섞여 있다. 찌꺼기를 걷어 낸 뒤에 성질을 판단해야 한다. 걷어 내도 계속 나오면 과정이 아니라 구조를 의심한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
group = "지하·광물"
rule = "새 우물 물은 처음에 흙탕물이다. 맑아질 때까지 퍼내고 흔들어 씻어 내는 일(우물 개발)을 다 마친 뒤에 물맛도 보고 수질 검사도 해라. 첫날 물 보고 실망하거나 안심하지 마라."
why = "뚫는 동안 생긴 가루와 진흙이 벽과 주변 틈을 막고 있다. 이것을 빼내야 물길이 열리고 원래 물이 나온다."
breaks = "며칠을 퍼내도 계속 모래가 나오면 개발 문제가 아니라 거름망(스크린) 크기나 시공이 잘못된 것이다. 이때는 더 퍼낼수록 손해다."
confidence = "중간"
conditions = ["S_delayed_feedback", "S_hidden_state", "S_order_matters"]

[[hypothesis]]
id = "H_well_digging_08"
text = "보이지 않게 천천히 번지는 오염원은 흐름의 위쪽에, 거리를 두고 피해야 한다. 처음에 깨끗하다는 것은 아직 닿지 않았다는 뜻일 뿐이다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "우물 파기"
group = "지하·광물"
rule = "화장실, 정화조, 가축우리보다 땅이 높은 쪽에 충분히 떨어뜨려 파라. 집주인이 마당 한가운데가 편하다고 해도 거름 구덩이 아래쪽이면 안 된다."
why = "오염은 땅속 물을 따라 낮은 쪽으로 천천히 번진다. 처음 몇 달은 물이 깨끗해 보여도 나중에 탈이 난다."
breaks = "깊은 암반까지 뚫고 윗부분을 단단히 막은 우물은 거리가 좀 가까워도 덜 위험할 수 있다. 땅이 평평하면 높낮이보다 물이 흐르는 방향을 따로 알아봐야 한다."
confidence = "높음"
conditions = ["S_hidden_state", "S_delayed_feedback", "S_goal_conflict"]

[[hypothesis]]
id = "H_well_digging_09"
text = "결과가 불확실한 일은 시작하기 전, 아직 들인 게 없어 머리가 맑을 때 멈출 지점을 정해 둔다. 멈출 지점을 넘을 때는 아까움이 아니라 새로 알게 된 사실을 이유로 삼는다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
