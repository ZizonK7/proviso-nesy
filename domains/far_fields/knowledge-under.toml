why = "이미 들인 돈이 아까워서 판단이 흐려진다. 또 너무 깊이 내려가면 짠물이나 쇳물만 나오는 층을 만나기도 한다."
breaks = "동네 자료로 물이 더 깊은 곳에 확실히 있다는 걸 안다면, 미리 정한 깊이를 넘어 가는 게 맞을 수도 있다. 다만 그건 새 정보가 있을 때 하는 결정이어야 한다."
confidence = "중간"
conditions = ["S_sunk_cost", "S_fixed_budget", "S_hidden_state"]

[[hypothesis]]
id = "H_well_digging_10"
text = "들어오는 속도보다 빨리 꺼내면 한동안은 더 얻는 것 같아도 바탕이 상한다. 꺼내는 속도는 시험해서 확인된 보충 속도보다 낮게 잡는다."
