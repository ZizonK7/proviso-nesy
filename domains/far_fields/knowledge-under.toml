text = "결과를 장담할 수 없는 일은 시작 전에 실패할 수 있다는 점과 그때의 비용을 상대와 나눠 둬야 한다. 같은 실패도 미리 말했으면 위험으로 받아들여지고, 나중에 말하면 변명으로 들린다."
