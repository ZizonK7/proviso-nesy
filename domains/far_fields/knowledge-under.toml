rule = "자유면(돌이 밀려 나갈 수 있는 열린 면)이 없으면 바위는 깨지지 않고 진동과 날아가는 돌로 힘이 샌다. 그래서 터널에서는 심빼기(가운데에 먼저 빈 공간을 뚫는 첫 발파)가 제대로 빠져야 나머지 구멍이 산다."
why = "바위는 눌리는 힘보다 당기는 힘에 약한데, 그 당김은 열린 면 쪽에서 반사되며 생긴다. 첫 공간이 막히면 뒤 구멍 모두 갇힌 채로 터진다."
