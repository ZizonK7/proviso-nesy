source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — Florida Bar Journal, \"Avoiding Pitfalls in Closing Arguments\" (2003), https://www.floridabar.org/the-florida-bar-journal/avoiding-pitfalls-in-closing-arguments/. 반복에 관한 파기 사례는 Hepler Broom·Hinshaw 기사"
