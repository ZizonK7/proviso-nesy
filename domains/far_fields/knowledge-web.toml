# 낙농 (젖소 사육·목장 운영) (웹 조사 10개 분야)
[[hypothesis]]
id = "H_haiku_dairy_01"
text = "정해진 날짜가 됐다고 다음 단계로 넘어가지 말고 실제 상태를 재서 정한다. 같은 시간이 지나도 대상마다 준비된 정도가 다르고, 눈대중은 자주 틀리기 때문이다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — Wisconsin Extension, Target Weight Age (https://dairy.extension.wisc.edu/files/2023/01/Target-Weight-Age_Dairy.pdf) / Teagasc 송아지 사육 관련 (https://teagasc.ie/?p=88195)"
field = "낙농 (젖소 사육·목장 운영)"
group = "웹 조사 10개 분야"
rule = "초산 암소는 나이보다 체중·체고로 교배 시기를 정한다 초산 교배는 \"22~24개월\"이라는 달력보다 체중 테이프와 체고를 보고 결정한다."
why = "나이가 같아도 성장 상태에 따라 준비도가 크게 다르다."
breaks = "사료가 부족해 체중이 덜 나간 어린 개체, 체고가 작은 개체는 나이 기준을 넘겨도 교배를 미뤄야 한다. 위스콘신 자료는 농장주가 체중을 추정할 때 81%가 틀렸다고 보고했다. 송아지 사육을 잘 했다면 더 어린 나이에 분만해도 유리하다는 주장도 있다."
confidence = "중간"
general_original = "달력 기준은 실제 상태 측정과 짝을 이룰 때만 쓸모가 있다."
conditions = ["S_material_varies", "S_instrument_doubt", "S_irreversible"]

[[hypothesis]]
id = "H_haiku_dairy_02"
text = "목표 범위가 있는 상태는 넘쳐도 모자라도 실패다. 한쪽만 줄이려다 반대쪽으로 넘어가지 않도록 범위 안에 묶어 두고, 결과가 늦게 드러나니 중간에 자주 잰다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — University of Maryland Extension, Body Condition Scoring (https://extension.umd.edu/resource/body-condition-scoring-important-dairy-cattle-too) / Penn State Extension, Body condition in transition cows (https://extension.psu.edu/body-condition-in-transition-cows)"
field = "낙농 (젖소 사육·목장 운영)"
group = "웹 조사 10개 분야"
rule = "건유 들어갈 때 살을 찌우지 않는다 건유 진입 시 BCS는 3.0~3.25 근처로 맞추고, 건유기 동안 그 수준을 유지한다."
why = "과비 상태로 분만하면 제왕절개·케토시스·자궁 질환 위험이 올라간다."
breaks = "건유기에 살이 빠지는 것도 자궁 질환과 소화 장애를 늘린다. 즉 \"덜 먹이기\"만 목표로 하면 반대쪽 실패가 생긴다. 과거 기준(3.5)과 최근 기준이 다르다."
confidence = "높음"
general_original = "목표 상태를 정하되, 떨어뜨리는 것도 실패라는 점을 함께 본다."
conditions = ["S_two_sided", "S_slow_drift", "S_delayed_feedback"]

[[hypothesis]]
id = "H_haiku_dairy_03"
text = "효과가 짧은 때에만 생기고 그 뒤로는 되돌릴 수 없다면, 저절로 되기를 기다리지 말고 직접 챙겨 넣는다. 저절로 잘 되는 경우가 생각보다 적기 때문이다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — University of Kentucky, Colostrum Management for Dairy Calves (https://afs.mgcafe.uky.edu/dairy/colostrum-management-dairy-calves) / Feed & Additive Magazine, Feb 2026 (https://www.feedandadditive.com/digital-magazines/Issue61_February2026/41/)"
field = "낙농 (젖소 사육·목장 운영)"
group = "웹 조사 10개 분야"
rule = "송아지 초유는 생후 1~2시간 안에 4리터 가까이 직접 먹인다 초유는 태어난 직후 1~2시간 안에, 최소 4L(약 1갤런) 먹이고, 늦어도 6시간 안에 먹인다."
why = "면역글로불린 흡수율은 생후 2시간 무렵 가장 높고, 20시간이 지나면 거의 없어진다."
breaks = "초유 품질(IgG 농도)이 낮으면 양을 늘려도 효과가 제한된다. 체중 대비 10%를 기준으로 하는 자료(뉴질랜드)도 있다. 최근 연구에서 46~61%의 송아지가 6시간 안에 스스로 빨지 못한다고 보고됐다. 그래서 자연 흡입을 기다리지 말고 직접 먹이라는 권고가 나온다."
confidence = "높음"
general_original = "시간이 제한된 흡수 창이 있으면 자연 과정에 맡기지 말고 직접 밀어 넣는다."
conditions = ["S_short_window", "S_irreversible", "S_hidden_state"]

