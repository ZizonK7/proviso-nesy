confidence = "중간"
general_original = "변형된 원재료는 먼저 기준면을 만들고, 그 기준에서 나머지를 맞춘다. 단, 기준면이 신뢰할 수 있는지부터 확인한다."
conditions = ["S_order_matters", "S_material_varies"]

[[hypothesis]]
id = "H_haiku_woodworking_03"
text = "날 근처에서 재료가 끼거나 튕길 수 있으면 끼임을 막는 장치를 늘 달아 두고, 손은 위험 지점에서 떨어뜨려 보조 수단으로 민다. 안전장치가 불편하면 사람들이 떼어 내므로, 불편함 자체를 줄이는 것도 관리해야 한다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — Fine Woodworking Table-Saw Kickback: Why It Happens… (2024) — 기사 [열람] (본문 열람, 끝부분만 유료); CPSC 테이블쏘 보고서 — 사고보고서 [검색요약]; ToolGuyd 요약 — 기타 [검색요약]"
field = "목공 (가구 제작·목재 다루기)"
group = "웹 조사 10개 분야"
rule = "도구 · 테이블쏘 킥백 테이블쏘에서는 리빙나이프(riving knife)를 쓰고, 폭이 좁은 재는 밀대(push stick)로 민다. 펜스에 재를 붙여 짧은 끝을 잘라 내지 않는다."
why = "재가 펜스에서 벗어나 날의 뒷 이빨에 걸리면 되튕겨 나온다. 리빙나이프는 이 걸림을 줄이는 장치다."
breaks = "휘거나 응력이 남은 재를 세로로 중간 쪼개기 하면 틈이 좁아져 날을 집는다. 리빙나이프가 있어도 짧은 조각을 펜스 쪽에 붙여 자르면 위험하다. 리빙나이프와 덮개를 같이 달면 절단 조작이 불편해져 덮개를 떼는 쪽으로 바뀌기 쉽다. 미국 CPSC의 오래된 조사(2011년 전후)에서는 사고 사례 대다수에서 가드가 없었다. 수치는 낡았으니 참고만 한다."
confidence = "높음"
general_original = "되돌림을 막는 장치는 쓰고, 작은 조각을 손으로 밀지 않도록 밀대나 치구로 대신한다. 고정 장치가 불편해서 제거하는 경향을 따로 관리한다."
conditions = ["S_rare_fatal", "S_rule_on_paper", "S_material_varies"]

