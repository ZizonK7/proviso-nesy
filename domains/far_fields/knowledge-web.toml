conditions = ["S_sunk_cost", "S_slow_drift", "S_goal_conflict"]

# 소송 변론 (법정 변론·증인 신문·배심원 설득) (웹 조사 10개 분야)
[[hypothesis]]
id = "H_haiku_trial_advocacy_01"
text = "나와 맞서는 상대에게는 마음껏 설명할 수 있는 열린 질문을 피한다. 한번 나온 설명은 내게 불리해도 거둬들일 수 없기 때문이다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — Nat'l Law Review, James M. Strong, 2024, https://www.natlawreview.com/article/trial-cross-examination-techniques-when-and-when-not-ask-why (기사)"
field = "소송 변론 (법정 변론·증인 신문·배심원 설득)"
group = "웹 조사 10개 분야"
rule = "반대신문에서 \"왜(why)\" 질문은 하지 않는다"
why = "열린 질문은 증인에게 설명할 기회를 주고, 그 설명이 내 쪽에 불리할 수 있다."
breaks = "증인의 설명이 이미 알려져 있거나 설명 여부가 결과를 바꾸지 않을 때. 경험 많은 변호사가 답이 어느 쪽이든 쓸 수 있다고 판단할 때. 저자도 \"규칙은 깨뜨리라고 있을 때도 있다\"고 적고 있다."
confidence = "높음"
general_original = "상대에게 설명할 자리를 주는 질문은 하지 않는다."
conditions = ["S_opponent", "S_irreversible"]

[[hypothesis]]
id = "H_haiku_trial_advocacy_02"
text = "상대가 어떻게 답할지 모르는 질문은 맞서는 자리에서 던지지 않는다. 예상 밖의 답은 판단하는 사람이 이미 들어 버려 되돌릴 수 없기 때문이다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — 여러 실무 글 (Oginski Law FAQ 등, https://www.oginski-law.com/faqs/on-cross-examination-at-trial-why-don-t-you-ask-a-question-if-you-don-t-know-the-answer-to-it-.cfm)"
field = "소송 변론 (법정 변론·증인 신문·배심원 설득)"
group = "웹 조사 10개 분야"
rule = "답을 모르는 질문은 하지 않는다"
why = "예상과 다른 답이 나오면 증인이 내 주장을 뒤집는 설명을 하게 된다."
breaks = "답이 어느 쪽이든 내게 유리할 때, 답이 쟁점과 무관할 때, 배심과 양측이 모두 답을 아는 질문일 때. 소수 경험자에게만 허용되는 예외라는 주장도 있다."
confidence = "높음"
general_original = "통제되지 않은 답을 받는 질문은 하지 않는다."
conditions = ["S_opponent", "S_hidden_state", "S_irreversible"]

[[hypothesis]]
id = "H_haiku_trial_advocacy_03"
text = "상대에게서 필요한 것을 얻었으면 더 밀지 말고 멈춘다. 더 물으면 상대가 빠져나갈 설명을 붙일 기회가 생기고, 결론은 내가 나중에 직접 말하면 된다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — Holland & Knight, Dan Small 팟캐스트 2024 (Irving Younger의 \"Ten Commandments\" 9번째 계명 언급) https://www.hklaw.com/en/insights/media-entities/2024/08/podcast-cross-examination-dont-ask-one-question-too-many"
field = "소송 변론 (법정 변론·증인 신문·배심원 설득)"
group = "웹 조사 10개 분야"
rule = "반대신문은 더 묻지 말고 얻은 것에서 멈춘다"
why = "이미 확보한 답을 더 밀면 증인이 방어할 기회를 얻어 실익이 줄어든다."
breaks = "최종변론에 필요한 마지막 확정 질문이 남아 있을 때는 한 번 더 묻는 편이 낫다."
confidence = "중간"
general_original = "얻은 것을 확인했으면 거기서 그친다."
conditions = ["S_opponent", "S_irreversible"]

[[hypothesis]]
id = "H_haiku_trial_advocacy_04"
text = "질문 하나를 던지기 전에 그 답이 마지막 결론에 쓰일 재료인지 확인한다. 쓸 데 없는 질문은 시간과 주의만 쓰고, 상대에게 틈을 준다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — Dan Small의 시험 기준을 인용한 NC Bar 기사, https://www.ncbar.gov/for-lawyers/bar-programs/legal-assistance-for-military-personnel-lamp/general-military-law-articles-silent-partners/the-commandments-of-cross-examination-a-bakers-dozen/"
field = "소송 변론 (법정 변론·증인 신문·배심원 설득)"
group = "웹 조사 10개 분야"
rule = "반대신문 질문은 최종변론에 쓸 재료인지 먼저 따져본다"
why = "반대신문의 목적은 최종변론에서 쓸 \"재료\"를 얻는 것이다. 답이 최종변론에 쓰이지 않으면 질문할 이유가 약하다."
breaks = "증거보전이나 탄핵처럼 최종변론과 무관하게 필요한 질문이 있을 때. 반대신문을 아예 하지 않는 편이 나을 때도 있다."
confidence = "중간"
general_original = "질문 하나를 던지기 전에 그 답이 최종 결론에 쓰이는지 확인한다."
conditions = ["S_fixed_budget", "S_opponent", "S_order_matters"]

[[hypothesis]]
id = "H_haiku_trial_advocacy_05"
text = "상대 말을 공격하기 전에 가진 기록과 다른 사람들의 말을 미리 맞대어 어긋나는 곳을 찾아 둔다. 그 자리에서는 모순을 찾을 시간이 없고, 미리 준비한 대조만 힘을 쓴다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — 법률사무소 라톡 황재동 변호사 글, https://www.lawtalk.co.kr/posts/109390 (실무 칼럼, 상담 유도 성격 있음)"
field = "소송 변론 (법정 변론·증인 신문·배심원 설득)"
group = "웹 조사 10개 분야"
rule = "반대신문 전에는 증인의 기존 진술과 다른 참고인 진술을 미리 대조해 둔다"
why = "증인은 이해관계 있는 쪽에 유리하게 말하는 경우가 많아, 기존 자료와 대조해야 모순을 짚을 수 있다."
breaks = "증거개시가 부족해 자료가 없을 때. 자료가 많으면 대조 준비에 시간이 많이 들어 현장에서 우선순위를 정해야 할 때."
confidence = "중간"
general_original = "상대방 진술을 공격하기 전에 내가 가진 기록과 다른 진술을 먼저 맞춰 본다."
conditions = ["S_can_rehearse", "S_opponent", "S_fixed_budget"]

[[hypothesis]]
id = "H_haiku_trial_advocacy_06"
text = "판단하는 사람 앞에서는 상대의 흠을 자주 짚지 말고, 꼭 필요한 때만 골라 짧게 짚는다. 잦은 지적은 내 신뢰를 깎지만, 아예 안 짚으면 나중에 다툴 권리를 잃는다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — ABA Journal, \"Judge doesn't like your objections\" (2026), https://www.abajournal.com/magazine/article/judge-doesnt-like-your-objections-here-are-some-tips-to-keep-them-coming-in-a-meaningful-way"
field = "소송 변론 (법정 변론·증인 신문·배심원 설득)"
group = "웹 조사 10개 분야"
rule = "배심 앞에서 이의는 줄이고, 요란한 이의는 하지 않는다"
why = "잦은 이의는 배심원이 싫어하고, 변호인의 신뢰를 떨어뜨린다. 말하는 이의(speaking objection)가 특히 문제다."
breaks = "기록 보존을 위해 이의를 해야 할 때. 상대의 발언이 배심에 되돌릴 수 없는 편견을 주는 때. 이의를 할 가치가 있는지 따져보는 것이 핵심이다."
confidence = "중간"
general_original = "상대의 흠을 지적하는 횟수보다, 지적할 때를 골라 간결하게 하는 편이 낫다."
conditions = ["S_judged_by_others", "S_two_sided"]

[[hypothesis]]
id = "H_haiku_trial_advocacy_07"
text = "남 앞에서 말할 사람에게 할 말을 외우게 하지 말고, 자기 기억을 꺼내 말하는 연습을 시킨다. 외운 말은 티가 나서 듣는 사람이 믿지 않는다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — Koeltl, \"Preparing Witnesses\" 요약, https://ojp.gov/ncjrs/virtual-library/abstracts/preparing-witnesses-litigation-manual-p-466-476-1989-john-g-koeltl (교범 요약) 및 컨설턴트 글 다수"
field = "소송 변론 (법정 변론·증인 신문·배심원 설득)"
group = "웹 조사 10개 분야"
rule = "증인에게 답을 외우게 하지 말고, 떠올리는 연습을 시킨다"
