why = "중성선이 끊기면 두 상의 부하가 직렬로 묶여서 한쪽은 과전압, 다른 쪽은 저전압이 걸린다."
breaks = "단선 영향이 작은 회로나 부하가 한쪽으로 치우친 회로에서는 증상이 애매해서 구분하기 어렵다. 실제 사례로 한 포럼 글쓴이는 조명이 어둡다는 전화를 받고 가보니 피더 중성선이 끊겨 한 다리에 약 240V가 걸려 있었고, 탄 냄새가 났다고 기록했다."
