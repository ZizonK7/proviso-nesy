source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — ABA GPSolo, \"Tips Using Demonstrative Evidence at Trial\" (2023), https://www.americanbar.org/groups/gpsolo/resources/ereport/2023-july/tips-using-demonstrative-evidence-trial 및 Holland & Knight 자료"
