conditions = ["S_hard_to_speak", "S_sunk_cost", "S_cascade"]

[[hypothesis]]
id = "H_haiku_surgery_09"
text = "지친 정도를 '전에 무엇을 했나'로만 판단하면 실제로 얼마나 쉬었는지가 가려진다. 그래서 이력보다 실제로 쉰 시간처럼 상태에 더 가까운 신호로 본다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — PSNet, Vinden et al. JAMA 2013 요약 (psnet.ahrq.gov), 논문 요약, 열람. Harvard 수면·합병증 연구 (HealthDay/ABC 기사), 기사, 요약만."
field = "외과 수술 (수술실 운영·외과의 판단)"
group = "웹 조사 10개 분야"
rule = "수면이 부족한 외과의는 위험하지만, 야간 근무 다음 날 수술이 무조건 위험하지는 않다"
why = "피로는 판단과 손 기술을 떨어뜨린다고 알려져 있다."
breaks = "온타리오 인구 기반 연구(JAMA 2013)는 전날 밤 응급 수술을 한 외과의의 다음날 담낭절제 합병증이 더 많지 않다고 보고했다. 전공의 근무 시간 제한도 결과에 영향이 없었다. 반대로 하버드 연구(요약 기사)에서는 수면이 6시간 이하인 경우 합병증이 6.2%, 그 이상은 3.4%였다. 즉 \"야간 근무 후\"보다 \"수면 시간\"이 신호에 가깝다. 대부분 관찰 연구다."
confidence = "낮음"
general_original = "피로를 근무 이력으로 판단하지 말고 실제 상태 지표(수면 시간 등)로 본다."
conditions = ["S_fatigue", "S_hidden_state", "S_instrument_doubt"]

[[hypothesis]]
id = "H_haiku_surgery_10"
text = "익숙하고 확실하다고 느낄수록 처음 세운 짐작을 다시 보지 않게 되니, 되돌릴 수 없는 단계 앞에서는 확신이 들 때도 '이게 아니라면 무엇이 보여야 하나'를 한 번 따져 본다. 되돌릴 수 있는 일이라면 이 확인은 줄여도 된다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — Aylmore et al., Ann Surg 2025 체계적 고찰 (PMC12594140), 논문 고찰, 열람."
field = "외과 수술 (수술실 운영·외과의 판단)"
group = "웹 조사 10개 분야"
rule = "익숙한 상황일수록 재확인을 생략한다 (확신 편향)"
why = "한 번 세운 가설을 계속 붙드는 편향(앵커링, 과신)이 수술 중에도 작동한다."
breaks = "2025년 체계적 문헌 고찰(21개 연구, 편향 38종)은 앵커링과 과신이 치명적 결과와 가장 많이 연결된다고 했다. 다만 근거 수준은 낮다. 연구의 52%가 검증되지 않은 설문이나 가상 사례였고, 실제 사례를 분석한 것은 3개뿐이었다. 또 디바이어싱 훈련의 효과는 2개 연구에서만 보고되었다. 익숙한 판단이 실제로 맞을 때는 재확인이 낭비다."
confidence = "중간"
general_original = "판단이 가장 확실하다고 느낄 때 확인 절차를 한 번 더 넣는다."
conditions = ["S_routine", "S_hidden_state", "S_irreversible"]

[[hypothesis]]
id = "H_haiku_surgery_11"
text = "위기 상황에서는 완성도 대신 \"지금 죽지 않게 하는 것\"을 먼저 하고, 되돌아올 시점을 미리 정한다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — 손상 조절 수술 교범 (Springer 장, 발췌만 확인), 교범, 요약만. 골반 패킹 참고 자료, 교범, 요약만."
field = "외과 수술 (수술실 운영·외과의 판단)"
group = "웹 조사 10개 분야"
rule = "손상 조절 수술에서는 출혈과 오염부터 잡고 짧게 끝낸 뒤 24~48시간 내 재수술한다"
why = "외상 환자가 불안정할 때는 완전한 수술보다 생존을 먼저 잡는 것이 우선이다."
breaks = "골반 패킹은 재수술이 24~48시간 안에 필요하고, 패드 제거 시 재출혈이 생길 수 있다. 혈관 손상은 초기 수술에서 지혈해야 한다는 지침이 있다. 다만 혈역학이 안정된 환자에게 이 방식을 쓰면 과잉이다. 패드 수가 부족하거나 잘못된 위치에 있으면 재수술 때 결과가 나빠졌다는 보고도 있다."
confidence = "중간"
conditions = ["S_time_pressure", "S_goal_conflict", "S_order_matters"]

[[hypothesis]]
id = "H_haiku_surgery_12"
text = "진전 없이 오래 붙들수록 이미 들인 시간이 아까워 멈추기 어려워지고 위험은 쌓이니, 근거가 약하더라도 '이만큼 해도 안 되면 방법을 바꾼다'는 시점을 미리 정해 둔다. 그 시점은 판단을 다시 하게 만드는 신호로 쓰고 기계적인 정답으로 믿지는 않는다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — Pisa 후향 연구 (arpi.unipi.it/handle/11568/872274, annaliitalianidichirurgia.it/…/1220), 논문, 요약만."
field = "외과 수술 (수술실 운영·외과의 판단)"
group = "웹 조사 10개 분야"
