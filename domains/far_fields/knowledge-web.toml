# 목공 (가구 제작·목재 다루기) (웹 조사 10개 분야)
[[hypothesis]]
id = "H_haiku_woodworking_01"
text = "한 방향으로만 크게 늘고 주는 재료는 그 방향을 꽉 묶지 말고 움직일 여유를 둔다. 막아 두면 힘이 쌓여 갈라지고, 폭이 넓을수록 움직임도 커진다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — finewoodworking.com 포럼·기사 Fastening tabletops, 5 tips for gluing up a panel (Woodsmith), LumberJocks 포럼 — 커뮤니티 + 기사"
field = "목공 (가구 제작·목재 다루기)"
group = "웹 조사 10개 분야"
rule = "판단 · 목재 결 방향 상판처럼 넓은 판을 만들 때는 긴 방향 결을 길이 축에 맞추고, 폭 방향 수축·팽창은 고정하지 않고 여유를 준다."
why = "목재는 주로 폭(횡단) 방향으로 수축·팽창하고 길이 방향 변화는 거의 무시할 만하다. 그래서 폭을 여러 개로 나눠 붙이면 이동량이 누적된다."
breaks = "긴 판을 레일에 폭 방향으로 강하게 접착·고정하면 갈라진다. 결이 한쪽은 플랫사, 다른 쪽은 쿼터사이면 판 사이에 단차가 생긴다. 결 방향(연륜 교대 배열)은 의견이 갈린다. 한 쪽은 교대 배열을 권하고, 다른 쪽은 잘 받쳐 주면 같은 방향이 낫다고 본다."
confidence = "중간"
general_original = "수축이 큰 방향을 고정하지 말고 여유를 두어라. 넓은 면일수록 누적 변화를 계산에 넣어라."
conditions = ["S_uncontrolled_env", "S_delayed_feedback", "S_scale_change"]

[[hypothesis]]
id = "H_haiku_woodworking_02"
text = "휘거나 틀어진 재료는 먼저 믿을 만한 기준면 하나를 만들고, 나머지 면은 모두 그 기준에서 잰다. 기준이 틀리면 뒤따르는 모든 면이 같이 틀어진다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — Woodcraft How to Mill Rough Lumber, Fine Woodworking 포럼 proper milling sequence, sawmillcreek 스레드 — 커뮤니티·교범성 기사"
field = "목공 (가구 제작·목재 다루기)"
group = "웹 조사 10개 분야"
rule = "순서 · 가공 순서 두꺼운 원목은 한 면을 먼저 평평하게 깎아 기준면으로 삼고, 그 기준으로 다른 면과 모서리를 맞춘다. 보통 \"한 면 → 한 모서리 → 반대면(planer) → 반대 모서리(테이블쏘)\" 순서로 한다."
why = "기준면이 있어야 나머지 면이 평행·직각으로 나온다."
