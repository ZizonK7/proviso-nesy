why = "오래 붙드는 동안 시야가 나오지 않으면 합병증 위험이 올라간다."
breaks = "피사 대학의 후향 연구(긴급 복강경 1,161건)에서 2시간 넘게 복강경을 하다 전환한 환자는 중증 합병증(Clavien-Dindo III–V)이 더 많았다. 다만 사망률과 입원 기간은 차이가 없었다. 2시간이라는 기준은 근거가 부족해서 임의로 정한 것이다. 전환 환자 표본이 19명으로 작았다."
confidence = "낮음"
