source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — Neily et al., VHA 수술 사고 분석 (PMC6324368), 논문, 열람. Clarke et al., \"Getting Surgery Right\" 펜실베이니아 보고 (PMC1959354), 사고 보고, 열람. Freundlich et al., Vanderbilt 시간외 관찰 (PMC6813865), 논문, 열람."
field = "외과 수술 (수술실 운영·외과의 판단)"
group = "웹 조사 10개 분야"
rule = "수술 시작(절개) 직전에는 반드시 시간외(time-out) 확인을 한다"
why = "좌우·부위 착오는 확인 절차가 빠지거나 대충 넘어갈 때 생긴다. 확인 자체는 짧아서 1분 남짓이다."
breaks = "응급 수술은 제외되거나 축약된다(Vanderbilt 관찰 연구는 레벨 1 응급에 3문항짜리 축약판을 쓴다고 기술). 펜실베이니아 보고에서는 착오 보고 427건 중 298건(70%)이 좌우 착오였고, 확인 절차 실패가 환자에게 닿은 보고의 34%에 관여했다. 베테랑 보고서(VA)에서도 시간외 문제가 최다 근본 원인(28.4%)이었다. 반면 Vanderbilt 관찰에서 실제 시간외는 평균 60.8초였다. 외과의들이 \"시간이 없어서\"를 가장 많이 든다는 점과 어긋난다."
