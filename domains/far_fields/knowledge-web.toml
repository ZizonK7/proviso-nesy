# 먼 분야 경험 논리 — 묶음 '웹 조사 10개 분야'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 항공 조종 (조종사 판단·비행 안전) (웹 조사 10개 분야)
[[hypothesis]]
id = "H_haiku_aviation_01"
text = "끝에 가까울수록 바로잡을 여유가 사라지므로, 마지막 결정 시점 전에 합격 기준을 정해 두고, 그 시점에 기준을 못 맞추면 고치려 애쓰지 말고 바로 처음부터 다시 시도한다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — Code 7700 \"American Airlines 1420\" 사례 연구 https://code7700.com/case_study_american_airlines_1420.htm (사고 조사 기반 분석) [열람]. Flying \"FSF's Recommended Elements of a Stabilized Approach\" https://www.flyingmag.com/fsfs-recommended-elements-of-a-stabilized-approach/ (기사) [열람, 일부만]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "안정 접근 게이트: 1000ft(IMC)/500ft(VMC) 아래에서 불안정하면 즉시 복행한다"
why = "접지 직전에 속도·강하율·형상이 틀어지면 회복할 고도가 없다."
breaks = "운항규정(SOP)이 별도로 허용하는 절차(ILS 등 특수 절차 추가 기준), 회전 접근(선회 접근)은 기준이 다르다. 개인 한계 안에서 게이트 직전에 미세 조정으로 안정을 되찾는 것을 허용하는 견해도 있다(Flying \"Are You Ever Stable?\" 요약, 유료벽 전 확인 불가). 그러나 측면·수직 유도가 흔들리면 허용되지 않는다."
confidence = "높음"
general_original = "마지막 결정 시점 전에 기준을 정해 두고, 그 기준을 넘으면 기다리지 않고 다시 시도한다."
conditions = ["S_irreversible", "S_short_window", "S_goal_conflict"]

[[hypothesis]]
id = "H_haiku_aviation_02"
text = "목표에 가까워질수록 \"그만두기\"의 비용이 커 보이는 착각을 경계하고, 중단 기준을 목표에 도달하기 전에 정한다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — Code 7700 AA1420 사례 [열람]. General Aviation News \"Get-home-itis proves fatal\"(2012) https://generalaviationnews.com/2012/09/20/get-home-itis-proves-fatal [차단: HTTP 403]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "목적지 집착(get-there-itis): 피로하거나 목적지가 가까울수록 \"고쳐서 다시 해라\"를 따른다"
why = "목적지를 향한 임무 본능이 판단을 밀어붙이고, 피로가 이를 더 키운다."
breaks = "이 경험칙은 \"가지 않는 것이 항상 안전하다\"는 뜻이 아니다. 날씨가 나빠지는 중이면 중단 자체가 위험할 수 있다. 착륙 실패 후 복행이 더 위험한 상황도 있다."
confidence = "높음"
conditions = ["S_sunk_cost", "S_fatigue", "S_goal_conflict"]

[[hypothesis]]
id = "H_haiku_aviation_03"
text = "남은 여유는 예상하지 못한 일에 예상보다 빨리 깎이므로, 규정의 최소치가 아니라 실제로 쓰는 속도를 기준으로 계산하고 돌아가는 데 드는 몫을 따로 얹어 둔다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — Backcountry Pilot 포럼 \"How close do you plan your fuel?\" https://backcountrypilot.org/forum/how-close-do-you-plan-your-fuel-10618 (커뮤니티, 1쪽만 확인) [열람]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "연료는 1시간 이하로 착륙하지 않는다(규정 최소 여유보다 크게 잡는다)"
why = "우회, 고도 상승, 고밀도 고도(높은 고도·고온) 조건에서 여유분이 예상보다 빨리 줄어든다."
breaks = "포럼 응답자들은 날씨 우회와 고밀도 고도 상승에서 20~45분을 쓴 경험을 말한다. 짧은 현지 비행에서는 더 적게 잡는 사람도 있다. 규정 최소치(VFR 30분, IFR 45분 수준)는 바닥일 뿐이다. 이 수치는 검색 요약 기준이고 원문을 열지 않았다."
confidence = "중간"
general_original = "여유 자원은 규정 최소치가 아니라 실제 소모율로 계산하고, 우회 비용을 따로 더해 둔다."
conditions = ["S_fixed_budget", "S_uncontrolled_env", "S_instrument_doubt"]

[[hypothesis]]
id = "H_haiku_aviation_04"
text = "평소 피하던 위험한 일을 해야 할 때는 여유가 얇아 한 번 어긋나면 되돌리기 어려우므로, 허용 조건을 미리 적어 두고 그중 하나라도 깨지면 바로 그만둔다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — AVweb \"Probable Cause #18: Greater of Evils\" https://avweb.com/features_old/probable-cause-18-greater-of-evils/ (원래 Aviation Safety 2004, 사고 분석 기사) [열람, 전문]. 포럼 논쟁은 Backcountry Pilot https://backcountrypilot.org/forum/scud-run-mountain-terrain-17095 [요약]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "스컷 러닝(낮은 구름 아래 지상 시야로 비행)은 \"합당한 운항상 이유\"가 있을 때만 한다"
why = "지형·장애물 충돌 위험이 크고, 계기 비행으로 전환하기에도 늦는다."
breaks = "포럼에서는 산악이 아닌 평지, 안정적이고 익숙한 날씨, 짧은 구간에서는 허용하는 견해가 있다. 반면 계기 비행 자격이 있는 조종사가 IFR을 피해 온 뒤 스컷 러닝으로 산에 부딪힌 사고도 있다."
confidence = "높음"
general_original = "평소에 피하던 위험 행동을 할 때는 허용 조건을 먼저 적고, 조건이 하나라도 깨지면 중단한다."
conditions = ["S_rare_fatal", "S_slow_drift", "S_uncontrolled_env"]

[[hypothesis]]
id = "H_haiku_aviation_05"
text = "몸의 감각이 틀린 방향을 가리키는데 스스로는 그걸 알아채기 어려운 상황에서는, 들어가기 전에 물러날 시점을 정해 두고 그 신호가 보이면 바로 돌아 나온다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — NTSB 사고 보고서 다수를 검색 요약으로 확인(NTSB CAROL 목록, 예: data.ntsb.gov 보고서 번호 193423 등) [요약]. 2020년 코비 브라이언트 헬기 사고 요약 https://avweb.com/?p=124854 [요약]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "VFR로 가다 구름/시정이 떨어지면 계기 비행 자격이 없으면 즉시 방향을 바꾼다. 자신을 계기 조종사처럼 여기지 않는다"
why = "공간감각 상실(공간 정위 상실)은 몇 초 만에 조작 능력을 잃게 만든다."
breaks = "계기 자격이 있는 조종사도 이 원칙을 따라야 하지만, 실제로 자격이 있는데도 \"나는 할 수 있다\"는 과신이 사고 원인으로 자주 지적된다."
confidence = "높음"
general_original = "전문성이 부족한 영역을 시작하는 순간을 미리 정해 두고, 그 전에 빠져나온다."
conditions = ["S_tacit_sense", "S_slow_drift", "S_irreversible"]

[[hypothesis]]
id = "H_haiku_aviation_06"
text = "압박과 감정 속에서는 즉석 판단이 흔들리므로, 중요한 결정의 기준은 차분할 때 미리 정해 두고 현장에서는 그 기준과 맞춰 보기만 한다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — 영문 칼럼 요약(개인 한계를 비행 전에 정하라는 내용) [요약]. FAA Risk Management Handbook(FAA-H-8083-2A) 안내 자료 https://www.ou.edu/content/dam/ags/aviation/documents/resources/faa-risk-management-handbook-2022.pdf [요약, PDF 열람 실패]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "조종사 판단 오류는 기술 부족보다 \"비행 전 한계를 미리 정하지 않음\"에서 비롯되는 경우가 많다"
why = "현장에서는 감정과 압박 아래 의사결정이 흔들리므로, 미리 정한 기준이 없으면 즉석 판단이 나빠진다."
breaks = "미리 정한 기준이 너무 엄격하면 작은 상황에서도 불필요하게 취소하게 된다."
confidence = "중간"
general_original = "중요한 결정은 상황 전에 기준으로 정해 두고, 상황에서는 기준과 대조만 한다."
conditions = ["S_time_pressure", "S_goal_conflict", "S_can_rehearse"]

[[hypothesis]]
id = "H_haiku_aviation_07"
text = "한번 정한 목표에 마음이 묶이면 중간에 바꾸기가 어려우므로, 바꿀 신호를 미리 정해 두고 그 신호가 보이면 바꾸는 쪽을 기본으로 삼는다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — 2번 사례와 같은 Code 7700 AA1420 및 FAA 위험관리 자료의 취지 [열람 일부, 요약]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "목표 지점을 향해 있는데 날씨가 나빠지는 신호가 보이면 \"계획을 바꾸는 것\"을 실패로 보지 않는다"
why = "목표 고정(fixation)이 중간 변경을 막는다."
breaks = "우회가 다른 위험을 늘리는 경우(연료 부족, 악천후로 가는 우회) 바꾸는 것이 오히려 해가 될 수 있다."
confidence = "중간"
general_original = "계획 변경 기준을 미리 정하고, 그 기준이 보이면 목표 변경을 기본으로 한다."
conditions = ["S_sunk_cost", "S_slow_drift", "S_uncontrolled_env"]

[[hypothesis]]
id = "H_haiku_aviation_08"
text = "조건에 따라 필요한 여유가 몇 배까지 커지고 시작한 뒤에는 멈출 거리가 모자라므로, 시작 전에 여유를 넉넉히 계산하고 중간에 그만둘 기준점을 정해 두어 그 지점에서 기준에 못 미치면 바로 멈춘다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — NTSB 사고 보고서 다수 검색 요약(차트 밖 이륙, 고밀도 고도 복합 요인) [요약]. https://www.generalaviationnews.com/2022/07/20/pilot-crashes-after-failing-to-consider-affect-of-density-altitude [요약]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "고밀도 고도(높은 고도·고온)에서 이륙 성능이 계산에서 벗어나면, 엔진을 올리기 전에 계획을 다시 본다"
why = "이륙 거리는 조건에 따라 몇 배 차이가 난다. 사고는 활주 중이 아니라 계획 단계에서 대부분 정해진다."
breaks = "차트 밖에서도 가벼운 기체라면 이륙이 가능하다. 반대로 이 원칙만 믿고 활주 중 중단 판단을 늦추면 위험하다."
confidence = "중간"
general_original = "비행 중 결정은 계획 단계에서 이미 정해진 한계 안에서만 이루어지게 한다."
conditions = ["S_uncontrolled_env", "S_irreversible", "S_can_rehearse"]

[[hypothesis]]
id = "H_haiku_aviation_09"
text = "위기 상황에서 직관이 반대 방향을 가리킬 때는 그 직관을 따르지 않는 절차를 먼저 외워 둔다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 출처 없음(모델 지식) — 출처 없음(모델 지식). AF447 관련 포럼 요약에서 기수를 올린 입력이 실속을 깊게 했다는 내용을 확인함 https://www.airlinepilotforums.com/safety/84657-air-france-447-interesting-article-7.html [요약]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "스털(실속) 경고가 울리는데 기수를 올리면 더 깊게 빠진다. 받음각을 줄여 회복한다"
why = "받음각을 키우면 양력이 줄어 강하가 가속된다."
breaks = "저고도에서 지형 회피가 필요할 때는 기수 조작 순서가 달라질 수 있다. 자동화 상황에서 조종사가 이를 인식하지 못하는 것이 AF447의 핵심이다."
confidence = "높음"
conditions = ["S_tacit_sense", "S_time_pressure", "S_rare_fatal"]

[[hypothesis]]
id = "H_haiku_aviation_10"
text = "보조 장치가 갑자기 빠지면 무엇이 잘못됐는지 가려진 채로 상황 인식부터 무너지므로, 자동 복구를 기다리지 말고 먼저 기본 자세와 힘을 붙잡은 뒤에 원인을 확인한다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — AF447 관련 기사·사례 분석 요약(BEA 보고서 내용을 2차로 인용) [요약]. Flying \"The Predicament of Air France 447\" https://www.flyingmag.com/technique-accidents-predicament-air-france-447/ [열람, 유료벽 전 일부]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "자동화가 갑자기 빠지면 먼저 \"지금 무슨 상태인지\" 확인하고 수동 조종으로 넘긴다"
why = "자동화가 오류를 가리면 조종사는 상황 인식을 잃는다. AF447은 피토관 결빙 후 자동조종 해제 시 수동 전환을 제대로 못 했다."
breaks = "자동화가 실제로 안전한 경우도 많다. 수동 조종을 자주 하지 않는 조종사에게는 이 원칙이 오히려 역효과를 낼 수 있다."
confidence = "높음"
general_original = "보조 장치가 빠지면 자동 복구를 기다리지 않고 기본 상태를 먼저 확인한다."
conditions = ["S_handoff", "S_hidden_state", "S_instrument_doubt"]

[[hypothesis]]
id = "H_haiku_aviation_11"
text = "작은 규칙을 어기는 모습이 되풀이되면 새로 온 사람은 규칙 전체가 장식이라고 배우므로, 사소해 보이는 규칙일수록 윗사람부터 지키는 모습을 보인다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — 무균 조종실(sterile cockpit) 규정 자료 및 ASRS Directline https://asrs.arc.nasa.gov/publications/directline/dl4_sterile.htm [요약]. \"문화이지 규칙이 아니다\" 주장은 훈련 자료 요약 [요약]"
field = "항공 조종 (조종사 판단·비행 안전)"
group = "웹 조사 10개 분야"
rule = "사소하게 여겨진 규칙도 \"문서에만 있으면\" 무너진다. 규칙을 지키는 문화가 규칙보다 중요하다"
