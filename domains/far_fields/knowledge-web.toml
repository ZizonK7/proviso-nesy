[[hypothesis]]
id = "H_haiku_firefighting_03"
text = "필요한 양을 크기 하나로 빠르게 어림해 출발점으로 삼는다. 다만 그 어림이 만들어진 규모를 넘어서면 다른 기준으로 바꾼다. 어림값은 흔한 규모의 경험에서 나온 것이라 큰 규모에서는 모자란다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — https://www.firehouse.com/operations-training/article/10544908/managing-the-room-and-contents-syndrome (기사, 1997년, 열어 확인)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "방 크기 기준 필요 유량은 면적 ÷ 3(gpm)으로 먼저 잡는다 화재 면적(sq ft) ÷ 3을 필요 유량(gpm)의 출발점으로 삼는다."
why = "면적 기준으로 빠르게 필요량을 판단할 수 있다."
breaks = "기사는 1997년 자료다. 1¾인치 관은 전형적인 방이나 두 칸짜리 화재에는 충분하다는 암묵적 전제가 있다. 큰 화재에는 2½인치 관이나 마스터 스트림이 필요하다고 한다."
confidence = "중간"
general_original = "빠른 추정치는 적용 범위와 시대를 확인한다. 규모가 커지면 기준을 바꾼다."
conditions = ["S_scale_change", "S_time_pressure"]

[[hypothesis]]
id = "H_haiku_firefighting_04"
text = "바깥 힘이 흐름을 한쪽으로 밀어붙이는 조건에서는 그 힘이 들어오는 쪽 통로를 열지 않고, 그 사실을 전체 지휘에 바로 알린다. 통로가 이어지면 밀려든 흐름이 사람이 있는 쪽으로 몰린다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — https://www.fireengineering.com/firefighting/wind-driven-fires-lessons-learned-houston/ (기사, 2012년, 열어 확인. NIST 연구 인용)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "풍속 10mph 이상이면 지휘관에게 즉시 알리고, 바람이 가라앉을 때까지 수직 환기를 미룬다 바람이 10mph 이상이면 지휘관에게 알리고, 화재가 진화될 때까지 수직 환기나 창문 파괴를 하지 않는다."
why = "바람이 한쪽 개구부에서 다른 쪽으로 흐르는 통로를 만들면 불길이 그 길을 따라 밀려든다."
breaks = "6mph 정도의 맞바람도 송풍기(PPV) 효과를 상쇄할 수 있다고 한다. 바람 방향과 건물 구조에 따라 달라진다. 기사는 계획이지 보장이 아니라고 적는다."
confidence = "중간"
general_original = "바람이 흐름의 방향을 바꾸는 조건에서는 개구부를 여는 순서를 바꾼다."
conditions = ["S_uncontrolled_env", "S_order_matters", "S_rare_fatal"]

[[hypothesis]]
id = "H_haiku_firefighting_05"
text = "같은 겉모습이 여러 원인에서 똑같이 나올 수 있다. 그러니 그것 하나로 결론 내리지 말고, 다른 신호와 시간에 따른 변화를 함께 본다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — https://www.firehouse.com/operations-training/article/10504806/reading-the-fire-smoke-and-air-track (기사, 2007년, 열어 확인)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "검은 연기는 \"완전히 붙은 불\"이 아니라 산소가 부족한 불일 수 있다 연기색은 불의 상태를 읽는 한 지표로 쓰되, 색만으로 결론 내리지 않는다."
why = "어두운 연기는 불완전 연소, 즉 환기가 부족하다는 신호인 경우가 많다. 밝은 연기는 미연소 가스가 많다는 뜻이다."
breaks = "색은 여러 지표 중 하나다. 연료가 플라스틱이나 석유계이면 검게 보인다. 공기가 맥동하면(연기가 나갔다 공기가 들어오기를 반복) 역화(백드래프트) 가능성이 있다."
confidence = "중간"
general_original = "단일 지표로 판단하지 말고, 시간에 따른 변화(추세)를 함께 본다."
conditions = ["S_hidden_state", "S_instrument_doubt", "S_material_varies"]

[[hypothesis]]
id = "H_haiku_firefighting_06"
text = "겉으로 드러난 신호가 안쪽이 이미 감당 못 할 만큼 커졌음을 보여 주면, 안쪽 사람의 체감 보고를 기다리지 않는다. 미리 정한 기준에 따라 바깥에서 하는 방식으로 바꾼다. 안쪽에서 느껴질 때는 이미 늦다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — https://www.firehouse.com/operations-training/article/10503640/defensive-operations-learning-by-experience-insights-from-fireground-commanders-part-1 (현장 지휘관 인터뷰 기사, 2007년, 열어 확인)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "가압된 연기와 여러 층의 화염은 방어 전환의 신호다 건물에서 압력을 받은 연기가 밀려나오거나, 2개 층 이상에서 화염이 계속되면 내부 공격을 접고 외부 방어로 전환을 검토한다."
why = "이 상태는 구조가 곧 무너질 수 있거나 내부 공격 효과가 없다는 신호다. 내부 열 보고는 이미 늦은 신호다."
breaks = "연기와 열만으로는 방어 전환 근거가 되지 않는다는 지휘관도 있었다. 경량 구조나 천장이 높은 건물, 풍속 10mph 이상이면 더 일찍 판단해야 한다."
confidence = "중간"
general_original = "위험 신호가 나타나면 \"지금까지 하던 방식\"을 버리기 전에 조건부 기준을 먼저 확인한다."
conditions = ["S_delayed_feedback", "S_sunk_cost", "S_goal_conflict"]

[[hypothesis]]
id = "H_haiku_firefighting_07"
text = "보조 도구의 화면이 갑자기 이상해지면, 대상이 바뀐 것인지 보는 부분이 더러워진 것인지부터 가린다. 그리고 도구가 안 될 때도 움직일 수 있게 머릿속 그림을 따로 만들어 둔다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — https://www.firehouse.com/operations-training/thermal-imagers/article/55364263/the-myth-of-white-out-in-fire-service-thermal-imaging-cameras (기사, 2026년 4월, 열어 확인)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "열화상 카메라 화면이 하얗게 되면 열 때문이 아니라 렌즈 오염인 경우가 대부분이다 영상이 하얗거나 회색으로 변하면 렌즈부터 닦고, 카메라는 보조 수단으로 쓴다. 먼저 머릿속 지도를 만든다."
why = "최신 카메라는 열로 인한 완전 백화가 드물고, 주로 습기나 입자가 렌즈에 묻어서 생긴다."
breaks = "이중·삼중 게인 카메라는 게인이 전환되는 동안 잠깐 하얗게 보일 수 있다. 기사 작성자는 열이 올라가는데 영상이 안 좋아지면 그 자체가 현장 파악 실패라고 본다."
confidence = "중간"
general_original = "측정 도구가 이상하면 도구 탓을 하기 전에 감지부 오염을 먼저 의심한다."
conditions = ["S_instrument_doubt", "S_tool_wear", "S_blind_spot"]

[[hypothesis]]
id = "H_haiku_firefighting_08"
text = "측정이 안 되는 영역을 측정값이 없다는 이유로 \"정상\"으로 읽지 않는다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — https://www.fireengineering.com/?p=246133 (기사, 2008년, 열어 확인. NIOSH 사례 인용)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "열화상 카메라는 바닥 아래 열을 못 보니, 차가운 화면을 바닥 안전의 증거로 쓰지 않는다 바닥이 차갑게 나온다고 안전하다고 판단하지 않는다. 바닥을 두드리는 것도 늦은 신호다."
why = "기사 실험에서 화염 위 바닥이 1,378°F일 때 화면에는 73°F로 찍혔다. 열이 바닥을 통과해 보이지 않는다."
breaks = "두드릴 때 소리가 나면 이미 늦다. 위스콘신 사례는 붕괴 전 경고 없이 바닥이 꺼졌다. 가벼운 트러스(lightweight truss) 구조는 더 일찍 무너진다."
confidence = "높음"
conditions = ["S_blind_spot", "S_instrument_doubt", "S_rare_fatal"]

[[hypothesis]]
id = "H_haiku_firefighting_09"
text = "드물게 쓰는 비상 신호는 평소 쓰는 붐비는 경로와 분리해 둔다. 실제로 몸이 그 경로를 찾도록 미리 연습한다. 평소 경로에 섞이면 신호가 묻혀 늦게 닿는다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — https://www.fireengineering.com/firefighting/the-success-of-a-good-accountability-system/ (기사, 2023년, 열어 확인)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "대원 위치 추적(PAR)은 \"목록 확인\"이 아니라 긴급 채널까지 한 줄로 이어져야 한다 긴급 상황에는 책임자가 긴급 무선을 몸에 지니고, 메이데이 절차를 미리 연습한다."
why = "메이데이가 울려도 연결이 끊기면 구조 대상을 찾지 못한다."
breaks = "2021년 Project Mayday 조사에서 지휘관 68%가 메이데이 때 추적 도구를 갖고 있지 않았다. 가티노 사례에서는 첫 메이데이가 약 2분 30초 동안 전달되지 않았다. 전술 채널에서 찾다가 긴급 채널을 쓰지 않은 것이 원인이었다."
confidence = "높음"
general_original = "비상 신호는 평소 쓰는 경로와 분리해서 설계하고, 그 경로를 실제로 연습한다."
conditions = ["S_rare_fatal", "S_handoff", "S_can_rehearse"]

[[hypothesis]]
id = "H_haiku_firefighting_10"
text = "복잡한 곳에 들어가기 전에 바깥을 한 바퀴 보고 전체 그림을 먼저 그린다. 혼자 들어가지 않고, 들어가는 순간부터 구하러 갈 사람을 따로 세워 둔다. 안에서 문제가 생기면 혼자서는 알리지도 빠져나오지도 못한다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 원문 열람 — https://www.firerescue1.com/niosh/niosh-md-captain-dies-after-floor-collapse-at-large-house-fire (기사, 조사 보고서 요약, 2025년, 열어 확인)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "내부 공격 전에 360도 크기 파악을 하고, 대원은 짝을 지어 들어가며, 진입 초기에 구조 팀을 세운다 내부 공격을 시작하기 전에 건물 전체를 돌아보고, 대원은 혼자 들어가지 않으며, 구조팀(RIC)을 공격 시작과 동시에 배치한다."
why = "360도 파악이 없으면 구조 형태와 화재 진행 방향을 알 수 없다."
breaks = "2021년 메릴랜드 화재에서는 대장이 혼자 방에 있을 때 바닥이 무너졌다. 기사가 요약한 조사 결과다. 화재 위치와 구조에 따라 360도 파악에 시간이 많이 걸릴 수 있다."
confidence = "중간"
general_original = "복잡한 현장에 들어가기 전에 전체 구조를 먼저 그린다. 짝 없이 혼자 들어가지 않는다."
conditions = ["S_rescuer_risk", "S_blind_spot", "S_order_matters"]

[[hypothesis]]
id = "H_haiku_firefighting_11"
text = "아래쪽 보이지 않는 곳에 불이 있으면 그 위와 연결 통로가 열기와 연기가 빠져나가는 길이 되고, 디딘 바닥이 아래에서부터 약해진다. 그러니 불의 위치를 먼저 확인하고, 그 통로 위에서 들어가지 않는다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — https://nxtbook.com/nxtbooks/nfpa/journal_20120910/index.php?startid=36 (NFPA Journal 2012년, 검색 요약만)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "지하 화재에서 계단으로 환기하면 바닥이 빠르게 무너질 수 있다 (검색 요약만) 지하 화재는 환기를 지휘와 맞춰 하지 않으면 불이 갑자기 강해져 바닥이 무너진다."
why = "지하에 공기가 들어가면 화염 강도가 급증하고 구조가 약해진다. 여러 NIOSH 사례에서 대원이 불이 지하에 있는 줄 몰랐다."
breaks = "환기를 조율하면 이 위험은 줄어든다. 원문에서 세부 조건은 확인하지 못했다."
confidence = "중간"
general_original = "격리된 공간에 산소를 넣기 전에 그 공간에 누가 있는지, 흐름이 어떻게 바뀌는지 확인한다."
conditions = ["S_blind_spot", "S_hidden_state", "S_order_matters"]

[[hypothesis]]
id = "H_haiku_firefighting_12"
text = "빠르게 연소하고 빠르게 무너지는 재료로 된 구조는 진입 판단 기준을 따로 세운다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — https://www.asiae.co.kr/en/article/2024031418185615893 (기사, 2024년, 검색 요약만)"
field = "소방 (화재 진압·현장 지휘)"
group = "웹 조사 10개 분야"
rule = "샌드위치 패널 건물 화재는 빠르게 붕괴 조건이 되므로 내부 진입 판단을 엄격히 한다 (검색 요약만) 샌드위치 패널 구조 건물의 화재는 진입 전에 붕괴 위험을 높게 본다."
why = "2024년 문경 육류가공공장 화재에서 소방관 2명이 순직했다. 패널이 빠르게 불을 옮기고 탄 구조물이 무너졌다고 보도됐다."
breaks = "기준이 강화됐는데도 반복된다는 지적이 있다. 현장 판단을 존중하고 재량을 줘야 한다는 전문가 의견도 있다."
confidence = "낮음"
conditions = ["S_rare_fatal", "S_material_varies", "S_hidden_state"]

[[hypothesis]]
id = "H_haiku_firefighting_13"
text = "눈에 띄는 위험보다 덜 보이는 위험이 더 넓게 퍼지고 먼저 사람을 해칠 수 있다. 그러니 눈에 띄는 것이 없는 곳도 안전하다고 보지 말고, 퍼지는 길을 먼저 확인한다."
source = "웹 조사: Haiku 5.5 'searching' 2026-11-03, 검색 요약만 — https://www.koreatimes.co.kr/southkorea/20260421/instinct-to-flee-fire-can-be-fatal-officials-warn (기사, 2026년 4월, 검색 요약만)"
