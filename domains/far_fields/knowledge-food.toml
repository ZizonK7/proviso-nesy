# 먼 분야 경험 논리 — 묶음 '음식·발효'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 대량 김장 (음식·발효)
[[hypothesis]]
id = "H_kimchi_making_01"
text = "조건마다 처리 시간이 달라지는 일은 정해진 시간보다 가장 느리게 변하는 부분의 상태로 끝을 판단한다. 중간에 위치를 바꿔 주면 고르게 된다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "대량 김장"
group = "음식·발효"
rule = "절임이 끝났는지는 시간이 아니라 가장 두꺼운 포기의 하얀 줄기를 꺾어 보고 판단해라. 툭 부러지지 않고 부드럽게 휘어지면 된 거다. 중간에 한 번은 위아래를 뒤집어 줘야 고르게 절여진다."
why = "날씨, 배추 크기, 소금물 농도에 따라 절이는 시간이 몇 시간씩 달라진다. 줄기가 가장 늦게 절여지므로 줄기가 기준이 된다."
breaks = "얇은 겉잎이나 작은 포기로 확인하면 다 됐다고 착각한다. 이미 흐물흐물하게 휘면 지나치게 절여진 것이라 늦은 신호다."
confidence = "높음"
conditions = ["S_material_varies", "S_hidden_state", "S_tacit_sense"]

[[hypothesis]]
id = "H_kimchi_making_02"
text = "간이 측정 수단을 쓸 때는 그 수단 자체의 상태가 판정을 흔들 수 있다. 수단이 멀쩡한지 먼저 확인하거나 다른 방법으로 한 번 더 확인한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "대량 김장"
group = "음식·발효"
rule = "소금물 농도는 날달걀을 띄워서 500원짜리 동전만큼 수면 위로 떠오르면 적당하다고들 한다. 다만 오래된 달걀은 원래 잘 뜨니까, 신선한 달걀인지부터 봐라."
why = "농도가 진할수록 뜨는 힘이 커져서 달걀이 간이 비중계 노릇을 한다. 하지만 달걀은 묵을수록 속에 공기가 차서 같은 농도에서도 더 높이 뜬다."
breaks = "달걀 상태를 모르면 판정이 크게 틀어진다. 염도계가 있으면 그걸로 맞추는 게 낫다. 절임배추를 사 왔다면 이 단계는 필요 없다."
confidence = "중간"
conditions = ["S_instrument_doubt", "S_material_varies"]

[[hypothesis]]
id = "H_kimchi_making_03"
text = "앞 단계에서 남은 군더더기는 뒤 단계를 묽게 만들고 그 결과는 늦게 드러난다. 그러니 서두르더라도 다음 단계로 넘기기 전에 충분히 빼 둔다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "대량 김장"
group = "음식·발효"
rule = "헹군 배추는 자른 면을 아래로 엎어서 최소 두세 시간, 양이 많으면 반나절은 물을 빼라. 바쁘다고 덜 빼고 버무리면 며칠 뒤 통에 국물이 흥건해지고 맛이 싱거워진다."
why = "잎 사이에 남은 물이 양념을 묽게 만든다. 이 물은 버무릴 때는 잘 안 보이다가 숙성되면서 빠져나온다."
breaks = "따뜻한 곳에 너무 오래 두면 배추가 마르거나 쉬기 시작한다. 한겨울 바깥에 두면 얼 수도 있다."
confidence = "높음"
conditions = ["S_order_matters", "S_delayed_feedback", "S_time_pressure"]

[[hypothesis]]
id = "H_kimchi_making_04"
text = "결과가 시간이 지나며 한쪽으로 변하는 일이라면 지금 완벽하게 맞추지 않는다. 변할 방향만큼 미리 반대로 기울여 맞춘다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "대량 김장"
group = "음식·발효"
rule = "버무리는 날 맛봤을 때 '살짝 짭짤한데?' 싶어야 익고 나면 딱 맞는다. 당일에 간이 딱 맞으면 익은 뒤에는 싱겁다."
why = "숙성되면서 배추 속 수분이 빠져나와 간이 묽어지고, 신맛이 올라와 짠맛이 덜 느껴진다."
breaks = "바로 먹을 겉절이는 당일 간에 맞춘다. 절임이 이미 짜게 됐는데 양념까지 짜게 하면 회복이 안 된다."
confidence = "높음"
conditions = ["S_delayed_feedback", "S_slow_drift"]

[[hypothesis]]
id = "H_kimchi_making_05"
text = "섞어야 하는 재료 중 약한 것은 마지막에 가볍게 넣는다. 강한 재료와 같은 시간, 같은 힘으로 다루면 약한 쪽이 먼저 망가진다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "대량 김장"
group = "음식·발효"
rule = "쪽파나 갓 같은 연한 채소는 맨 마지막에 넣고 살살 뒤적이기만 해라. 무채랑 처음부터 같이 치대면 풋내가 나고 짓무른다."
why = "단단한 재료를 고르게 섞는 데 필요한 힘과 시간을 연한 재료는 견디지 못하고 조직이 상한다."
breaks = "재료를 오래 두고 숙성시켜 숨을 죽이려는 경우에는 일부러 미리 섞기도 한다. 집마다 방식이 다르다."
confidence = "높음"
conditions = ["S_order_matters", "S_material_varies"]

[[hypothesis]]
id = "H_kimchi_making_06"
text = "정해진 자원을 여럿이 함께 쓸 때는 한곳에 쌓아 두지 말고 단위별로 미리 쪼개 나눠 준다. 그래야 앞쪽은 넉넉하고 뒤쪽은 모자라는 쏠림을 막는다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "대량 김장"
group = "음식·발효"
rule = "양념은 큰 통 하나에 몰아 두고 다 같이 퍼 쓰지 마라. 배추 몇 포기당 양념 한 대야씩으로 미리 나눠 놔라. 안 그러면 앞사람들이 듬뿍 발라서 마지막 배추 스무 포기가 양념 없이 남는다."
why = "넉넉해 보이는 더미 앞에서는 누구나 후하게 쓴다. 바르는 양도 사람마다 달라서 뒤로 갈수록 모자란다."
breaks = "양이 적거나 한 사람이 다 버무린다면 나눌 필요가 없다. 처음 해 보는 배합이라면 남는 사태를 막으려고 조금 덜 만드는 게 낫다."
confidence = "높음"
conditions = ["S_fixed_budget", "S_have_vs_reach", "S_team_sync"]

[[hypothesis]]
id = "H_kimchi_making_07"
text = "여럿이 하나의 결과물을 만들 때는 판정과 수정 권한을 한 사람에게 모은다. 각자 조금씩 고치면 결과가 제각각이 되고 고친 것끼리 서로를 상쇄한다."
