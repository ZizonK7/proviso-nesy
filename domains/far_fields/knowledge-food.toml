text = "간이 측정 도구로 기준을 잴 때는 그 도구 자체가 시간이 지나며 변하지 않았는지부터 본다. 변한 도구는 늘 한쪽으로 틀리기 때문에, 틀린 줄도 모른 채 같은 실수가 되풀이된다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "된장 담그기"
group = "음식·발효"
rule = "소금물 농도는 달걀을 띄워 보고, 물 위로 500원 동전만큼 드러나면 됐다고 본다. 다만 달걀이 오래된 것이면 덜 짠 물에서도 떠오르니, 꼭 신선한 달걀로 재야 한다."
why = "달걀은 오래될수록 속 공기주머니가 커져서 잘 뜬다. 오래된 달걀로 재면 소금이 모자란데도 충분하다고 착각하게 된다."
breaks = "달걀 신선도를 모를 때는 이 방법을 믿으면 안 된다. 염도계가 있거나 무게로 소금 비율을 정했다면 그쪽이 더 정확하다."
confidence = "높음"
