group = "음식·발효"
rule = "여럿이 버무릴 때 간은 한 사람만 보고, 고칠 때도 그 사람이 고친다. 각자 한 입씩 먹어 보고 젓갈 더, 설탕 더 넣다 보면 대야마다 맛이 달라진다."
why = "사람마다 입맛 기준이 달라서 각자 조금씩 고치면 고친 내용이 겹치거나 서로 엇갈린다."
breaks = "기준을 잡는 사람의 입맛이 유난히 짜거나 달면 전체가 그쪽으로 쏠린다. 먹을 집이 여럿이면 집별로 따로 맞추기도 한다."
confidence = "중간"
conditions = ["S_team_sync"]

[[hypothesis]]
