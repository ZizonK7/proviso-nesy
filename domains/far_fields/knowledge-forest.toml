# 먼 분야 경험 논리 — 묶음 '숲·산·눈'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 송로버섯 탐지(개 동반) (숲·산·눈)
[[hypothesis]]
id = "H_truffle_hunting_01"
text = "속에 숨은 것이 직접 보이지 않으면, 그것이 주변에 남기는 억제나 결핍의 흔적을 찾는다. 흔적은 바깥으로 넓어지며 생기므로, 한창 자라는 쪽인 경계부터 살핀다. 다만 비슷한 흔적은 다른 원인으로도 생기니 흔적만 믿지는 않는다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "송로버섯 탐지(개 동반)"
group = "숲·산·눈"
rule = "흑송로(겨울 검은 송로버섯)를 찾을 때는 숙주나무 둘레에 풀이 말라 맨땅이 둥글게 드러난 '브륄레(타 버린 자리)'부터 본다. 개를 그 원 가장자리 쪽으로 먼저 돌린다."
why = "송로 균사가 주변 풀의 성장을 누르기 때문에 땅 위에 흔적이 남고, 열매는 대개 그 경계 근처에 맺힌다."
breaks = "브륄레가 없어도 나는 종류나 땅이 있고, 가뭄이나 제초 때문에 비슷한 맨땅이 생기기도 한다. 백송로(흰 송로버섯) 산지에서는 이 신호가 잘 통하지 않는다."
confidence = "높음"
general_original = "속에 숨은 것이 직접 보이지 않으면, 그것이 주변에 남기는 억제나 결핍의 흔적을 찾는다. 이때는 흔적의 한가운데보다 경계부터 살핀다."
conditions = ["S_hidden_state", "S_blind_spot", "S_instrument_doubt"]

[[hypothesis]]
id = "H_truffle_hunting_02"
text = "신호를 읽는 사람의 실력보다 신호가 바깥으로 새어 나오는 조건이 결과를 더 크게 좌우할 때가 있다. 그럴 때는 실력을 키우기 전에 신호가 잘 나오는 때를 먼저 고른다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "송로버섯 탐지(개 동반)"
group = "숲·산·눈"
rule = "한낮의 뜨겁고 마른 땅이나 꽁꽁 언 땅에서는 냄새가 안 올라온다. 이른 아침이나 저녁, 가벼운 비 뒤의 촉촉한 날을 고르고 바람을 안고 걷게 한다."
why = "냄새 분자는 온도·습도·바람에 따라 땅 위로 올라오고 퍼지는 정도가 크게 달라진다."
breaks = "큰비 직후 땅이 질척하면 오히려 냄새가 묻히고 땅을 다지기 쉽다. 남의 눈을 피해야 하는 곳이면 시간대를 날씨보다 보안 기준으로 고르기도 한다."
confidence = "중간"
conditions = ["S_uncontrolled_env", "S_short_window"]

[[hypothesis]]
id = "H_truffle_hunting_03"
text = "찾는 일과 꺼내는 일은 요구되는 섬세함이 다르다. 찾는 쪽이 위치를 알려 준 순간 일을 넘겨받아야 대상과 그 터전이 덜 상한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "송로버섯 탐지(개 동반)"
group = "숲·산·눈"
rule = "개가 앞발로 긁기 시작하면 바로 칭찬하고 떼어 낸다. 그다음부터는 사람이 작은 호미로 조금씩 파면서 흙 냄새를 직접 맡아 위치를 좁힌다."
why = "개가 계속 파면 버섯을 긁어 상처 내거나 먹고, 둘레의 균사까지 헤집어 놓는다."
breaks = "아주 얕게 묻혀 있고 개가 절대 먹지 않도록 훈련됐다면 개가 끝까지 드러내게 두는 사람도 있다."
confidence = "높음"
conditions = ["S_handoff", "S_irreversible", "S_order_matters"]

[[hypothesis]]
id = "H_truffle_hunting_04"
text = "결과가 아니라 결과를 내는 척하는 행동에 보상이 붙으면, 보상받는 쪽은 곧 척하는 행동을 늘린다. 그래서 보상은 확인된 결과에 바로 붙여야 한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "송로버섯 탐지(개 동반)"
group = "숲·산·눈"
rule = "간식은 버섯이 실제로 나온 그 순간에, 그 자리에서 준다. 긁기만 했는데 주면 개는 아무 데나 긁어서 간식을 받아 내는 법을 배운다."
why = "동물은 보상 직전에 한 행동을 배운다. 결과 없이 행동만 보상하면 행동만 늘어난다."
breaks = "훈련 초기 어린 개는 흥미를 이어 가려고 시도 자체를 보상하기도 한다. 다만 점점 결과 중심으로 옮겨 가야 한다."
confidence = "높음"
conditions = ["S_living_system", "S_repetition"]

[[hypothesis]]
id = "H_truffle_hunting_05"
text = "되풀이해서 거두는 자원이라면 거둔 직후 자리를 되돌려 놓는 작은 수고가 다음 수확을 지킨다. 이것을 빼먹으면 손해가 한참 뒤에야 드러난다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "송로버섯 탐지(개 동반)"
group = "숲·산·눈"
rule = "캐낸 구멍은 반드시 파낸 흙으로 다시 메우고 살짝 눌러 둔다. 열어 두면 그 자리에서 다음 해에 안 난다."
why = "구멍이 열려 있으면 균사가 마르고 공기와 서리에 노출되어 생산력이 떨어진다."
breaks = "이미 망가진 곳이거나 땅 주인이 다른 관리법을 쓰는 재배지(트뤼피에르)라면 그쪽 방식을 따른다."
