text = "거둘 때가 따로 있는 대상을 조급함 때문에 일찍 건드리면 그 하나의 가치도 잃고 다음 기회까지 깎인다. 그래서 익음을 알려 주는 신호가 스스로 강해질 때까지 기다린다."
