# 먼 분야 경험 논리 — 묶음 '사람 다루기'의 조각과 판정
# 자동 생성 파일: 손으로 고치지 말고 build.py를 다시 돌린다. 분야 뼈대(domain·목표·모양)는 knowledge.toml, 설명은 같은 폴더 CLAUDE.md.

# 클럽 출입 경비 (사람 다루기)
[[hypothesis]]
id = "H_bouncing_01"
text = "서류가 진짜 주인 것인지 볼 때는 서류 자체보다, 주인이라면 생각 없이 바로 나올 주변 정보를 물어 반응 속도를 본다. 외운 사실과 몸에 밴 사실은 꺼내는 속도가 다르기 때문이다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "클럽 출입 경비"
group = "사람 다루기"
rule = "신분증 사진만 보지 말고 띠나 주소지 동네를 물어봐라. 남의 신분증이나 위조 신분증 쓰는 애들은 생년은 외워 와도 띠를 물으면 한 박자 늦게 나온다."
why = "외워 온 정보와 오래 몸에 밴 정보는 머릿속에서 꺼내는 속도가 다르다."
breaks = "외국인, 원래 긴장을 잘 하는 사람, 음악 때문에 잘 못 알아들은 사람은 진짜여도 머뭇거린다. 요즘은 띠까지 외워 오는 경우도 있어서 이것만으로 판정하면 안 된다."
confidence = "중간"
conditions = ["S_instrument_doubt", "S_hidden_state", "S_opponent"]

[[hypothesis]]
id = "H_bouncing_02"
text = "상대가 평가받는다는 걸 알면 행동을 꾸미므로, 판단 재료는 평가 자리에 오기 전 무심한 상태에서 미리 모아 둔다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "클럽 출입 경비"
group = "사람 다루기"
rule = "문 앞에 왔을 때 판단하지 말고 줄 서 있을 때부터 봐라. 벽 짚는지, 일행끼리 언성 높이는지, 걸음이 어떤지. 문 앞에 서면 다들 멀쩡한 척한다."
why = "사람은 평가받는다는 걸 아는 순간 행동을 꾸민다. 무심할 때 본 모습이 더 정확하다."
breaks = "줄이 길고 인원이 모자라면 미리 볼 여유가 없다. 줄에서 한 번 찍어 둔 인상에 매달리면, 잠깐 들뜬 사람까지 편견으로 걸러 버린다."
confidence = "높음"
conditions = ["S_hidden_state", "S_living_system"]

[[hypothesis]]
id = "H_bouncing_03"
text = "되돌릴 생각이 없는 거절에 구체적인 이유를 붙이면 그 이유가 반박과 흥정의 손잡이가 된다. 그래서 결론만 짧게, 같은 말로 되풀이한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "클럽 출입 경비"
group = "사람 다루기"
rule = "입장 거절할 때 구체적인 이유를 대지 마라. '신발 때문에'라고 하면 신발 바꿔 오거나 따진다. '오늘은 입장이 어렵습니다'만 같은 톤으로 반복해라."
why = "구체적인 이유는 반박하고 흥정할 거리가 된다. 같은 말을 반복하면 말싸움이 붙을 틈이 없다."
breaks = "미성년처럼 사유가 명백한 경우는 말해 주는 게 낫다. 차별 시비가 붙을 만한 상황이나 다시 와 줬으면 하는 단골에게는 이유를 설명하는 게 관계와 뒤탈 면에서 낫다."
confidence = "높음"
conditions = ["S_opponent", "S_judged_by_others"]

[[hypothesis]]
id = "H_bouncing_04"
text = "상대의 의도를 읽으려고 겉표정을 보는 동안 실제 위해는 다른 곳에서 시작된다. 그러니 결과가 시작되는 지점에 눈을 두고, 반응할 시간만큼 거리를 확보한다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "클럽 출입 경비"
group = "사람 다루기"
rule = "실랑이할 때는 얼굴 말고 손을 봐라. 팔 하나 반 거리를 두고, 몸은 정면 말고 비스듬히 세워라. 손이 주머니로 가거나 주먹이 쥐어지면 그게 신호다."
why = "표정은 꾸밀 수 있지만 위해는 손에서 시작된다. 거리가 곧 반응할 시간이다."
breaks = "좁은 입구나 사람이 꽉 찬 곳에서는 거리를 둘 수 없다. 그럴 땐 어중간한 거리가 오히려 가장 위험해서, 동료와 함께 아예 붙어서 팔을 막는 쪽이 낫다는 사람도 있다."
confidence = "높음"
conditions = ["S_opponent", "S_time_pressure", "S_hidden_state"]

[[hypothesis]]
id = "H_bouncing_05"
text = "구경꾼이 있는 데서 상대를 물러서게 하려면, 지는 모양이 아니라 스스로 고른 모양으로 나갈 길을 남겨 둔다. 체면이 걸리면 사람은 손해를 보더라도 버틴다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "클럽 출입 경비"
group = "사람 다루기"
rule = "사람 내보낼 때 여럿 앞에서 끌어내지 마라. 일행을 불러서 '친구분이 좀 데리고 나가 주세요' 하면 대부분 자기 발로 나간다. 구경꾼 앞에서 끌려 나가면 자존심 때문에 끝까지 버틴다."
why = "보는 눈이 있으면 물러서는 게 지는 일이 된다. 스스로 나가는 모양을 만들어 주면 버틸 이유가 사라진다."
breaks = "이미 주먹이 오갔거나 다른 사람이 다칠 상황이면 체면을 챙겨 줄 여유가 없다."
confidence = "높음"
conditions = ["S_living_system", "S_judged_by_others", "S_opponent"]

[[hypothesis]]
id = "H_bouncing_06"
text = "한 상대에게 주의가 묶이면 그와 이어진 주변이 사각지대가 된다. 그래서 맞서는 일과 주변을 지켜보는 일을 서로 다른 사람에게 나눠 맡긴다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "클럽 출입 경비"
group = "사람 다루기"
rule = "치는 건 쫓겨나는 본인보다 옆에 있던 친구다. 한 명이 당사자를 상대하면 다른 한 명은 일행만 따로 맡아서 봐라."
why = "한 사람에게 주의가 쏠리면 옆과 뒤가 비고, 일행은 의리 때문에 끼어든다."
breaks = "일행이 오히려 말리는 역할을 하고 있을 때 그들을 적처럼 대하면, 말려 줄 사람을 잃고 그들까지 적으로 돌린다."
confidence = "높음"
conditions = ["S_blind_spot", "S_team_sync", "S_opponent"]

[[hypothesis]]
id = "H_bouncing_07"
text = "위급할 때 혼자 먼저 뛰어들면 도울 사람들이 상황을 모른 채 남는다. 몇 초를 들여 위치와 상황을 먼저 알린 뒤 들어가야 구하러 간 사람까지 고립되지 않는다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "클럽 출입 경비"
group = "사람 다루기"
rule = "싸움이 보이면 뛰어들기 전에 무전으로 위치부터 불러라. 혼자 먼저 들어가면 아무도 모르는 구석에서 네가 깔린다."
why = "동료가 있어도 상황을 모르면 오지 못한다. 도움은 알려야 닿는다."
breaks = "누가 바닥에 쓰러져 밟히고 있는 상황이면 몇 초도 아깝다. 그땐 소리치면서 들어가는 수밖에 없다."
confidence = "높음"
conditions = ["S_rescuer_risk", "S_have_vs_reach", "S_time_pressure"]

[[hypothesis]]
