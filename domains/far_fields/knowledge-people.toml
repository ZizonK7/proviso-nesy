# 요인 경호 (사람 다루기)
[[hypothesis]]
id = "H_bodyguarding_01"
text = "위험을 실제로 일으키는 부위나 경로가 정해져 있다면, 꾸미기 쉬운 겉모습보다 그 경로의 준비 동작을 먼저 본다."
source = "AI 생성: claude-opus-5-5 배치 2026-11-03, 출처 없음(모델 지식)"
field = "요인 경호"
group = "사람 다루기"
rule = "사람을 볼 때는 얼굴보다 손부터 봐라. 주머니나 가방에 들어간 손, 무언가를 쥔 채 앞으로 나오는 손이 먼저 신호를 준다."
why = "해를 끼치는 행동은 거의 다 손에서 시작한다. 표정은 꾸밀 수 있어도 손의 준비 동작은 숨기기 어렵다."
breaks = "차량 돌진이나 원격 장치처럼 손이 보이지 않는 거리에서 오는 위협에는 소용이 없다. 손만 보다가 주변 흐름을 놓쳐서도 안 된다."
confidence = "높음"
conditions = ["S_hidden_state", "S_opponent", "S_living_system"]

