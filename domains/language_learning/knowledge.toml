# ---------- 가설 (코드를 읽고 세운 AI 판단 — 조사 근거와 사용자 판정으로 시험한다) ----------
[[hypothesis]]
id = "H_false_known_lost"
text = "처음 본 항목을 '알았음'으로 넘기면 다시 시험받지 않아, 알았다고 착각한 항목이 여행 때 떠오르지 않는다"
source = "ai"
conditions = ["F_known_not_retested", "S_zero_level"]
harms = ["G_recognize"]
test_plan = "실사용 기록 재생: '알았음' 항목 수와 그중 뒤에 다시 본 적 없는 비율. 사용자 판정: 여행 뒤 못 알아본 단어가 '알았음' 항목이었나. 조사(research_evidence 2·9번 주제: 인출 연습, 자기 평가의 정확성) 근거로 먼저 판정"
note = "2026-10-22 AI 판단. 대가로 받아들일지 사용자 결정 대기 — audit이 오류로 잡는 것이 의도"

[[hypothesis]]
id = "H_recognition_only_gap"
text = "뜻을 보고 표현을 떠올리는 방향이 없으면 '짧은 요청문을 말한다' 목표에는 닿지 않는다"
source = "ai"
conditions = ["F_review_one_direction"]
harms = ["G_request"]
test_plan = "조사(research_evidence 3번 주제: 인식 vs 회상 방향) 근거로 먼저 판정. 그 뒤 사용자 실사용(여행에서 요청문을 말했나)"
note = "2026-10-22 AI 판단. 대가로 받아들일지 사용자 결정 대기"

# ---------- 규칙 ----------
[[rule]]
id = "R_decide_by_cases"
version = 1
status = "hypothesis"
method = "설계 결정마다 먼저 논리집을 보고, 없으면 잘 된 케이스(앱·수업·방법·연구)를 조사해 근거를 붙인 뒤 결정한다. 근거 없는 일반론은 결정 근거로 쓰지 않는다"
reason = "일반론은 근거 없이 그럴듯할 수 있고 실제 기록과 어긋난 적이 있다(본체 실험 v0 질문 3: '6~8번째 후보는 품질이 떨어진다'는 일반론이 실제 기록과 달랐다)"
serves = ["G_evidence"]
test_plan = "결정 기록마다 근거(조사 후보 번호·관찰·사실)가 붙어 있는지 센다. 근거 없이 내린 결정이 실사용에서 아쉬웠는지는 사용자 판정"
note = "사용자 2026-10-22 지시를 규칙으로 옮김"

