test_plan = "재생: 하루 복습 대기 수의 분포. 사용자 판정: 밀려서 열기 싫었던 날이 있었나"
note = "R_known_retest의 부작용. 상한을 두는 조건으로 받아들일지 사용자 결정 대기"

[[hypothesis]]
id = "H_app_only_gap"
text = "앱 단어 학습만으로는 문법·말하기 빈틈이 느껴져 보조 수단(짧은 강의·교재·회화 연습)이 필요해진다. 근거는 한국인 기록 1건이다"
source = "p12 후보 1·4·5 (약)"
conditions = ["S_zero_level"]
evidence = ["F_korean_cases"]
test_plan = "사용자 판정: 몇 주 뒤 '앱만으로 모자라다'고 느끼는가. 느끼면 그때 수업·교재 조사"

[[hypothesis]]
id = "H_hours_needed"
text = "앱 효과 보고는 수십 시간 누적 뒤의 측정이므로, 하루 분량이 작으면 여행 전까지 누적 시간을 기록하고 같은 방식의 측정을 주기적으로 해야 효과를 알 수 있다"
source = "p10 후보 12 (약)"
conditions = ["F_event_log_local"]
evidence = ["F_r_app_effects"]
test_plan = "이벤트 로그로 누적 학습 분을 세고, 2주마다 같은 20장 확인 카드로 정답률을 잰다"

# ---------- 규칙: 조사 근거로 제안하는 설계 결정 (모두 가설, 사용자 판정 대기) ----------
[[rule]]
id = "R_known_retest"
version = 1
status = "hypothesis"
method = "학습 카드에서 '알았음'을 누른 항목도 다음 날 복습 카드로 한 번 더 떠올려 판단하게 한다. 맞히면 완료, 틀리거나 헷갈리면 복습 흐름에 넣는다"
reason = "본 직후의 자기 판단은 과신하기 쉽고, 떠올리기와 정답 피드백이 장기 기억을 만든다"
serves = ["G_recognize"]
conditions = ["F_known_not_retested", "S_zero_level"]
evidence = ["F_r_feedback", "F_r_retrieval"]
side_effects = ["H_backlog_risk"]
test_plan = "재생: 알았음 항목의 다음 날 오답률(H_known_overconfident). 사용자 판정: 복습이 늘어 부담이었나"
note = "H_false_known_lost(audit 오류)를 고치는 제안. 받아들이면 앱 변경 뒤 F_known_not_retested를 새 사실로 갱신"

[[rule]]
id = "R_two_directions"
version = 1
status = "hypothesis"
method = "표지판·메뉴·교통 단어는 외국어를 보고 뜻을 떠올리는 카드로 복습하고, 요청문 패턴과 핵심 요청 표현은 뜻(장면)을 보고 외국어를 떠올리는 카드와 음성을 듣고 따라 말하는 선택 연습으로 따로 복습한다"
reason = "연습한 방향이 그 방향 시험에 남는다. 알아보기 목표와 말하기 목표는 방향이 다르다"
serves = ["G_recognize", "G_request"]
conditions = ["F_review_one_direction", "S_goal_travel"]
evidence = ["F_r_direction"]
test_plan = "사용자 판정: 여행에서 요청문을 말했나. 재생: 생산 방향 카드 정답률"
note = "H_recognition_only_gap(audit 오류)을 고치는 제안"

[[rule]]
id = "R_spacing_wider"
version = 1
status = "hypothesis"
method = "복습 간격을 맞힘 1회 1일 → 2회 3일 → 3회 7일 → 4회 14일 → 완료로 넓힌다. 틀리면 1일로 돌아간다. 헷갈림은 현재 간격 유지"
reason = "복습이 걸친 전체 기간이 길수록 장기 기억이 크다. 지금 간격(1·1·4일)은 전체 6일이라 여행까지 몇 주를 남기기엔 짧다"
serves = ["G_recognize"]
conditions = ["F_review_intervals", "S_goal_travel"]
evidence = ["F_r_spacing"]
test_plan = "재생으로 두 간격표를 비교(H_spacing_total_span). 사용자 판정"
note = "숫자(3·7·14)는 근거가 약하고 '전체 기간을 넓힌다'는 방향만 근거가 강하다. 여행까지 남은 기간에 맞춰 조정한다"

[[rule]]
id = "R_scene_units"
version = 1
status = "hypothesis"
method = "일본어 단어 158개를 여행 장면 유닛(식당·식권기, 역·열차, 편의점·상점·계산, 숙소, 길 묻기·화장실, 긴급·건강)으로 나눠 식당·역·상점을 앞에 두고, 유닛마다 읽기 단어와 말하기 문장(패턴)을 짝지어 넣는다. 지금의 범주 10개를 장면으로 재배치한다"
reason = "불편이 식당·역·상점에 몰려 있고, 장면 단위로 묶으면 그 자리에서 읽기와 말하기가 같이 떠오른다"
serves = ["G_use_in_japan"]
conditions = ["F_units_are_sets", "S_goal_travel"]
evidence = ["F_travel_scenes", "F_travel_convenience_store"]
test_plan = "사용자 판정: 여행 뒤 장면별 '쓸 수 있었다'. 데이터 재배치는 내장 DB의 category·tags를 장면으로 매핑해 한다"

[[rule]]
id = "R_kana_plan"
version = 1
status = "hypothesis"
method = "가나는 행 단위로 배우되 (1) 모양이 비슷한 쌍을 같은 묶음에 섞고 (2) 글자마다 한 줄 연상(소리 비슷한 한국어 낱말·짧은 장면)과 획순을 붙이며 (3) 소리를 듣고 글자를 고르는 문항을 섞고 (4) 가타카나 장음·촉음 규칙과 메뉴 외래어 읽기를 첫 주에 넣는다. 탁음·요음은 기본음 뒤에 데이터로 보탠다"
reason = "비슷한 항목 섞기는 구별을 키우고, 연상은 모양과 소리가 안 이어지는 글자에 효과가 있고, 객관식만으로는 떠올리는 힘이 안 생기며, 메뉴는 가타카나가 많다"
serves = ["G_recognize"]
conditions = ["F_kana_same_flow", "F_kana_basic_only", "S_zero_level"]
evidence = ["F_r_interleave", "F_r_mnemonic", "F_apps_mcq", "F_travel_convenience_store"]
test_plan = "재생: 비슷한 쌍 혼동률, 첫 주 정답률. 사용자 판정: 2주 안에 메뉴를 읽을 수 있었나"
note = "(4)는 근거가 약하다(H_katakana_rules_early). 연상 문구는 데이터 작업이라 R_data_review와 같이 한다"

[[rule]]
id = "R_daily_habit"
version = 1
status = "hypothesis"
method = "첫 실행 때 '언제·어디서' 한 문장을 정하게 하고 그 시각에 알림 한 번. 하루 최소 분량은 복습 완료(없으면 새 항목 1개)로 작게 두고 연속 기록은 그 기준으로 센다. 하루 빠지면 보호 1회. 빠진 뒤 복귀 화면은 지난 기록을 따지지 않고 가장 짧은 단위로 시작한다"
reason = "실행 의도와 알림 한 번은 상황 신호를 만들고, 작은 최소 분량과 보호는 하루 실패가 전체 손실로 번지지 않게 한다"
serves = ["G_system"]
conditions = ["F_no_reminder", "F_streak_from_log"]
evidence = ["F_r_implementation_intention", "F_r_streak", "F_r_habit_days"]
test_plan = "재생: 주당 학습일 수, 빠진 다음 날 복귀율. 사용자 판정: 압박인가 도움인가"
note = "홈의 가짜 '최고 기록'(현재 연속 일수+6)은 실제 최고 기록으로 바꾼다(F_streak_from_log)"

[[rule]]
id = "R_backlog_cap"
version = 1
status = "hypothesis"
method = "하루 복습 상한(처음엔 30개)을 두고 넘으면 그날 새 학습을 멈추고 복습만 하게 한다. 쌓인 수가 보이게 한다"
reason = "밀린 복습이 포기의 주된 이유라는 보고가 많다"
serves = ["G_system"]
conditions = ["F_known_not_retested"]
evidence = ["F_apps_review_backlog"]
test_plan = "재생: 복습 대기 수 분포. 사용자 판정"
note = "R_known_retest를 받아들일 때 함께 넣는 조건(H_backlog_risk의 대가 관리)"

[[rule]]
id = "R_patterns_reading"
version = 1
status = "hypothesis"
method = "문장 패턴 12개에 읽기(가나)와 로마자를 넣고 TTS로 읽어 준다. 패턴의 빈칸에 들어갈 단어를 장면 유닛의 단어와 잇는다"
reason = "가나를 모르는 학습자는 한자가 섞인 패턴을 읽을 수 없어 말하기 연습이 막힌다"
serves = ["G_request"]
conditions = ["F_patterns_no_reading", "S_zero_level"]
test_plan = "데이터 갱신 뒤 사실 F_patterns_no_reading을 새 사실로 갱신. 사용자 판정: 패턴을 소리 내어 말할 수 있었나"

[[rule]]
id = "R_data_review"
version = 1
status = "hypothesis"
method = "내장 데이터(단어 158·예문 158·패턴 12·연상 문구)를 원어민이나 신뢰 자료(교재·사전)와 대조해 검토한 기록을 남긴 뒤 쓴다. 검토 전에는 각 항목에 '검토 전' 표시를 둔다"
reason = "생성된 씨드 데이터는 오류가 섞일 수 있고, 여행에서 틀린 표현은 바로 드러난다"
serves = ["G_use_in_japan"]
conditions = ["F_data_generated_unreviewed"]
test_plan = "검토 기록(항목 수·고친 수)이 생기면 사실을 갱신. 사용자 판정: 여행에서 통하지 않은 표현이 있었나"

