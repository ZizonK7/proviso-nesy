[[hypothesis]]
id = "H_daily_anchor"
text = "공부할 시각과 장소를 한 문장으로 정해 두고 그 시각에 알림을 한 번만 주면 빠지는 날이 준다. 알림이 잦으면 부정 감정이 는다"
source = "p14 후보 4·5 (강/중)"
