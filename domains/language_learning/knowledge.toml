text = "듣기 속도: 대만 중학생 66명(초급 수준 시험, 2023, 초록)에서 보통 116 wpm → 98 wpm으로 조금 낮추면 이해가 올랐고 58 wpm까지 낮추면 차이가 없었다. 속도만 바꾸는 것은 효과가 없다는 연구도 있다(Blau, 요약). 정형 표현이 있으면 듣기의 단어 식별이 쉬워지며 효과는 텍스트 난이도·학습자 수준에 따라 다르다(LTR 2020, 초록). 점원 질문 같은 짧은 정형 발화를 직접 훈련한 연구는 찾지 못했다"
