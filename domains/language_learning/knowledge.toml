[[hypothesis]]
id = "H_kanji_minimal"
text = "한자는 역·출구·입구·화장실·인원·가격 같은 반복 표지 단어 몇 개만 익히고 나머지는 그림·영어 병기·번역기에 맡긴다. 한자가 갑자기 많아지는 단계가 한국인 독학의 포기 지점이었다"
