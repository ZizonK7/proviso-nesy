note = "v1(당일→1→3→7→14)에서 더한 조건: S_simple_review — 사용자 의도대로 단계를 줄이고 여행 전 점검으로 대신했다. 결정 2026-10-22(AI, 사용자 위임): 채택"

[[rule]]
id = "R_daily_session"
version = 1
status = "hypothesis"
method = "하루 한 세션 = 밀린 복습(최대 30) → 새 줄 5개(점원 줄은 듣고 고르기, 손님 줄은 듣고 따라 말하기 3~5회 뒤 뜻 보고 말하기) → 당일 재확인(새 줄 5개를 한 번 더) → 결과 한 줄. 목표 10~15분. 복습이 상한을 넘으면 새 줄을 쉰다. 쉐도잉 묶음은 30초 분량을 넘기지 않는다"
reason = "초급 쉐도잉 연구가 매일 10분 고정에서 효과를 봤고, 하루 5개는 지금 앱의 단위이며, 당일 재확인은 떠올리기 횟수를 공짜로 하나 더한다"
serves = ["G_system", "G_request"]
conditions = ["F_session_5_ordered", "S_simple_review"]
