[[fact]]
id = "F_ui_patterns"
text = "화면 역할 12개를 실제 화면으로 확인(작업자가 스토어 스크린샷 61장과 Duolingo 공식 블로그 캡처 9장을 파일로 받아 직접 봄, 앱 7개: Duolingo·Memrise·Busuu·AnkiDroid·Mondly·Speak·말해보카. 말해보카 그림은 홍보 합성 목업이라 '강' 계산에서 뺌. 그 전 v2의 글 근거: 스토어 설명 6, Android Compose 공식 문서 6, 개인 블로그 화면 설명 9). '강' = 실제 캡처 3앱 이상이 같은 패턴. (1) 홈 강: 맨 위에 오늘 할 양·연속 숫자, 아래 다음 행동 버튼(Busuu 일일 6/20분+요일 체크+'다음 레슨', Mondly 단원 막대+🔥4 DAYS, AnkiDroid '52개 카드 예정 24 min', Speak 🔥31+롤플레이 시작). 홈 모양은 Duolingo만 경로형, Busuu·Mondly·Anki·Speak는 목록형. (2) 레슨 진행 중: 상단 얇은 막대+숫자(Duolingo 'N번 연속 정답'+하트, Mondly 막대+별). (3) 카드 강: 정답을 바로 주지 않고 입력·선택을 먼저 받은 뒤 차이를 색으로 비교(AnkiDroid 입력→글자별 색 비교→버튼 3개에 다음 간격 '<1 min/<10 min/4 d', Duolingo 선택→하단 시트 '참 잘했어요! 의미', Busuu 선택+전구 힌트). (4) 말하기 입력 강: 하단 중앙 큰 마이크 또는 '탭하여 말하기'(Duolingo·Memrise·Mondly, +Speak·말해보카). 말하기 비교 중: 내 문장↔교정 문장 위아래 비교+설명(Speak 1앱). 녹음 점수 화면 0장. (5) 역할극 강: 맨 위 목표 칩('직원에게 여기 처음 왔다고 말해보세요')→말풍선→응답 칩/마이크→힌트(Speak, Mondly, Duolingo 공식 'Buy some fruit at the bodega'). (6) 듣기 강: 재생 버튼+구간 막대, 느린 재생(Duolingo 거북 버튼)·자막(Memrise)(Busuu·Memrise·Speak·Duolingo). (7) 복습 중: 판단 버튼·태그에 다음 복습 시점(AnkiDroid, 말해보카 목업 '1일 뒤·3주 뒤·1개월 뒤'), 복습 대상 모으기 '학습한·들은·사용한 단어' 3칸(Memrise)·덱별 예정 수(AnkiDroid). (8) 온보딩 중: 한 화면에 질문 하나, 목표 카드 4개(Memrise 자기주도·시험·회화·Travel, Busuu 언어 질문, Duolingo 과정 목록). 날짜·시간 입력 화면 0장. (9) 완료 중: 'Lesson Complete! +10 XP'+막대, 7일 연속 축하(요일 칩 7개)(Duolingo 공식), '+553 포인트' 카드(Mondly). (10) 복귀: 연속 숫자·보호 장치(Duolingo Streak Freeze '하루 보호 5/5', Mondly, Speak)는 중이나 끊긴 뒤 돌아온 화면은 0장(약). (11) 알림·설정 중: 알림 종류 목록+토글(Duolingo 공식 Reminders·Friends·Leaderboards·Announcements, AnkiDroid 메뉴+야간 모드 토글). 알림 시각 설정 화면 0장. (12) 오류·빈 상태 약: 0장. Material 3 공식(Android Compose 문서): 하단 탭 3~5개, Linear progress, Card, Dialog, Snackbar, Button 5종"
checked = 2026-10-22
source = "p25 v2·v3·v4(p28) 후보 1–14, 가져올 패턴 목록 — 스크린샷·공식 캡처 70장 직접 확인, 공식 문서, 개인 블로그. 강도 강(홈·카드·말하기 입력·역할극·듣기) / 중(진행·복습·온보딩·완료·연속 기록·알림 목록·말하기 비교) / 약(복귀 화면·오류·알림 시각·녹음 점수)"

[[observation]]
id = "O_scope_batch9"
text = "배치 9(클라우드 searching 세션, Haiku 5.5): 유용했던 곳 — NHK Easy Japanese 레슨 페이지(대본·MP3·이용 안내), J-STAGE 본문 PDF(_pdf/-char/ja), 지자체·국토교통성 PDF, Android 개발자 Compose 컴포넌트 페이지(m3.material.io 대신), 앱 공식 페이지(일본어 지원 확정), PubMed·ERIC·Semantic Scholar API 초록, m.blog.naver.com 화면 설명 글. 정보가 없던 곳 — 레슨 안 재등장 vs 별도 복습 비교 연구, 대화 앱 말하기 효과의 메타분석·무작위 연구, Pimsleur 독립 연구, 짧은 준비 뒤 여행 결과의 한국인 사례, 앱 스크린샷(alt 텍스트가 일반 문구뿐), 완료·설정·오류 화면 원문, 식당 입장 인원 말·면세 점원 말 원문. 막힌 곳 — Google Scholar 403(세션에 따라 다름), OUP·Cloudflare 저장소(Webb 2007·Joe 1998·Pellicer-Sánchez 2010), JF 사이트 502/503·Can-do 로그인, irodori 본 사이트 502, JapanesePod101 403, Mondly 405, pageflows·uxarchive 403, m3.material.io(JS), Glossika notion(JS). 1차 보고서는 생성 3~4분 만에 와서 원문 0~3건이었고, 원문 최소 수·구체 주소를 적은 이어서 지시(v2·v3)로 20~28건까지 올랐다"
source = "research (p22–p27)"
date = 2026-10-22

[[hypothesis]]
id = "H_scene_dialogue_units"
text = "학습 단위를 단어 묶음이 아니라 '장면 대화'(점원 말 → 손님 답의 줄 3~8개)로 두면, 여행 때 그 자리에서 들을 말과 할 말이 함께 떠오른다"
source = "ai"
conditions = ["S_conversation_first", "S_goal_travel", "F_units_are_sets"]
evidence = ["F_travel_scenes", "F_travel_scripts", "F_apps_speaking_loop", "F_r_no_inlesson_vs_separate"]
against = ["F_r_pimsleur_no_study"]
test_plan = "사용자 판정: 여행 뒤 장면별로 '들렸다/말했다'. 재생: 장면별 줄의 복습 정답률"
note = "Duolingo의 '의사소통 목표 공유' 설계와 いろどり의 과당 Can-do 구조가 같은 방향이나 효과 측정은 없다 — 조각 수준의 근거(장면·정형 질문)는 강"

[[hypothesis]]
id = "H_speak_loop"
text = "손님 줄은 '뜻을 보고 소리 내어 말하기 → 공개·음성 비교 → 자기 판정 → 간격 뒤 같은 줄 다시 말하기' 고리로 익히면 혼자서도 첫 주에 말할 수 있다"
source = "ai"
conditions = ["S_conversation_first", "S_solo_app", "S_zero_level"]
evidence = ["F_apps_speaking_loop", "F_r_retrieval", "F_r_feedback", "F_r_direction", "F_r_shadowing_beginner"]
against = ["F_r_ai_speaking_anxiety"]
test_plan = "재생: 말하기 줄의 자기 판정 '됐다' 비율 추이(1주·2주). 사용자 판정: 여행에서 말이 나왔나"
note = "골격은 앱 13곳 공통(설계 근거). 효과의 직접 근거는 없고 떠올리기·방향성·초급 쉐도잉 연구가 간접 근거. against는 '독립 연구 없음'을 가리킨다"

[[hypothesis]]
id = "H_listen_only_lines"
text = "점원·역무원 말은 말하기를 요구하지 않고 '듣고 → 뜻이나 답을 고르기'만 시키면, 적은 시간으로 정형 질문에 답할 수 있게 된다"
source = "ai"
conditions = ["S_conversation_first", "F_travel_scripts"]
evidence = ["F_r_direction", "F_travel_short_answers", "F_travel_convenience_store"]
test_plan = "재생: 듣기 줄의 정답률과 반복 횟수. 사용자 판정: 점원 질문이 들렸나"
note = "연습한 방향이 남는다는 근거를 듣기에 적용한 것. 정형 표현은 듣기의 단어 식별을 돕지만(F_r_speech_rate) 점원 질문을 직접 훈련한 연구는 없다(p22 v2)"

[[hypothesis]]
id = "H_slightly_slow_tts"
text = "점원 줄의 음성을 보통보다 조금(약 15%) 느리게 시작해 보통 속도로 올리면 알아듣기가 늘고, 너무 느리게(절반)는 이득이 없다"
source = "p22 후보 9 (약)"
conditions = ["F_tts_builtin", "S_zero_level"]
evidence = ["F_r_speech_rate"]
against = ["F_r_speech_rate"]
test_plan = "재생: 속도별 듣기 정답률. 사용자 판정: 실제 점원 속도에서 들렸나"
note = "중학생 1편 초록. 속도만 바꾸면 효과 없다는 반대 보고가 있어 양쪽에 적었다"

[[hypothesis]]
id = "H_frame_slot_reuse"
text = "손님 줄을 틀(「○○、お願いします」 등)과 슬롯(鍵·チェックイン·○○駅)으로 쪼개 두면, 같은 틀이 새 장면마다 다른 슬롯으로 다시 나와 '배운 것을 다시 써먹는' 구조가 되고 단어 카드를 섞지 않아도 재등장이 생긴다"
source = "ai"
conditions = ["F_travel_short_answers", "S_conversation_first"]
evidence = ["F_r_webb_generation", "F_r_interleave", "F_r_no_inlesson_vs_separate"]
against = ["F_r_no_inlesson_vs_separate"]
test_plan = "재생: 같은 틀의 두 번째 장면 정답률이 첫 장면보다 높은가. 사용자 판정: 새 장면에서 틀이 바로 나왔나"
note = "직접 비교 연구가 없어 against에도 같은 사실을 적었다. 생성 과제는 시간을 짧게(Webb 2005)"

[[hypothesis]]
id = "H_separate_review_primary"
text = "재등장의 기본은 별도 복습 세션(간격)이고, 레슨 안 재등장은 같은 장면의 옛 줄 2~3개로 제한해야 한다. 단어 슬롯은 섞지 않는다"
source = "ai"
conditions = ["F_units_are_sets", "S_simple_review"]
evidence = ["F_r_hlr", "F_r_spacing", "F_r_interleave", "F_r_no_inlesson_vs_separate"]
test_plan = "재생: 레슨 안 재등장 있음/없음 두 조건의 1주 뒤 떠올리기 정답률(앱 안 A/B). 사용자 판정: 레슨이 길어졌나"

[[hypothesis]]
id = "H_review_1_7_trip"
text = "당일 세션 끝 재확인 → 1일 → 7일 → 여행 전 점검(출발 7일 안에 한 번)의 떠올리기 4회로도 여행 시점에 기억이 남고, 사용자가 바란 단순한 구조를 지킨다"
source = "ai"
conditions = ["S_simple_review", "S_goal_travel", "F_review_intervals"]
evidence = ["F_r_spacing", "F_r_hlr"]
against = ["F_r_spacing"]
test_plan = "재생: 7일 복습과 여행 전 점검의 정답률. 사용자 판정: 여행에서 떠올랐나. 틀리면 14일 단계를 더한다"
note = "F_r_spacing은 5회가 가장 좋았다고 하므로 against에도 둔다. 1·1·4일(3회)보다는 전체 기간이 길다"

[[hypothesis]]
id = "H_shadow_short_daily"
text = "하루 10분 안쪽으로 30초 분량 줄 묶음을 1회 듣고 5회 따라 말하는 것이 초급에서 말하기·듣기 점수를 올린다"
source = "p27 후보 13 (중)"
conditions = ["S_zero_level", "S_solo_app"]
evidence = ["F_r_shadowing_beginner", "F_r_asr_meta"]
against = ["F_r_shadowing_beginner"]
test_plan = "재생: 쉐도잉 횟수와 다음 날 말하기 자기 판정. 사용자 판정: 따라 말하기가 부담이었나"
note = "통제군 없는 연구(下薗)와 차이 없음 연구(布袋)가 같이 있어 양쪽에 적었다"

[[hypothesis]]
id = "H_asr_not_first"
text = "음성 인식 채점은 첫 버전에 넣지 않아도 된다 — 혼자 연습에서 효과가 불확실하고 과교정 불만이 반복되며, '상대가 알아들었는가'는 여행에서 판정된다. 자기 판정 + 음성 비교로 시작한다"
source = "ai"
conditions = ["S_solo_app", "S_zero_level"]
evidence = ["F_r_asr_meta", "F_apps_speaking_loop", "F_ui_patterns"]
against = ["F_r_asr_meta"]
test_plan = "사용자 판정: 여행에서 못 알아들은 말이 발음 때문이었나. 그러면 안드로이드 음성 인식(SpeechRecognizer)으로 2차에 넣는다"
note = "전체 g=0.69는 ASR 쪽이지만 혼자 연습 g=0.44(CI에 0)와 초보 연구 2편이 조건이다"

[[hypothesis]]
id = "H_hint_interval"
text = "힌트를 쓴 카드는 맞혀도 짧은 간격(당일·1일)으로 돌리면, '알았음' 과신을 줄이면서 복습 수를 크게 늘리지 않는다"
source = "p25 후보 8 (중)"
conditions = ["F_known_not_retested"]
evidence = ["F_ui_patterns", "F_r_feedback"]
test_plan = "재생: 힌트 사용 카드의 다음 복습 정답률"
note = "말해보카 독립 후기 2건의 설계. 효과 근거는 없다"

[[hypothesis]]
id = "H_kana_side_track"
text = "가나를 대화 트랙과 분리된 보조 트랙(가타카나 음식·메뉴 먼저, 하루 몇 글자)으로 두면 대화 진도를 막지 않으면서 메뉴 읽기 병목을 줄인다"
source = "ai"
conditions = ["S_conversation_first", "F_kana_same_flow"]
evidence = ["F_travel_prepared_cases", "F_korean_cases", "F_r_mnemonic"]
against = ["F_travel_prepared_cases"]
test_plan = "재생: 보조 트랙 진도와 대화 트랙 진도의 상관. 사용자 판정: 메뉴를 읽었나, 가나가 부담이었나"
note = "against: 준비 뒤 여행 사례 2건은 가타카나가 병목이었다고 하므로 '보조'로 미루는 것이 틀릴 수 있다"

[[rule]]
id = "R_scene_units_v2"
version = 2
status = "hypothesis"
method = "학습 단위를 여행 장면 대화로 바꾼다. 장면(편의점 계산, 식당 입장·주문·계산, 역·열차·길 묻기, 호텔, 택시, 쇼핑·면세, 약국·긴급) 하나에 줄 3~8개를 두고, 줄마다 종류를 붙인다: 점원 줄(알아듣기만), 손님 줄(말하기, 틀+슬롯), 읽기 줄(메뉴·표지의 가타카나·한자 몇 개). 순서는 불편 순위(식당 → 역 → 편의점·상점 → 숙소 → 택시·길 → 약국·긴급)로 두되 첫 장면은 가장 짧은 답(はい／大丈夫です／ないです)이 나오는 편의점으로 시작한다. 기존 단어 158개는 장면의 슬롯 단어로 재배치한다"
reason = "불편은 식당·역·소매에 몰리고(설문 3개년), 그 자리에서 오가는 말은 점원의 긴 정형 질문과 손님의 짧은 답으로 모양이 정해져 있다(원문 대본). 단어 묶음으로 배우면 들을 말과 할 말이 따로 떠오른다"
serves = ["G_use_in_japan", "G_request"]
conditions = ["F_units_are_sets", "S_goal_travel", "S_conversation_first"]
evidence = ["F_travel_scenes", "F_travel_scripts", "F_travel_short_answers", "F_apps_speaking_loop"]
against = ["F_r_no_inlesson_vs_separate"]
test_plan = "사용자 판정: 여행 뒤 장면별 '들렸다/말했다'. 재생: 장면별 줄 정답률(H_scene_dialogue_units)"
note = "v1(단어를 장면 유닛으로 재배치)에서 더한 조건: S_conversation_first — 단어가 아니라 대화 줄이 단위가 됐다. 결정 2026-10-22(AI, 사용자 위임): 채택"

[[rule]]
id = "R_two_directions_v2"
version = 2
status = "hypothesis"
method = "줄 종류가 연습 방향을 정한다. 점원 줄: 듣기 → 뜻 고르기 또는 '뭐라고 답할까' 고르기 → 정답 음성 다시 듣기(말하기 요구 없음). 손님 줄: 처음 배울 때 듣고 따라 말하기 3~5회(쉐도잉) → 복습에서는 한국어 뜻·장면을 보고 소리 내어 말하기 → 일본어·음성 공개 → 자기 판정(됐다/막혔다). 읽기 줄: 일본어를 보고 뜻·소리 떠올리기. 한 항목을 양방향으로 묻지 않는다. 점원 줄 음성은 처음엔 보통보다 조금 느리게(TTS 속도 약 0.85) 들려주고 두 번째 맞힌 뒤 보통 속도로"
reason = "연습한 방향이 그 방향 시험에 남는다. 여행에서 점원 말은 듣기만, 손님 말은 말하기만 필요하므로 방향을 하나씩 정해 시간을 아낀다"
serves = ["G_request", "G_recognize"]
conditions = ["F_review_one_direction", "S_goal_travel", "S_conversation_first"]
evidence = ["F_r_direction", "F_apps_speaking_loop", "F_r_shadowing_beginner", "F_travel_short_answers", "F_r_speech_rate", "F_r_formulaic_chunks"]
side_effects = ["H_asr_not_first", "H_slightly_slow_tts"]
test_plan = "사용자 판정: 여행에서 점원 질문이 들렸나, 요청문을 말했나. 재생: 종류별 정답률(H_speak_loop, H_listen_only_lines)"
note = "v1(단어는 일→뜻, 요청문은 뜻→일 + 따라 말하기)에서 더한 조건: S_conversation_first — 방향을 '항목 종류'에 붙였다. H_recognition_only_gap을 고치는 결정. 결정 2026-10-22(AI, 사용자 위임): 채택"

[[rule]]
id = "R_frame_slot"
version = 1
status = "hypothesis"
method = "손님 줄은 틀과 슬롯으로 저장한다(틀 「○○、お願いします」, 슬롯 鍵·チェックイン·○○駅…). 틀은 처음 나온 장면에서 배우고, 다음 장면에서는 같은 틀에 새 슬롯만 넣어 말하게 한다(빈칸은 슬롯 하나, 항목당 10초 안쪽). 슬롯 단어는 장면별로 몰아서 배우고 섞지 않는다. 틀의 복습 성적은 틀 하나로 모은다"
reason = "손님 말은 몇 개의 틀로 수렴하므로(원문 대본), 틀이 새 장면에서 다시 나오면 '배운 것을 다시 써먹는' 구조가 저절로 생긴다. 단어를 섞으면 불리하고(g=−0.39) 생성 과제는 시간을 짧게 줄 때만 유리하다"
serves = ["G_reuse", "G_request"]
conditions = ["F_travel_short_answers", "S_conversation_first"]
evidence = ["F_r_interleave", "F_r_webb_generation", "F_travel_scripts"]
against = ["F_r_no_inlesson_vs_separate"]
test_plan = "재생: 같은 틀의 둘째 장면 첫 시도 정답률(H_frame_slot_reuse). 사용자 판정"
note = "결정 2026-10-22(AI, 사용자 위임): 채택. 데이터 구조: line(kind, frame_id, slot_id, scene_id)"

[[rule]]
id = "R_reuse_structure"
version = 1
status = "hypothesis"
method = "다시 써먹기는 세 겹으로 한다. (1) 별도 복습 세션이 기본: 모든 줄이 간격표(R_spacing_wider_v2)를 탄다. (2) 레슨 안 재등장은 소량: 새 장면 대화에 이전 장면의 틀 1~2개와 인사·감사 줄을 넣되 옛 줄은 2~3개를 넘기지 않는다. (3) 종합 역할극: 장면을 셋 이상 끝내면 장면을 섞은 역할극(점원 줄을 듣고 손님 줄을 말하기)을 주 1회 내고, 여행 전 점검에서 전체를 한 번 돈다. 레슨 안 재등장 있음/없음을 설정으로 바꿀 수 있게 해 효과를 잰다"
reason = "원문 근거가 있는 것은 별도 간격 복습이고, 레슨 안 재등장은 설계 사례만 있다. 그래서 기본은 복습 세션, 재등장은 소량으로 두고 앱 안에서 직접 잰다. 장면 그림과 짝지은 섞기(역할극)는 근거가 있다"
serves = ["G_reuse"]
conditions = ["S_simple_review", "F_units_are_sets"]
evidence = ["F_r_hlr", "F_r_spacing", "F_r_no_inlesson_vs_separate", "F_r_interleave", "F_irodori_structure"]
test_plan = "재생: 재등장 있음/없음 조건의 1주 뒤 정답률(H_separate_review_primary). 사용자 판정: 레슨이 길어졌나"
note = "결정 2026-10-22(AI, 사용자 위임): 채택. 사용자 목표 G_reuse의 구현"

[[rule]]
id = "R_spacing_wider_v2"
version = 2
status = "hypothesis"
method = "간격표: 학습 당일 세션 끝 재확인 1회 → 1일 → 7일 → 여행 전 점검(출발 7일 안에 한 번) → 완료. '알았음'도 1일 복습을 한 번 받는다. 틀리면 1일로 돌아가고, 헷갈림·힌트 사용은 현재 단계 유지. 여행 날짜가 7일보다 가까우면 남은 단계를 여행 전 점검 하나로 합친다. 하루 복습 상한 30(R_backlog_cap)"
reason = "사용자는 1일·7일의 단순한 구조를 바라고, 연구는 간격 모양보다 전체 기간과 횟수를 본다. 1·1·4일(3회, 6일)보다 기간이 길고 횟수는 4회로 5회에 가깝다. 여행 전 점검은 기억을 여행 시점에 맞춘다"
serves = ["G_recognize", "G_request"]
