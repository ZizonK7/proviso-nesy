[[hypothesis]]
id = "H_katakana_rules_early"
text = "메뉴·간판 읽기가 목표면 가타카나와 장음·촉음 규칙, 음식 외래어를 히라가나와 같은 때(또는 앞)에 익히는 쪽이 첫 주부터 읽기가 된다. 준비 뒤 여행한 사례 2건이 모두 가타카나 부족을 음식 장면의 병목으로 꼽았다"
