# ---------- 규칙: 조사 근거로 제안하는 설계 결정 (모두 가설, 사용자 판정 대기) ----------
[[rule]]
id = "R_known_retest"
version = 1
status = "hypothesis"
method = "학습 카드에서 '알았음'을 누른 항목도 다음 날 복습 카드로 한 번 더 떠올려 판단하게 한다. 맞히면 완료, 틀리거나 헷갈리면 복습 흐름에 넣는다"
reason = "본 직후의 자기 판단은 과신하기 쉽고, 떠올리기와 정답 피드백이 장기 기억을 만든다"
