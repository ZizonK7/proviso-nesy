# ---------- 사실: 연구·사례 근거 (검색 요약 기준) ----------
[[fact]]
id = "F_r_retrieval"
text = "떠올리기(인출 연습)는 다시 읽기보다 장기 기억에 낫다. 메타분석 g=0.50(Rowland 2014, 효과 크기 159개), 교실 메타분석 g=0.499(222편), 단어 쌍 실험 1주 뒤 80% vs 36%(Karpicke & Roediger 2008). Dunlosky 2013 리뷰에서 인출 연습과 분산 연습만 '높음' 등급. 피드백이 있으면 인출 효과가 g=0.73으로 없을 때(0.39)의 거의 두 배"
checked = 2026-10-22
source = "p10 후보 2·3·11 — 메타분석·통제 연구, 원문 확인(전문·초록). 강도 강"

[[fact]]
id = "F_r_spacing"
text = "복습 사이 간격을 두면 장기 기억이 커진다(Cepeda 2006 메타분석 271건: 간격 둠 47.3% vs 몰아서 36.7%; 간격 둔 인출 g=0.74, Latimier 2021; 간격 긴 반복 인출이 짧은 것보다 약 200% 향상, Karpicke & Bauernschmidt 2011). 확장 간격과 고정(균등) 간격의 차이는 없다(Latimier g=0.03, Cepeda p=.61, Nakata 2015의 작은 이득은 수용 시험에만). 복습이 걸친 전체 기간이 길수록, 그리고 인출 횟수가 많을수록(5회가 가장 좋았고 4주 뒤에도 남음) 효과가 크다"
checked = 2026-10-22
source = "p10 후보 1·13, p14 후보 14 — 메타분석·통제 연구, 원문 확인(전문·초록; Kim & Webb 2022 g≈0.40은 2차 인용만). 강도 강"

[[fact]]
id = "F_r_direction"
text = "외국어를 보고 뜻을 알아보기(수용)는 뜻을 보고 외국어를 떠올리기(생산)보다 쉽고, 연습한 방향이 그 방향 시험에 더 잘 남는다. 같은 시간이면 수용 과제가, 시간을 충분히 쓰면 생산 과제가 전체 지식에 유리하다(Webb 2005 실험 1·2). 두 방향의 차이는 빈도가 낮은 단어에서 더 크다"
checked = 2026-10-22
source = "p10 후보 4 — 통제 실험(한국어·일본어 학습자 대상 아님), 초록 원문 확인. 강도 중"

[[fact]]
id = "F_r_interleave"
text = "섞어 배우기(interleaving)는 자료 종류에 따라 반대로 간다. 그림·시각 자료의 범주 구별에서는 섞기가 중간 크기로 낫지만(Brunmair & Richter 2019 메타분석 전체 g≈0.42), 단어 자료에서는 몰아서 배우기가 낫다(같은 메타분석, g=−0.39). 글자 모양 구별에 대한 직접 근거는 없다"
checked = 2026-10-22
