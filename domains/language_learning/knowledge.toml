# 접근: 이 세션의 네트워크 정책이 원문 열기를 막아 전부 '검색 요약만'(위키백과 2차 자료 일부만 열어 읽음). 서지(저자·연도·학술지)의 실재는
# 메인이 아는 범위에서 확인했고 원문 수치는 미확인이다 — 원문을 연 뒤 note를 고친다. 근거 강도: 강(메타분석·통제 연구) / 중 / 약.
