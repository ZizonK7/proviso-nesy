# ---------- 사실: 연구·사례 근거 (검색 요약 기준) ----------
[[fact]]
id = "F_r_retrieval"
text = "떠올리기(인출 연습)는 다시 읽기보다 장기 기억에 낫다. 메타분석 평균 효과 g≈0.50(Rowland 2014), Dunlosky 2013 학습법 리뷰에서 인출 연습과 분산 연습만 '높음' 등급. 정답 피드백을 같이 줄 때 효과가 더 크다"
checked = 2026-10-22
source = "p10 후보 2·3 — 메타분석·리뷰, 검색 요약만(원문 미열람). 강도 강"

[[fact]]
id = "F_r_spacing"
text = "복습 사이 간격을 두면 장기 기억이 커진다(Cepeda 2006 메타분석; Latimier 2021 g≈0.74; Kim & Webb 2022 제2언어 메타분석 중간~큰 효과). 확장 간격과 고정 간격의 차이는 작거나 엇갈리고(Karpicke & Bauernschmidt 2011, Nakata 2015·2018), 복습이 걸친 전체 기간이 길수록 효과가 크다"
checked = 2026-10-22
source = "p10 후보 1, p14 후보 14 — 메타분석, 검색 요약만. 강도 강(간격 자체) / 중(확장 vs 고정)"

[[fact]]
id = "F_r_direction"
text = "외국어를 보고 뜻을 알아보기(수용)는 뜻을 보고 외국어를 떠올리기(생산)보다 쉽고, 연습한 방향이 그 방향 시험에 더 잘 남는다. 두 방향의 차이는 빈도가 낮은 단어에서 더 크다"
checked = 2026-10-22
source = "p10 후보 4 — 통제 실험(한국어·일본어 학습자 대상 아님), 검색 요약만. 강도 중"

[[fact]]
id = "F_r_interleave"
text = "서로 비슷한 항목을 섞어 연습하면 몰아서 연습할 때보다 나중 구별을 더 잘한다. 메타분석 전체 g≈0.42(Brunmair & Richter 2019). 어휘 전용 근거는 적고 효과는 항목 종류·사전 지식에 따라 크게 다르다"
checked = 2026-10-22
source = "p10 후보 5 — 메타분석, 검색 요약만. 강도 중"

[[fact]]
id = "F_r_mnemonic"
text = "소리가 비슷한 모국어 낱말로 뜻을 잇는 키워드 기억술은 초기 회상을 높였으나 효과가 짧다는 정리가 있다. 글자에 그림·짧은 장면을 붙이는 연상은 형태와 뜻이 잘 안 이어지는 글자에서 효과가 있었다는 소규모 결과가 있고, 긴 이야기형은 피하는 쪽이 낫다"
checked = 2026-10-22
source = "p10 후보 6, p11 후보 10·11 — 오래된 통제 실험·소규모 연구·학습자 평, 검색 요약만. 강도 중(어휘) / 약(문자)"

[[fact]]
id = "F_r_feedback"
text = "정답을 바로 보여 주면 틀린 답을 고칠 뿐 아니라 확신 없이 맞힌 답도 더 오래 남는다. 자기 판단(알았음/몰랐음)은 방금 본 직후보다 잠시 뒤 떠올린 뒤에 할 때 실제 기억과 더 잘 맞는다(지연 판단 효과, 해석은 논쟁 중)"
checked = 2026-10-22
source = "p10 후보 11 — 메타분석·통제 연구(일반 상식 문제·대학생 대상), 검색 요약만. 강도 중"

[[fact]]
id = "F_r_batch_size"
text = "한 번에 배우는 묶음 크기보다 같은 단어를 다시 만나는 간격이 기억을 가른다(간격을 같게 두면 묶음 크기 차이가 사라짐). 하루 몇 개가 적당한지에 대한 실험 근거는 없다(블로그 권고는 5–20개)"
checked = 2026-10-22
source = "p10 후보 10, p14 후보 6 — 학위논문 요약·사례·블로그, 검색 요약만. 강도 약"

[[fact]]
id = "F_r_implementation_intention"
text = "실행 의도('언제·어디서·무엇을' 미리 한 문장으로 정하기)는 목표 달성을 높인다. 메타분석 평균 d≈0.65(Gollwitzer & Sheeran 2006, 시험 94건). 교육 장면 결과는 엇갈리고 완벽주의·시험 불안이 높으면 역효과 보고가 있다"
checked = 2026-10-22
source = "p14 후보 4 — 메타분석, 검색 요약만(위키 2차 자료는 열어 읽음). 강도 강"

[[fact]]
id = "F_r_streak"
text = "연속 학습일(스트릭)을 일일 목표와 분리한 회사 A/B 실험에서 14일 재방문이 상대 3.3% 올랐다(Duolingo 공개 자료). 독립 연구는 없고, 스트릭 집착·불안·부정행위 보고가 있다. 빠진 날을 한 번 막아 주는 보호 장치가 복귀를 올렸다는 2차 보고가 있다"
checked = 2026-10-22
source = "p14 후보 1·2·6, p11 후보 3 — 회사 자료·2차 기사, 검색 요약만. 강도 중(방향) / 약(수치)"

[[fact]]
id = "F_r_endowed_progress"
