conditions = ["F_known_not_retested"]
evidence = ["F_apps_review_backlog"]
harms = ["G_system"]
test_plan = "재생: 하루 복습 대기 수의 분포. 사용자 판정: 밀려서 열기 싫었던 날이 있었나"
note = "R_known_retest의 부작용. 상한을 두는 조건으로 받아들일지 사용자 결정 대기"

[[hypothesis]]
id = "H_app_only_gap"
text = "앱 단어 학습만으로는 문법·말하기 빈틈이 느껴져 보조 수단(짧은 강의·교재·회화 연습)이 필요해진다. 근거는 한국인 기록 1건이다"
source = "p12 후보 1·4·5 (약)"
conditions = ["S_zero_level"]
evidence = ["F_korean_cases"]
test_plan = "사용자 판정: 몇 주 뒤 '앱만으로 모자라다'고 느끼는가. 느끼면 그때 수업·교재 조사"

[[hypothesis]]
id = "H_hours_needed"
text = "앱 효과 보고는 수십 시간 누적 뒤의 측정이고 한국인 N5 합격 기록은 60~150시간이 들었으므로, 하루 분량이 작으면 여행 전까지 누적 시간을 기록하고 같은 방식의 측정을 주기적으로 해야 효과를 알 수 있다. 하루 30분·3개월(약 45시간)이면 목표를 '인식 + 짧은 요청문'으로 좁히는 것이 맞다"
source = "p10 후보 12, p12 후보 10·11 (약, 원문 확인)"
conditions = ["F_event_log_local"]
evidence = ["F_r_app_effects", "F_korean_cases"]
test_plan = "이벤트 로그로 누적 학습 분을 세고, 2주마다 같은 20장 확인 카드로 정답률을 잰다"

[[fact]]
id = "F_travel_prepared_cases"
text = "준비 기간과 결과가 둘 다 적힌 사례 2건: 한국어 화자가 약 2개월 독학 뒤 여행에서 '회화는 안 됐지만 듣기·읽기가 달라졌다'; 영어 화자가 약 6개월 읽기 위주(가나 + 한자 약 200자) 준비 뒤 긴 여행에서 읽기가 유용했고 가타카나 부족이 음식 장면의 병목. 1~3주 짧은 준비 사례는 찾지 못함(최단 2개월). 무준비 실패 사례 1건"
checked = 2026-10-22
source = "p13 후보 18·19·25 — 개인 후기(블로그·커뮤니티 원문 확인). 강도 약(2건)"

[[fact]]
id = "F_textbooks"
text = "한국 교재 4종 목차(원문): 다이스키 STEP 1과 해커스 N5는 가나·문자를 앞에 몰아 두고, 일본어 무작정 따라하기(60과·71일 진도표)는 소리·문장부터 하고 가나는 부록, 민나노 니홍고 초급 1은 1과부터 문장이며 회화에 'これをください', 'お願いします', 'ありますか' 같은 여행 요청문이 들어 있다. 일무따와 다이스키는 '한국 사람이 잘 틀리는 표현' 장을 따로 둔다"
checked = 2026-10-22
source = "p12 각도 요약 — 예스24 목차 원문 확인. 강도 중(구조 사실)"

[[hypothesis]]
id = "H_deadline_starts"
text = "여행 날짜 같은 기한이 공부를 시작시키고 이어 가게 한다. 한국인 기록에서는 시험 접수가 그 역할을 했다(4건 공통). 앱에 여행 날짜를 넣어 남은 날과 하루 양을 보여 주면 같은 효과를 기대할 수 있다"
source = "p12 후보 11·16·21·22 (원문 확인, 약)"
conditions = ["S_goal_travel"]
evidence = ["F_korean_cases"]
test_plan = "사용자 판정: 여행 날짜가 보이니 시작이 쉬웠나. 재생: 날짜 입력 전후의 주당 학습일 수"

[[hypothesis]]
id = "H_reading_first_gain"
text = "두 달 안팎의 짧은 준비에서는 읽기·듣기가 먼저 늘고 말하기는 늘지 않는다. 목표를 '간판·메뉴·핵심 단어 인식 + 짧은 요청문'으로 두는 것이 실제 결과와 맞고, 말하기는 요청문 몇 개로 좁힌다"
source = "p13 후보 18·19, p12 후보 10 (원문 확인, 약 — 사례 3건)"
conditions = ["S_goal_travel", "S_zero_level"]
evidence = ["F_travel_prepared_cases", "F_korean_cases"]
test_plan = "사용자 판정: 여행 뒤 읽기·듣기·말하기 중 무엇이 됐나"

[[hypothesis]]
id = "H_first_interval_same_day"
text = "첫 복습을 다음 날로 고정하지 않고 학습 당일 세션 끝에 한 번 더 떠올리게 하면(그 뒤 1일→3일→7일→14일) 떠올리기 횟수가 5회에 가까워져 더 남는다. 앱들은 첫 간격을 4시간이나 며칠로 두어 1일 고정과 다르고, 연구는 간격 모양보다 횟수와 전체 기간이 중요하다고 한다. 같은 날 여러 번은 기여가 적다는 매뉴얼 주장과 맞서므로 당일 재확인은 1회로 둔다"
source = "p11 후보 1·2·7 (공식 문서 원문), p10 후보 13 (약~중)"
conditions = ["F_review_intervals"]
evidence = ["F_apps_review_backlog", "F_r_batch_size"]
test_plan = "재생: 당일 재확인 1회가 있는 항목과 없는 항목의 다음 날 정답률 비교"

[[hypothesis]]
id = "H_pronunciation_hideable"
text = "한글·로마자 발음 표기는 글자를 몰라도 소리를 내게 하지만 표기만 보게 되어 가나가 안 느는 함정이 있으므로, 눌러야 보이게(가릴 수 있게) 둔다. 지금 앱은 이미 '발음 보기'를 눌러야 보여 맞다"
source = "p12 후보 7·8·25·26·30 (원문 확인, 약)"
conditions = ["F_kana_same_flow"]
evidence = ["F_korean_cases"]
test_plan = "재생: 발음 공개 비율의 추이(가나를 익힐수록 줄어야 한다)"

# ---------- 규칙: 조사 근거로 제안하는 설계 결정 (모두 가설, 사용자 판정 대기) ----------
[[rule]]
id = "R_known_retest"
version = 1
status = "hypothesis"
method = "학습 카드에서 '알았음'을 누른 항목도 다음 날 복습 카드로 한 번 더 떠올려 판단하게 한다. 맞히면 완료, 틀리거나 헷갈리면 복습 흐름에 넣는다"
reason = "본 직후의 자기 판단은 과신하기 쉽고, 떠올리기와 정답 피드백이 장기 기억을 만든다"
serves = ["G_recognize"]
conditions = ["F_known_not_retested", "S_zero_level"]
evidence = ["F_r_feedback", "F_r_retrieval"]
side_effects = ["H_backlog_risk"]
test_plan = "재생: 알았음 항목의 다음 날 오답률(H_known_overconfident). 사용자 판정: 복습이 늘어 부담이었나"
note = "H_false_known_lost(audit 오류)를 고치는 제안. 받아들이면 앱 변경 뒤 F_known_not_retested를 새 사실로 갱신"

[[rule]]
id = "R_two_directions"
version = 1
status = "hypothesis"
method = "표지판·메뉴·교통 단어는 외국어를 보고 뜻을 떠올리는 카드로 복습하고, 요청문 패턴과 핵심 요청 표현은 뜻(장면)을 보고 외국어를 떠올리는 카드와 음성을 듣고 따라 말하는 선택 연습으로 따로 복습한다"
reason = "연습한 방향이 그 방향 시험에 남는다. 알아보기 목표와 말하기 목표는 방향이 다르다"
serves = ["G_recognize", "G_request"]
conditions = ["F_review_one_direction", "S_goal_travel"]
evidence = ["F_r_direction"]
test_plan = "사용자 판정: 여행에서 요청문을 말했나. 재생: 생산 방향 카드 정답률"
note = "H_recognition_only_gap(audit 오류)을 고치는 제안"

[[rule]]
id = "R_spacing_wider"
version = 1
status = "hypothesis"
method = "복습 간격을 학습 당일 세션 끝 재확인 1회 → 맞힘 1회 1일 → 2회 3일 → 3회 7일 → 4회 14일 → 완료로 넓힌다. 틀리면 1일로 돌아가고 헷갈림은 현재 간격 유지. 여행 날짜가 가까우면 마지막 간격을 여행 전으로 당긴다"
reason = "복습이 걸친 전체 기간이 길고 떠올리기 횟수가 많을수록(5회) 장기 기억이 크다. 지금 간격(1·1·4일)은 전체 6일·3회라 여행까지 몇 주를 남기기엔 짧다. 확장 간격이냐 고정이냐는 차이가 없으므로 숫자 모양은 덜 중요하다"
serves = ["G_recognize"]
conditions = ["F_review_intervals", "S_goal_travel"]
evidence = ["F_r_spacing", "F_r_batch_size", "F_apps_review_backlog"]
test_plan = "재생으로 두 간격표를 비교(H_spacing_total_span, H_first_interval_same_day). 사용자 판정"
note = "원문 확인(2026-10-22) 뒤 당일 재확인 1회를 더하고 이유를 '전체 기간과 횟수'로 고쳤다. 숫자(3·7·14)는 여행까지 남은 기간에 맞춰 조정한다"

[[rule]]
id = "R_scene_units"
version = 1
status = "hypothesis"
