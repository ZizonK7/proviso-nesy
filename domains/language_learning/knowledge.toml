test_plan = "재생: 보조 트랙 진도와 발음 표기 공개 비율. 사용자 판정: 메뉴를 읽었나(H_kana_side_track)"
note = "v1에서 더한 조건: S_conversation_first — 가나를 선행 조건에서 보조 트랙으로 옮겼다. 결정 2026-10-22(AI, 사용자 위임): 채택"

[[rule]]
id = "R_data_own_scripts"
version = 1
status = "hypothesis"
method = "앱 데이터의 대화 줄은 자체 작성한다: 복수 공개 출처에 공통으로 나오는 정형 접객 표현(F_travel_scripts)을 바탕으로 장면당 줄을 쓰고, 줄마다 근거 출처(어느 자료의 어느 장면)와 검토 기록을 남긴다. NHK Easy Japanese·いろどり·유튜브 대본과 음성은 개인 학습 참고로만 쓰고 앱에 넣지 않는다. 음성은 내장 TTS로 만든다. 미확보 장면(식당 입장 인원, 시착, 면세 점원 말)은 '원문 미확인' 표시를 달고 사용자 여행 뒤 실제 들은 말로 고친다"
reason = "NHK는 개인 용도 한정이 원문으로 확인됐고 いろどり는 라이선스 문장을 못 봤다. 정형 접객 표현 자체는 여러 공개 자료에 같은 문장으로 나온다"
serves = ["G_evidence", "G_use_in_japan"]
conditions = ["F_data_generated_unreviewed", "F_nhk_easy_japanese"]
evidence = ["F_travel_scripts", "F_nhk_easy_japanese"]
test_plan = "줄마다 출처 칸이 비어 있지 않은지 센다. 사용자 판정: 여행에서 실제 들은 말과 달랐던 줄"
note = "결정 2026-10-22(AI, 사용자 위임): 채택. R_data_review와 같이 한다"

[[rule]]
id = "R_ui_patterns_v1"
version = 1
status = "hypothesis"
method = "화면은 실제 화면 3앱 이상에서 같은 패턴을 가져온다(출처 앱 → Material 3). 홈: 맨 위에 '오늘 복습 N개 · 새 장면 1 · 남은 날 · 연속 N일(보호 1)' 한 줄과 다음 행동 버튼, 장면은 목록형(원형 완료 표시)으로 — 경로형은 Duolingo뿐이고 목록형이 4앱(Navigation bar 4탭 유지). 레슨 안: 상단 얇은 막대 + '3/10'(Linear progress). 카드: 정답을 바로 주지 않고 소리 내 말하기·고르기를 먼저 받은 뒤 공개, 차이는 색으로, 힌트는 뜻 → 첫 소리 → 정답, 판단 버튼 아래에 다음 복습 시점('내일'·'7일 뒤')(Card·Button). 말하기: 하단 중앙 큰 마이크 '눌러서 말하기', 옆에 힌트·한국어 보기 전환; 말한 뒤 내 문장(자기 판정)↔정답 문장을 위아래로 + 내 녹음·TTS 바꿔 듣기 버튼 둘, 점수 없음. 듣기(점원 줄): 재생 + 구간 막대 + 느리게(거북) + 자막 토글, 보기 3개 고르기. 역할극: 맨 위 목표 칩('점원에게 봉투는 필요 없다고 말해 보세요') → 점원 말풍선(음성) → 응답 칩 2개 또는 마이크 → 힌트(Card·Assist chip). 복습 탭: 대상을 '들을 줄·말할 줄·읽을 줄' 세 칸으로 모아 보여 줌(Badge). 온보딩: 한 화면에 질문 하나 — 목표 카드 4개 이하 → 여행 날짜 → 하루 시각(Date/Time picker는 근거 없음, 일반론). 완료: '맞은 수 N/M + 내일 복습 N개' 한 장과 다음 버튼, 7일·30일 연속 같은 고비에만 축하 한 장(Dialog). 복귀: 홈의 연속 숫자와 보호 1회 표시는 근거 있음; 끊긴 뒤 화면은 근거가 없어 '오늘 다시 시작' 한 줄 + 가장 짧은 단위(일반론). 알림·설정: 알림 종류 목록 + 토글, 권한은 첫 레슨 뒤 이유 한 줄과 함께; 시각 선택은 일반론. 오류·빈 상태: 이유 한 줄 + 대안 버튼(Snackbar 공식 예시, 일반론). 화면 코드마다 출처 앱을 주석으로 남긴다"
reason = "같은 역할의 화면을 앱 3개 이상에서 비교해 공통된 방식을 가져온다(R_ui_borrow). 실제 화면 70장을 직접 확인해 홈·카드·말하기 입력·역할극·듣기는 3앱 이상이 같았고, 나머지는 2앱 이하라 중·약"
serves = ["G_borrow_ui", "G_system"]
conditions = ["F_ui_patterns", "F_no_reminder"]
evidence = ["F_ui_patterns", "F_r_streak", "F_r_implementation_intention"]
test_plan = "사용자 판정: 화면이 낯설지 않았나. 화면마다 출처 주석이 있는지 센다. 근거 '약'인 화면(복귀·오류·알림 시각·녹음 점수)은 사용 뒤 고친다"
note = "결정 2026-10-22(AI, 사용자 위임): 채택. 처음(v2 글 근거)에는 강 0이었고, 같은 날 스크린샷 회차(p28, v3·v4)로 강 5·중 7·약 1이 됐다. 목록형 홈·목표 칩·완료 고비 축하·복습 세 칸은 그때 더한 것"

[[rule]]
id = "R_asr_later"
version = 1
status = "hypothesis"
method = "첫 버전은 말하기 판정을 자기 판정(됐다/막혔다) + 내 녹음·TTS 바꿔 듣기로 한다. 음성 인식 채점은 여행 뒤 사용자 판정에서 '발음 때문에 못 알아들었다'가 나오면 2차로 넣는다(안드로이드 SpeechRecognizer, 일본어)"
reason = "혼자 연습에서 ASR 효과는 불확실하고(g=0.44, CI에 0) 과교정 불만이 반복된다. 점수보다 '상대가 알아들었는가'가 기준이다"
serves = ["G_system"]
conditions = ["S_solo_app", "F_tts_builtin"]
evidence = ["F_r_asr_meta", "F_apps_speaking_loop", "F_ui_patterns"]
against = ["F_r_asr_meta"]
test_plan = "사용자 판정: 여행에서 못 알아들은 말의 원인(H_asr_not_first)"
note = "결정 2026-10-22(AI, 사용자 위임): 채택"

[[rule]]
id = "R_measure_cycle"
version = 1
status = "hypothesis"
method = "모든 줄의 결과(듣기 정답, 말하기 자기 판정, 힌트 사용, 쉐도잉 횟수)를 이벤트 로그에 남기고, 2주마다 같은 확인 세트(장면당 점원 줄 2 + 손님 줄 2)로 정답률을 잰다. 누적 학습 시간을 홈에 센다. 여행 뒤 장면별로 '들렸다/말했다/못 했다'를 받아 판정 기록(source=user)으로 넣고, 못 한 줄은 조건을 더해 쪼갠다"
reason = "앱 효과는 수십 시간 뒤에 보이고, 판정의 기준은 사용자 실사용이다. 2주 확인 세트는 재생 검사의 재료가 된다"
serves = ["G_evidence"]
conditions = ["F_event_log_local", "S_goal_travel"]
evidence = ["F_r_app_effects", "F_korean_cases"]
test_plan = "확인 세트가 2주마다 실행됐는지 로그에서 센다"
note = "결정 2026-10-22(AI, 사용자 위임): 채택. 제안 v0.1의 10번"

