source = "p11 후보 9, p10 후보 7 (약)"
conditions = ["F_kana_same_flow"]
evidence = ["F_apps_mcq", "F_r_retrieval"]
test_plan = "재생: 듣고 고르기 문항의 정답률과 이후 단어 읽기 속도. 사용자 판정"

[[hypothesis]]
id = "H_scene_units"
text = "학습 단위를 여행 장면(식당, 역·교통, 편의점·상점, 숙소, 길 묻기, 긴급)으로 묶고 식당·역·상점을 앞에 두며, 장면 안에서 읽기 단어와 말하기 문장을 한 쌍으로 두면 여행에서 꺼내기 쉽고 불편의 대부분을 먼저 덮는다"
