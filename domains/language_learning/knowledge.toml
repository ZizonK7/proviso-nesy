[[fact]]
id = "F_travel_scripts"
text = "장면별로 실제 오가는 말이 원문으로 모였다. 편의점(여러 출처 일치): 「ポイントカードはお持ちですか」「温めますか」「袋、ご利用ですか」「お箸とスプーン、お付けしますか」「お次でお待ちの方」 → 손님 「はい」「大丈夫です」「ないです」. 식당(NHK #20·#27·#33, 업계 글 2): 「ご注文は？」「ご注文は以上でよろしいでしょうか」「お待たせいたしました」「お会計は〇〇円でございます」「伝票をお預かりいたします」 → 「それください」「○○にします」「どれが一番おいしいですか」「どのくらい待ちますか」. 역·길(jepang.org, cotoacademy): 「三番線です」「まもなく、電車が参ります」「まっすぐ／右／左側」 → 「○○行きは何番線ですか」「○○はどこですか」「乗り間違えました」. 택시(NHK #15): 「どちらまで？」「ドアが開きます」 → 「○○までお願いします」「ここで止めてください」. 호텔(아키타현 접객 시트, MATCHA, NHK #36·#37): 「ご予約のお名前をお伺いします」「宿泊者名簿にご記入ください」「チェックアウトは◯◯時です」 → 「チェックイン／鍵／チェックアウト、お願いします」「朝食は何時ですか」「テレビがつかないんですが」. 약국(NHK #25, 京都市 PDF): 「〇〇が痛いんです」, 점원의 쉬운 말 바꾸기 「朝・昼・夜のごはんの後に飲んでください」. 쇼핑(NHK #19·#10·#11, Square): 「これ、いくらですか」「カードは使えますか」「○○はありますか」 → 「○○円です」「はい、使えます」「○○サイズでお間違いありませんか」. 미확보: 식당 입장 인원 말, 사이즈·시착의 손님 말, 면세 점원 말(절차만: 여권 필수)"
