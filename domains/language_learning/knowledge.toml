note = "결정 2026-10-22(AI, 사용자 위임): 채택"

[[rule]]
id = "R_kana_plan_v2"
version = 2
status = "hypothesis"
method = "가나는 대화 트랙과 분리된 보조 트랙으로 둔다. 모든 줄에 한글 발음 표기와 TTS를 붙여 가나를 몰라도 대화 트랙이 진행되게 하고(표기는 눌러야 보임), 보조 트랙은 가타카나 음식·메뉴 글자부터 하루 몇 글자씩 v1의 방식(그림·소리 연상, 듣고 고르기, 비슷한 쌍 섞기)으로 간다. 히라가나는 그다음, 한자는 역·출구 몇 개만 읽기 줄로"
reason = "사용자 우선순위가 글자보다 대화이고, 메뉴 읽기 병목은 가타카나이므로 가타카나만 앞에 둔다. 연상·섞기 방식의 근거는 v1과 같다"
serves = ["G_recognize"]
conditions = ["F_kana_same_flow", "F_kana_basic_only", "S_zero_level", "S_conversation_first"]
