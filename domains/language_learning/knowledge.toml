# ---------- 사실: 연구·사례 근거 (검색 요약 기준) ----------
[[fact]]
id = "F_r_retrieval"
text = "떠올리기(인출 연습)는 다시 읽기보다 장기 기억에 낫다. 메타분석 g=0.50(Rowland 2014, 효과 크기 159개), 교실 메타분석 g=0.499(222편), 단어 쌍 실험 1주 뒤 80% vs 36%(Karpicke & Roediger 2008). Dunlosky 2013 리뷰에서 인출 연습과 분산 연습만 '높음' 등급. 피드백이 있으면 인출 효과가 g=0.73으로 없을 때(0.39)의 거의 두 배"
checked = 2026-10-22
source = "p10 후보 2·3·11 — 메타분석·통제 연구, 원문 확인(전문·초록). 강도 강"

[[fact]]
id = "F_r_spacing"
text = "복습 사이 간격을 두면 장기 기억이 커진다(Cepeda 2006 메타분석 271건: 간격 둠 47.3% vs 몰아서 36.7%; 간격 둔 인출 g=0.74, Latimier 2021; 간격 긴 반복 인출이 짧은 것보다 약 200% 향상, Karpicke & Bauernschmidt 2011). 확장 간격과 고정(균등) 간격의 차이는 없다(Latimier g=0.03, Cepeda p=.61, Nakata 2015의 작은 이득은 수용 시험에만). 복습이 걸친 전체 기간이 길수록, 그리고 인출 횟수가 많을수록(5회가 가장 좋았고 4주 뒤에도 남음) 효과가 크다"
checked = 2026-10-22
source = "p10 후보 1·13, p14 후보 14 — 메타분석·통제 연구, 원문 확인(전문·초록; Kim & Webb 2022 g≈0.40은 2차 인용만). 강도 강"

[[fact]]
id = "F_r_direction"
text = "외국어를 보고 뜻을 알아보기(수용)는 뜻을 보고 외국어를 떠올리기(생산)보다 쉽고, 연습한 방향이 그 방향 시험에 더 잘 남는다. 같은 시간이면 수용 과제가, 시간을 충분히 쓰면 생산 과제가 전체 지식에 유리하다(Webb 2005 실험 1·2). 두 방향의 차이는 빈도가 낮은 단어에서 더 크다"
checked = 2026-10-22
source = "p10 후보 4 — 통제 실험(한국어·일본어 학습자 대상 아님), 초록 원문 확인. 강도 중"

[[fact]]
id = "F_r_interleave"
text = "섞어 배우기(interleaving)는 자료 종류에 따라 반대로 간다. 그림·시각 자료의 범주 구별에서는 섞기가 중간 크기로 낫지만(Brunmair & Richter 2019 메타분석 전체 g≈0.42), 단어 자료에서는 몰아서 배우기가 낫다(같은 메타분석, g=−0.39). 글자 모양 구별에 대한 직접 근거는 없다"
checked = 2026-10-22
source = "p10 후보 5 — 메타분석, 초록 원문 확인. 1차 판정('섞기가 낫다')이 원문 확인으로 뒤집힘(2026-10-22). 강도 중"

[[fact]]
id = "F_r_mnemonic"
text = "소리가 비슷한 모국어 낱말로 뜻을 잇는 키워드 기억술은 첫 회상에 큰 이득(72% vs 46%, Atkinson & Raugh 1975)이나 지속성은 의문(Dunlosky 2013 '낮음' 등급). 한국인 독학 기록 3건(독립)에서는 가나를 손으로 써서 안 외워지다가 그림 연상 영상으로 1~3시간 만에 외웠다. 긴 이야기형보다 짧은 연상 한 줄이 낫다는 소규모 근거"
checked = 2026-10-22
source = "p10 후보 6(초록 원문 확인), p12 후보 11·20·21(블로그 원문 확인), p11 후보 10·11 — 통제 실험·개인 후기 3건. 강도 중"

[[fact]]
id = "F_r_feedback"
text = "정답을 바로 보여 주면 틀린 답을 고칠 뿐 아니라 확신 없이 맞힌 답의 유지율이 두 배가 된다(Butler 2008). 피드백 시점은 교실 연구는 즉시, 실험 연구는 지연이 유리(Kulik & Kulik 1988)하나 외국어 플래시카드에서는 지연 이득이 없어(Nakata 2013) 즉시 피드백이 안전하다. 자기 판단(알았음/몰랐음)은 방금 본 직후보다 잠시 뒤 떠올린 뒤에 할 때 실제 기억과 더 잘 맞는다(Nelson & Dunlosky 1991)"
checked = 2026-10-22
source = "p10 후보 11 — 메타분석·통제 연구, 초록 원문 확인. 강도 중"

[[fact]]
id = "F_r_batch_size"
text = "한 번에 배우는 묶음 크기보다 같은 단어를 다시 만나는 간격과 횟수가 기억을 가른다(간격을 같게 두면 묶음 크기 차이가 사라짐; 플래시카드는 인출 5회가 가장 좋았고, 문맥에서는 10회쯤 만나야 상당한 학습). 하루 몇 개가 적당한지의 실험 근거는 없다(블로그 권고 5–20개). 한 앱의 기본값은 하루 새 카드 20개이고 그러면 복습이 약 200개가 된다"
checked = 2026-10-22
source = "p10 후보 10·13, p14 후보 6, p11 후보 1(Anki 매뉴얼 원문) — 학위논문·사례·공식 문서, 일부 원문 확인. 강도 약(하루 개수) / 중(횟수)"

[[fact]]
