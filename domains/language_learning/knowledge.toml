text = "가나처럼 모양과 소리가 이어지지 않는 글자에는 소리가 비슷한 한국어 낱말이나 짧은 그림 연상 한 줄과 획순을 붙이면 초기 회상이 는다. 긴 이야기형은 피한다. 지속성은 의문이지만 '가나 단계에서 포기'를 막는 지름길로서 가치가 있다"
source = "p10 후보 6(원문 확인, 중), p12 후보 11·20·21(원문 확인, 독립 3건), p11 후보 10·11"
conditions = ["F_kana_same_flow", "S_korean_native"]
evidence = ["F_r_mnemonic", "F_korean_cases"]
test_plan = "재생: 연상이 붙은 글자와 없는 글자의 첫 주 정답률 비교(A/B). 사용자 판정: 가나를 며칠 만에 읽었나"

[[hypothesis]]
id = "H_kana_recall_input"
