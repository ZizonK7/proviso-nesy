test_plan = "재생: 알림 설정 전후의 주당 학습일 수. 사용자 판정"

[[hypothesis]]
id = "H_streak_small_min"
text = "연속 기록은 아주 작은 하루 최소 분량(복습 완료, 없으면 새 항목 1개) 기준으로 세고, 하루 빠지면 보호 1회나 '수리'로 끊기지 않게 하며, 빠진 뒤 복귀 화면은 지난 기록을 따지지 않고 가장 짧은 단위로 시작하게 하면 복귀율이 오른다. 대가: 최소 분량을 낮추면 일일 목표 완료율은 내려갈 수 있다"
source = "p14 후보 1·2·3·6·10·13 (원문 확인, 중)"
conditions = ["F_streak_from_log"]
evidence = ["F_r_streak", "F_r_habit_days", "F_korean_cases"]
test_plan = "재생: 빠진 다음 날 복귀 비율, 하루 최소 분량 완료율. 사용자 판정: 스트릭이 압박이었나 도움이었나"

[[hypothesis]]
id = "H_endowed_start"
text = "시작 진도를 일부 채워 보여 주면(한국어와 소리가 비슷한 단어, 이미 아는 외래어를 '아는 것'으로 먼저 세기) 초기 이탈이 준다. 소비 행동 실험의 전이라 확신은 낮다"
source = "p14 후보 8, p12 후보 7 (중→약)"
conditions = ["S_korean_native"]
evidence = ["F_r_endowed_progress"]
test_plan = "사용자 판정: 첫 화면에서 '이미 아는 것'이 보이니 시작이 쉬웠나"

[[hypothesis]]
id = "H_backlog_risk"
text = "알았음 항목까지 복습에 넣으면 복습 대기열이 커져 밀림이 포기 이유가 될 수 있다. 하루 복습 상한과 새 학습 일시 정지가 필요하다"
