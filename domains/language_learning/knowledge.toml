[[hypothesis]]
id = "H_korean_kanji_meaning"
text = "한국어 화자는 한자어의 뜻을 이미 알아 단어 뜻 쪽은 빨리 쌓지만, 소리와 자형이 달라 '아는 한자'가 오히려 발음 함정이 된다. 사용자의 한자 지식 수준은 아직 모른다"
